<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380" role="img" aria-label="PULSO stacked logo on dark">
  <title>PULSO — stacked lockup (dark) with pulse motif</title>
  <rect x="0" y="0" width="480" height="380" rx="24" fill="#0E1B2A"/>
  <!-- ball mark -->
  <g>
    <circle cx="240" cy="118" r="54" fill="#C2F03C"/>
    <path d="M202 74 C234 99 234 137 202 162" fill="none" stroke="#0E1B2A" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
    <path d="M278 74 C246 99 246 137 278 162" fill="none" stroke="#0E1B2A" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  </g>
  <!-- wordmark -->
  <text x="240" y="258" text-anchor="middle" font-family="'Space Grotesk','Inter',Arial,sans-serif" font-size="78" font-weight="700" fill="#F6F7F2" letter-spacing="4">PULSO</text>
  <!-- pulse / heartbeat motif (reinforces 'pulso') -->
  <path d="M110 296 L190 296 L210 274 L234 320 L258 286 L276 296 L370 296" fill="none" stroke="#C2F03C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="240" y="346" text-anchor="middle" font-family="'Inter',Arial,sans-serif" font-size="17" font-weight="500" fill="#8A94A3" letter-spacing="5">FIND YOUR PULSO</text>
</svg>
