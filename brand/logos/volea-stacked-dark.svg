  <rect x="0" y="0" width="480" height="360" rx="24" fill="#0E1B2A"/>
  <!-- ball mark -->
  <g>
    <circle cx="240" cy="120" r="56" fill="#C2F03C"/>
    <path d="M200 74 C233 100 233 140 200 166" fill="none" stroke="#0E1B2A" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
    <path d="M280 74 C247 100 247 140 280 166" fill="none" stroke="#0E1B2A" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
