<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elva Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#685D54;color:#1B1B1B;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{background:#FFFDF7;border:1px solid rgba(27,27,27,.2);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:#9CC9FF;box-shadow:0 0 0 3px rgba(156,201,255,.3)}
textarea{resize:vertical;min-height:70px}
::placeholder{color:#857B6C}

/* app shell: sidebar + main */
.app{display:flex;min-height:100vh}
.side{width:220px;flex:none;background:#453D35;color:#FBF7F4;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px}
.mark{display:flex;align-items:center;gap:10px}
.mark svg{width:32px;height:32px}
.mark b{font-family:Georgia,serif;font-weight:400;font-size:15px;letter-spacing:.5px}
.mark small{display:block;font-size:8px;letter-spacing:2px;color:#EFEAE2;opacity:.75}
.side-title{font-family:Georgia,serif;font-size:19px;color:#EFEAE2;border-bottom:1px solid rgba(251,247,244,.2);padding-bottom:12px}
.side-title i{font-style:italic}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:9px;font-size:13px;color:#EFEAE2}
.nav button span{width:16px;text-align:center;opacity:.7;font-size:12px}
.nav button:hover{background:rgba(156,201,255,.3);color:#FBF7F4}
.nav button.on{background:#9CC9FF;color:#1B1B1B}
.nav button.on span{opacity:1}
.nav .more{font-size:10px;letter-spacing:1.5px;color:#EFEAE2;opacity:.6;margin:12px 10px 4px}
.qc{background:#9CC9FF;color:#1B1B1B;font-weight:700;border-radius:999px;padding:11px 14px;font-size:13px}
.qc.sm{width:34px;height:34px;padding:0;font-size:18px}
.main{flex:1;min-width:0;background:#685D54;overflow-x:hidden}
.topbar{display:none;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:#453D35;color:#FBF7F4;position:sticky;top:0;z-index:40}
.topbar .serif{font-size:17px;flex:1}
.burger{color:#FBF7F4;font-size:20px;padding:4px 6px}
.hdr-date{font-family:Georgia,serif;font-size:13px;color:#EFEAE2}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60}
@media(max-width:820px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-100%);transition:transform .2s;height:100%}
  body.nav-open .side{transform:none}body.nav-open .scrim{display:block}
  .topbar{display:flex}
}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
.page{display:none}.page.on{display:block}
.title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px;color:#FBF7F4}
.title h1{font-size:28px}
.title .sub{color:#EFEAE2;font-size:13px}
.title .spacer{flex:1}
.pill{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;color:#FBF7F4;border:1px solid rgba(251,247,244,.35)}
.pill:hover{background:rgba(156,201,255,.3)}
.pill.on{background:#9CC9FF;color:#1B1B1B;border-color:#9CC9FF}
.seg{display:inline-flex;background:#F4F0E4;border-radius:999px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:#372F28}
.seg button.on{background:#9CC9FF;color:#1B1B1B}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g31{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g13{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.grid>*{min-width:0}.card{min-width:0}
@media(max-width:820px){.g2,.g3,.g31,.g13{grid-template-columns:1fr}}
.big{font-family:Georgia,serif;font-size:34px;line-height:1;color:#1B1B1B}
.big small{font-size:14px;color:#857B6C;margin-left:4px}
.eyebrow{font-size:10px;letter-spacing:1.5px;color:#857B6C;margin-bottom:6px}
.onegoal{display:flex;align-items:center;gap:12px;background:#F4F0E4;border-left:5px solid #9CC9FF;border-radius:12px;padding:12px 16px;margin-bottom:14px}
.onegoal input{background:transparent;border:none;padding:4px 0;font-family:Georgia,serif;font-size:18px}
.onegoal input:focus{box-shadow:none}
.star{width:30px;height:30px;border-radius:50%;border:1.5px solid #9CC9FF;display:flex;align-items:center;justify-content:center;color:#372F28;flex:none;cursor:pointer}
.star.on{background:#4F7A4A;border-color:#4F7A4A;color:#fff}
/* timetable grid */
.ttg{display:grid;grid-template-columns:40px repeat(5,minmax(0,1fr));gap:4px;position:relative}
.ttg .dh{font-size:11px;color:#857B6C;text-align:center;padding-bottom:4px}
.ttg .dh.today{color:#1B1B1B;font-weight:700}
.ttg .hl{font-size:10px;color:#857B6C;text-align:right;padding-right:4px;height:44px}
.ttg .dc{position:relative;background:#FAF7EE;border-radius:8px}
.ttg .dc div.line{height:44px;border-top:1px solid rgba(27,27,27,.08)}
.blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:5px 7px;font-size:11px;line-height:1.25;overflow:hidden;border-left:4px solid;color:#1B1B1B;cursor:pointer}
.blk b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{color:#372F28;font-size:10px}
@media(max-width:820px){.ttg{grid-template-columns:40px 1fr}.ttg .dh,.ttg .dc{display:none}.ttg .dh.show,.ttg .dc.show{display:block}}
/* cards */
.card{background:#F4F0E4;border:1px solid rgba(27,27,27,.2);border-radius:14px;padding:14px 16px}
.card h2{font-size:18px;margin-bottom:10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h2 small{font-family:Arial,sans-serif;font-size:12px;color:#857B6C;font-weight:400}
.card h2 .r{margin-left:auto;font-family:Arial,sans-serif;font-size:12px}
.card h3{font-size:15px;margin:8px 0 6px;color:#372F28}
.inner{background:#E6E0CF;border-radius:10px;padding:10px 12px}
.row{background:#FAF7EE;border-radius:8px;padding:7px 10px;display:flex;align-items:center;gap:8px;margin-bottom:5px;min-height:34px}
.row.done{opacity:.55}.row.done .nm{text-decoration:line-through}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:11px;color:#857B6C;white-space:nowrap}
.muted{color:#857B6C;font-size:12px}
.empty{color:#857B6C;font-size:12px;padding:10px 4px;text-align:center}
.link{color:#372F28;text-decoration:underline;font-size:12px}
.btn{background:#372F28;color:#FBF7F4;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700}
.btn.sky{background:#9CC9FF;color:#1B1B1B}
.btn.ghost{background:transparent;border:1px solid rgba(27,27,27,.25);color:#372F28}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.danger{background:#B23A2E}
.ib{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#857B6C;font-size:13px;flex:none}
.ib:hover{background:rgba(156,201,255,.3);color:#1B1B1B}

/* task bits */
.tick{width:18px;height:18px;border:1.5px solid #857B6C;border-radius:5px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:#FFFDF7}
.tick.on{background:#4F7A4A;border-color:#4F7A4A;color:#fff}
.pb{font-size:10px;font-weight:700;background:#9CC9FF;color:#1B1B1B;padding:1px 6px;border-radius:999px;flex:none}
.pb.p2{background:rgba(156,201,255,.6)}.pb.p3{background:rgba(156,201,255,.3)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.due{font-size:10px;padding:1px 6px;border-radius:999px;background:#E6E0CF;color:#372F28;flex:none}
.due.over{background:#B23A2E;color:#fff}.due.soon{background:#C8742B;color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:999px;background:#E6E0CF;color:#372F28;cursor:pointer;border:1px solid transparent}
.chip.on{background:#9CC9FF;color:#1B1B1B}
.handle{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.dragghost{position:fixed;z-index:9999;pointer-events:none;background:#FFFDF7;border:1px solid #9CC9FF;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:8px;padding:6px 10px;font-size:12px;max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
[data-drop].over{outline:2px solid #9CC9FF;outline-offset:-2px;background:rgba(156,201,255,.3)!important}

/* month grid */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mgrid .dh{font-size:11px;color:#857B6C;text-align:center;padding:2px}
.mcell{background:#FAF7EE;border-radius:8px;min-height:84px;padding:5px 6px;font-size:11px;cursor:pointer;border:1px solid transparent}
.mcell.out{opacity:.4}.mcell.today{border-color:#9CC9FF;background:#FFFDF7}
.mcell .d{font-family:Georgia,serif;font-size:13px;color:#372F28;margin-bottom:3px;display:flex;justify-content:space-between}
.ev{font-size:10px;padding:1px 5px;border-radius:4px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#1B1B1B;background:#E6E0CF;border-left:3px solid #857B6C}
.ev.done{opacity:.5;text-decoration:line-through}
@media(max-width:820px){.mcell{min-height:60px;padding:3px 4px}.ev{font-size:9px;padding:1px 3px}}

/* habits */
.hgrid{overflow-x:auto}
.hgrid table{border-collapse:collapse;font-size:11px;white-space:nowrap}
.hgrid th{font-weight:400;color:#857B6C;padding:2px 3px;text-align:center}
.hgrid td{padding:2px 3px;text-align:center}
.hgrid td:first-child,.hgrid th:first-child{text-align:left;position:sticky;left:0;background:#F4F0E4;padding-right:10px;min-width:120px}
.hb{width:16px;height:16px;border-radius:4px;background:#E6E0CF;display:inline-block;cursor:pointer}
.hb.on{background:#9CC9FF}.hb.today{outline:1.5px solid #372F28}

/* week */
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{background:#FAF7EE;border-radius:10px;padding:8px;min-height:180px;min-width:0}
.wday.today{outline:2px solid #9CC9FF}
.wday .dh{font-family:Georgia,serif;font-size:14px;color:#372F28;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;cursor:pointer}
.wday .dh small{font-family:Arial,sans-serif;font-size:10px;color:#857B6C}
.wev{font-size:11px;padding:4px 6px;border-radius:6px;margin-bottom:4px;background:#E6E0CF;border-left:3px solid #857B6C;display:flex;gap:4px;align-items:flex-start;flex-wrap:wrap;min-width:0}
.wev .t{color:#857B6C;font-size:10px;flex:none}
.wev .nm{flex:1 1 100%;min-width:0;white-space:normal;word-break:break-word;line-height:1.3}
.wev.done .nm{text-decoration:line-through;opacity:.55}
@media(max-width:820px){.wgrid{grid-template-columns:1fr}.wday{min-height:0}}

/* day timeline */
.tl{display:grid;grid-template-columns:44px 1fr;gap:0}
.tl .h{font-size:10px;color:#857B6C;padding:6px 4px 0;text-align:right;border-top:1px solid rgba(27,27,27,.12)}
.tl .slot{min-height:40px;border-top:1px solid rgba(27,27,27,.12);padding:3px 4px}
.tl .slot:hover{background:rgba(156,201,255,.15)}
.tev{font-size:12px;padding:5px 8px;border-radius:6px;background:#E6E0CF;border-left:3px solid #857B6C;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.tev .nm{flex:1}
.tev.done .nm{text-decoration:line-through;opacity:.55}

/* priorities */
.pslot{display:flex;align-items:center;gap:8px;background:#FAF7EE;border-radius:8px;padding:6px 8px;margin-bottom:6px;min-height:38px}
.pslot input{background:transparent;border:none;padding:4px;flex:1}
.pslot input:focus{box-shadow:none}
.pslot .n{font-family:Georgia,serif;width:18px;color:#857B6C}

/* modules */
.modc{border-radius:10px;padding:10px 12px;background:#FAF7EE;border-left:5px solid;margin-bottom:8px}
.modc b{display:block;font-size:14px}
.sess{font-size:11px;color:#372F28;margin:2px 0}
.tt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tt .col{background:#FAF7EE;border-radius:8px;padding:6px}
.tt .col h4{font-family:Georgia,serif;font-weight:400;font-size:13px;color:#372F28;margin-bottom:4px}
.cls{font-size:10px;padding:3px 5px;border-radius:5px;margin-bottom:3px;background:#E6E0CF;border-left:3px solid}
@media(max-width:820px){.tt{grid-template-columns:1fr}}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stage{background:#E6E0CF;border-radius:10px;padding:8px;min-height:120px}
.stage h4{font-family:Georgia,serif;font-weight:400;font-size:13px;color:#372F28;margin-bottom:6px}
.client{background:#FAF7EE;border-radius:7px;padding:6px 8px;font-size:12px;margin-bottom:5px;cursor:grab;touch-action:none}
@media(max-width:820px){.pipe{grid-template-columns:1fr 1fr}}

/* modal */
.mbg{position:fixed;inset:0;background:rgba(27,27,27,.5);z-index:500;display:none;align-items:flex-end;justify-content:center;padding:0}
.mbg.on{display:flex}
.modal{background:#F4F0E4;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:92vh;overflow:auto}
@media(min-width:600px){.mbg{align-items:center;padding:20px}.modal{border-radius:16px}}
.modal h2{font-size:20px;margin-bottom:12px}
.f{margin-bottom:10px}.f label{display:block;font-size:12px;color:#372F28;margin-bottom:4px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mact .btn:last-child{margin-left:auto}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1B1B1B;color:#FBF7F4;padding:10px 16px;border-radius:999px;font-size:12px;opacity:0;transition:.2s;z-index:1000;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.lock{position:fixed;inset:0;background:#453D35;z-index:9000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#FBF7F4}
.lock input{max-width:240px;text-align:center}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat div{background:#E6E0CF;border-radius:10px;padding:10px;text-align:center}
.stat b{font-family:Georgia,serif;font-weight:400;font-size:24px;display:block}
.stat span{font-size:11px;color:#857B6C}
@media(max-width:820px){.stat{grid-template-columns:1fr 1fr}}
.qn{width:100%;min-height:110px;background:#FFFDF7}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:700;color:#372F28;padding:6px 8px;border-bottom:1px solid rgba(27,27,27,.2)}
.tbl td{padding:6px 8px;border-bottom:1px solid rgba(27,27,27,.08);vertical-align:middle}
.steps{margin:4px 0 0 26px}
.steps .row{padding:4px 8px;min-height:28px;font-size:12px}
.small{font-size:12px}
/* chat */
.chat{display:flex;flex-direction:column;min-height:60vh}
.msgs{flex:1;overflow:auto;padding:4px 2px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:#9CC9FF;color:#1B1B1B;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#FAF7EE;border:1px solid rgba(27,27,27,.12);border-bottom-left-radius:4px}
.msg.a b{font-weight:700}
.msg .added{display:block;margin-top:8px;font-size:12px;color:#4F7A4A}
.chatin{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.chatin textarea{min-height:44px;max-height:160px}
.qp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.brief{white-space:pre-wrap;line-height:1.55;font-size:14px}
.brief b{font-weight:700}
.thinking{opacity:.6;font-style:italic}
</style>
</head>
<body>

<div class="lock" id="lock">
  <svg width="56" height="56" viewBox="0 0 56 56"><rect x="2" y="2" width="52" height="52" rx="10" fill="none" stroke="#FBF7F4" stroke-width="1.7"/><text x="28" y="35" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="#FBF7F4">EM</text></svg>
  <div class="serif" style="font-size:20px">Elva Hub</div>

</div>

<div class="app">
<aside class="side">

    <button data-p="assignments"><span>▯</span>Assignments</button>
    <button data-p="tasks"><span>≡</span>Tasks</button>
    <button data-p="claude"><span>✦</span>Claude</button>
    <div class="more">More</div>
    <button data-p="goals"><span>◇</span>Goals</button>
    <button data-p="wellness"><span>❀</span>Wellness</button>
    <button data-p="suede"><span>◈</span>Suede Studio</button>

<main class="main">

  <div class="page" id="p-tasks"></div>
  <div class="page" id="p-claude"></div>
  <div class="page" id="p-goals"></div>
  <div class="page" id="p-wellness"></div>
  <div class="page" id="p-suede"></div>
  <div class="page" id="p-notes"></div>
  <div class="page" id="p-done"></div>
  <div class="page" id="p-settings"></div>
  </div>
</main>
</div>
<div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>
<div class="mbg" id="mbg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>

// ── EVENTS: one source of truth ──
function getEvents(k){
  const d=fromKey(k),wd=d.getDay()===0?7:d.getDay();
  const out=[];
  S.tasks.filter(t=>t.day===k).forEach(t=>out.push({id:t.id,type:'task',title:t.name,time:t.time||'',col:cat(t.cat).col,done:t.done,p:t.p,ref:t}));
  if(inTerm(k))S.modules.forEach(m=>m.sessions.filter(s=>s.day===wd).forEach(s=>out.push({id:m.id+s.start,type:'class',title:m.name,time:s.start,end:s.end,col:m.col,room:s.room,ref:m})));
  S.modules.forEach(m=>m.assessments.filter(a=>a.due===k).forEach(a=>out.push({id:a.id,type:'assess',title:`${a.title} due`,sub:m.code,time:'',col:m.col,done:a.done,ref:a,mod:m})));
  S.suede.invoices.filter(i=>i.due===k&&!i.paid).forEach(i=>out.push({id:i.id,type:'invoice',title:`Invoice: ${i.client}`,time:'',col:'#C9A63F',ref:i}));
  gcalEvents.forEach(e=>{const s=e.start.slice(0,10);if(s===k)out.push({id:e.id,type:'gcal',title:e.title,time:e.allDay?'':e.start.slice(11,16),col:'#857B6C'});});
  return out.sort((a,b)=>(a.time||'00:00')<(b.time||'00:00')?-1:1).sort((a,b)=>(!a.time&&b.time)?-1:(a.time&&!b.time)?1:0);
}
function evHtml(e,cls){
  const tick=e.type==='task'?`<span class="tick ${e.done?'on':''}" onclick="event.stopPropagation();toggleTask('${e.id}')">${e.done?'✓':''}</span>`:e.type==='assess'?`<span class="tick ${e.done?'on':''}" onclick="event.stopPropagation();toggleAssess('${e.mod.id}','${e.id}')">${e.done?'✓':''}</span>`:'';
  const drag=e.type==='task'?`data-drag="task:${e.id}" class="${cls} handle ${e.done?'done':''}"`:`class="${cls} ${e.done?'done':''}"`;
  const click=e.type==='task'?`onclick="openTask('${e.id}')"`:e.type==='class'?`onclick="nav('timetable')"`:e.type==='assess'?`onclick="openAssess('${e.mod.id}','${e.id}')"`:'';
  return`<div ${drag} style="border-left-color:${e.col}" ${click}>${tick}${e.time?`<span class="t">${e.time}${e.end?'–'+e.end:''}</span>`:''}<span class="nm">${esc(e.title)}${e.room?` <span class="muted">${esc(e.room)}</span>`:''}</span>${e.p?`<span class="pb p${e.p}">P${e.p}</span>`:''}</div>`;
}

// ── DRAG (pointer events: mouse, trackpad and touch take the same path) ──
let drag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-drag]');if(!h||e.target.closest('input,textarea,select,.tick,.ib,button'))return;
  drag={el:h,data:h.dataset.drag,x:e.clientX,y:e.clientY,ghost:null,active:false,id:e.pointerId};
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.active){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;drag.active=true;
    const g=document.createElement('div');g.className='dragghost';g.textContent=drag.el.textContent.trim().slice(0,40);document.body.appendChild(g);drag.ghost=g;drag.el.style.opacity='.4';}
  e.preventDefault();
  drag.ghost.style.left=(e.clientX+10)+'px';drag.ghost.style.top=(e.clientY+10)+'px';
  document.querySelectorAll('[data-drop].over').forEach(x=>x.classList.remove('over'));
  const z=zoneAt(e.clientX,e.clientY);if(z)z.classList.add('over');
},{passive:false});
document.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(!d.active)return;   // a tap: let the click handler open the editor
  d.ghost.remove();d.el.style.opacity='';
  const z=zoneAt(e.clientX,e.clientY);document.querySelectorAll('[data-drop].over').forEach(x=>x.classList.remove('over'));
  if(z)handleDrop(d.data,z.dataset.drop);
  suppressClick=true;setTimeout(()=>suppressClick=false,300);
});
document.addEventListener('pointercancel',()=>{if(drag&&drag.ghost){drag.ghost.remove();drag.el.style.opacity='';}drag=null;});
let suppressClick=false;
document.addEventListener('click',e=>{if(suppressClick){e.stopPropagation();e.preventDefault();}},true);
function zoneAt(x,y){if(drag&&drag.ghost)drag.ghost.style.display='none';const el=document.elementFromPoint(x,y);if(drag&&drag.ghost)drag.ghost.style.display='';return el?el.closest('[data-drop]'):null;}
function handleDrop(data,zone){
  const [kind,id]=data.split(':');const z=zone.split(':');
  if(kind==='task'){
    if(z[0]==='day')moveTask(id,z[1]);
    else if(z[0]==='hour')moveTask(id,z[1],z[2]+':00');
    else if(z[0]==='pri')setPriTask(z.slice(1,-1).join(':'),+z[z.length-1],id);
    else if(z[0]==='bank')moveTask(id,'','');
    else if(z[0]==='untime')moveTask(id,z[1],'');
  }else if(kind==='client'){
    if(z[0]==='stage'){const c=S.suede.clients.find(c=>c.id===id);if(c){c.stage=z[1];save();render();}}
  }
}

// ── MONTH (landing) ──
function rMonth(){
  const m=mk(cur),first=new Date(cur.getFullYear(),cur.getMonth(),1),last=new Date(cur.getFullYear(),cur.getMonth()+1,0);
  const start=monday(first),tk=todayKey();
  let cells='';for(let d=new Date(start);d<=last||d.getDay()!==1;d=addDays(d,1)){
    const k=dk(d),out=d.getMonth()!==cur.getMonth(),ev=getEvents(k).sort((a,b)=>(a.time||'')<(b.time||'')?-1:1);
    cells+=`<div class="mcell ${out?'out':''} ${k===tk?'today':''}" data-drop="day:${k}" onclick="openDay('${k}')"><div class="d"><span>${d.getDate()}</span>${ev.length>4?`<span class="muted">+${ev.length-4}</span>`:''}</div>${ev.slice(0,4).map(e=>`<div class="ev ${e.done?'done':''}" style="border-left-color:${e.col}">${e.time?e.time+' ':''}${esc(e.title)}</div>`).join('')}</div>`;
    if(d>=last&&addDays(d,1).getDay()===1)break;
  }

function deadlineList(n){

function addQGoal(q,v){if(!v.trim())return;quarter(q).goals.push({id:uid(),t:v.trim(),steps:[]});save();render();}

function addQStep(q,g,v){if(!v.trim())return;quarter(q).goals.find(x=>x.id===g).steps.push({id:uid(),t:v.trim(),done:false});save();render();}

function delQStep(q,g,s){const G=quarter(q).goals.find(x=>x.id===g);G.steps=G.steps.filter(x=>x.id!==s);save();render();}

// ── TIMETABLE ──
const DAYN=['','Mon','Tue','Wed','Thu','Fri'];
function rTimetable(){
  const tk=todayKey(),td=new Date().getDay();
  const showDay=ttView==='day'?ttDay:0;
  let h0=9,h1=18;S.modules.forEach(m=>m.sessions.forEach(s=>{const a=+s.start.slice(0,2),b=+s.end.slice(0,2)+1;if(a<h0)h0=a;if(b>h1)h1=b;}));
  const hours=[];for(let h=h0;h<=h1;h++)hours.push(h);
  const rowH=44;
  const cols=[1,2,3,4,5].map(d=>{
    const blocks=[];S.modules.forEach(m=>m.sessions.filter(s=>s.day===d).forEach(s=>{const a=+s.start.slice(0,2)+(+s.start.slice(3))/60,b=+s.end.slice(0,2)+(+s.end.slice(3))/60;blocks.push(`<div class="blk" style="top:${(a-h0)*rowH+2}px;height:${(b-a)*rowH-4}px;border-left-color:${m.col};background:${m.col}22" onclick="openModule('${m.id}')"><b>${esc(m.name)}</b><span>${s.start}–${s.end}${s.room?' · '+esc(s.room):''}</span></div>`);}));
    return`<div class="dc ${showDay===d||(ttView==='week')?'show':''}">${hours.map(()=>'<div class="line"></div>').join('')}${blocks.join('')}</div>`;
  }).join('');
  const heads=[1,2,3,4,5].map(d=>`<div class="dh ${d===td?'today':''} ${showDay===d||ttView==='week'?'show':''}">${DAYN[d]}</div>`).join('');
  const wk=monday(new Date());
  const freeMsg=inTerm(tk)?'Free blocks this week — drop a study session?':'Outside term dates. Classes show from '+S.term.start+'.';
  return`<div class="title"><h1>Timetable</h1><span class="seg">${['day','week'].map(v=>`<button class="${ttView===v?'on':''}" onclick="ttView='${v}';ttDay=${td>=1&&td<=5?td:1};render()">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</span>${ttView==='day'?`<span class="seg">${[1,2,3,4,5].map(d=>`<button class="${ttDay===d?'on':''}" onclick="ttDay=${d};render()">${DAYN[d]}</button>`).join('')}</span>`:''}<span class="sub">Autumn 2026</span><span class="spacer"></span><button class="pill" onclick="openModule()">+ Class</button></div>
  <div class="card"><div class="ttg"><div></div>${heads}<div>${hours.map(h=>`<div class="hl">${pad(h)}</div>`).join('')}</div>${cols}</div></div>
  <div class="card" style="margin-top:14px;border-left:5px solid #9CC9FF"><span class="small">${freeMsg}</span> <button class="link" onclick="openTask(null,{cat:'study',name:'Study session'})">Add one</button></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Semester overview<small>${S.modules.length} modules</small></h2>${S.modules.map(m=>`<div class="modc" style="border-left-color:${m.col}" onclick="openModule('${m.id}')"><b>${esc(m.code)} · ${esc(m.name)}</b>${m.sessions.map(s=>`<div class="sess">${DAYN[s.day]} ${s.start}–${s.end}${s.room?' · '+esc(s.room):''}</div>`).join('')}<div class="muted">${m.assessments.length} assessment${m.assessments.length===1?'':'s'}</div></div>`).join('')||'<div class="empty">Add your first class</div>'}</div>
    <div class="card"><h2>Clubs, appointments and everything else<small>this week</small></h2>${Array.from({length:7},(_,i)=>{const d=addDays(wk,i),k=dk(d),ev=getEvents(k).filter(e=>e.type!=='class');return ev.length?`<div class="muted" style="margin-top:6px">${fmtD(d,{weekday:'long'})}</div>${ev.map(e=>evHtml(e,'wev')).join('')}`:'';}).join('')||'<div class="empty">Nothing else this week</div>'}</div>
  </div>`;
}
function openModule(id){
  const m=id?S.modules.find(x=>x.id===id):{code:'',name:'',col:'#2C3E5C',sessions:[],assessments:[]};
  const sess=m.sessions.map((s,i)=>`<div class="row"><select onchange="S.modules.find(x=>x.id==='${id}').sessions[${i}].day=+this.value;save()" style="width:70px">${[1,2,3,4,5].map(d=>`<option value="${d}" ${s.day===d?'selected':''}>${DAYN[d]}</option>`).join('')}</select><input type="time" value="${s.start}" style="width:100px" onchange="S.modules.find(x=>x.id==='${id}').sessions[${i}].start=this.value;save()"><input type="time" value="${s.end}" style="width:100px" onchange="S.modules.find(x=>x.id==='${id}').sessions[${i}].end=this.value;save()"><input value="${esc(s.room)}" placeholder="Room" onchange="S.modules.find(x=>x.id==='${id}').sessions[${i}].room=this.value;save()"><button class="ib" onclick="S.modules.find(x=>x.id==='${id}').sessions.splice(${i},1);save();openModule('${id}')">×</button></div>`).join('');
  openModal(`<h2>${id?'Edit class':'New class'}</h2>
  <div class="fr"><div class="f"><label>Module code</label><input id="mo-code" value="${esc(m.code)}"></div><div class="f"><label>Colour</label><input type="color" id="mo-col" value="${m.col}" style="height:38px;padding:2px"></div></div>
  <div class="f"><label>Name</label><input id="mo-name" value="${esc(m.name)}"></div>
  ${id?`<h3>Sessions</h3>${sess||'<div class="muted">No sessions yet</div>'}<button class="btn ghost sm" style="margin-top:6px" onclick="S.modules.find(x=>x.id==='${id}').sessions.push({day:3,start:'10:00',end:'10:50',room:''});save();openModule('${id}')">+ Session</button>`:'<div class="muted">Save first, then add sessions and assessments.</div>'}
  <div class="mact">${id?`<button class="btn danger sm" onclick="if(confirm('Delete this module and its assessments?')){S.modules=S.modules.filter(x=>x.id!=='${id}');save();closeModal();render()}">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn sky" onclick="saveModule('${id||''}')">Save</button></div>`);
}
function saveModule(id){const code=$('mo-code').value.trim(),name=$('mo-name').value.trim(),col=$('mo-col').value;if(!name){toast('Give it a name');return;}
  if(id){const m=S.modules.find(x=>x.id===id);Object.assign(m,{code,name,col});save();closeModal();render();}else{const m={id:uid(),code,name,col,sessions:[],assessments:[]};S.modules.push(m);save();openModule(m.id);}}

// ── ASSIGNMENTS ──
function rAssignments(){
  const all=[];S.modules.forEach(m=>m.assessments.forEach(a=>all.push({a,m})));
  const open=all.filter(x=>!x.a.done).sort((x,y)=>(x.a.due||'9')<(y.a.due||'9')?-1:1),done=all.filter(x=>x.a.done);
  const row=({a,m})=>`<tr><td><span class="tick ${a.done?'on':''}" onclick="toggleAssess('${m.id}','${a.id}')">${a.done?'✓':''}</span></td><td onclick="openAssess('${m.id}','${a.id}')" style="cursor:pointer"><b>${esc(a.title)}</b><div class="muted">${esc(m.code)} · ${esc(m.name)}</div></td><td>${a.weight?a.weight+'%':'—'}</td><td>${a.due?fmtD(fromKey(a.due),{day:'numeric',month:'short'}):'—'} ${a.done?'':dueChip(a.due)}</td><td>${a.grade!==undefined&&a.grade!==''?a.grade+'%':''}</td></tr>`;
  return`<div class="title"><h1>Assignments</h1><span class="sub">${open.length} open</span><span class="spacer"></span><button class="pill" onclick="openAssess()">+ Assignment</button></div>
  <div class="card"><table class="tbl"><tr><th></th><th>Assignment</th><th>Weight</th><th>Due</th><th>Grade</th></tr>${open.map(row).join('')||'<tr><td colspan="5" class="empty">Nothing due. Add your assessments so deadlines land on the calendar.</td></tr>'}</table></div>
  ${done.length?`<div class="card" style="margin-top:14px"><h2>Submitted</h2><table class="tbl">${done.map(row).join('')}</table></div>`:''}
  <div class="card" style="margin-top:14px"><h2>Grades<small>weighted so far</small></h2><table class="tbl"><tr><th>Module</th><th>Graded weight</th><th>Running average</th></tr>${S.modules.map(m=>{const g=m.assessments.filter(a=>a.grade!==undefined&&a.grade!=='');const w=g.reduce((n,a)=>n+(+a.weight||0),0);const avg=w?g.reduce((n,a)=>n+(+a.grade)*(+a.weight||0),0)/w:null;return`<tr><td><span class="dot" style="background:${m.col};display:inline-block;margin-right:6px"></span>${esc(m.name)}</td><td>${w}%</td><td>${avg===null?'—':avg.toFixed(1)+'%'}</td></tr>`;}).join('')}</table></div>`;
}
function openAssess(mid,aid){
  const m=mid?S.modules.find(x=>x.id===mid):null,a=m&&aid?m.assessments.find(x=>x.id===aid):{title:'',due:'',weight:'',grade:'',note:''};
  openModal(`<h2>${aid?'Edit assignment':'New assignment'}</h2>
  <div class="f"><label>Module</label><select id="as-mod">${S.modules.map(x=>`<option value="${x.id}" ${m&&m.id===x.id?'selected':''}>${esc(x.code)} ${esc(x.name)}</option>`).join('')}</select></div>
  <div class="f"><label>Title</label><input id="as-title" value="${esc(a.title)}"></div>
  <div class="fr"><div class="f"><label>Due</label><input type="date" id="as-due" value="${a.due||''}"></div><div class="f"><label>Weight %</label><input type="number" id="as-w" value="${a.weight||''}"></div></div>
  <div class="fr"><div class="f"><label>Grade % (when back)</label><input type="number" id="as-g" value="${a.grade??''}"></div></div>
  <div class="f"><label>Note</label><textarea id="as-note">${esc(a.note||'')}</textarea></div>
  <div class="mact">${aid?`<button class="btn danger sm" onclick="if(confirm('Delete?')){const m=S.modules.find(x=>x.id==='${mid}');m.assessments=m.assessments.filter(x=>x.id!=='${aid}');save();closeModal();render()}">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn sky" onclick="saveAssess('${mid||''}','${aid||''}')">Save</button></div>`);
}
function saveAssess(mid,aid){const nm=S.modules.find(x=>x.id===$('as-mod').value);if(!nm){toast('Add a module first');return;}const o={title:$('as-title').value.trim(),due:$('as-due').value,weight:$('as-w').value,grade:$('as-g').value,note:$('as-note').value};if(!o.title){toast('Give it a title');return;}
  if(aid){const om=S.modules.find(x=>x.id===mid);const a=om.assessments.find(x=>x.id===aid);if(om!==nm){om.assessments=om.assessments.filter(x=>x.id!==aid);nm.assessments.push(a);}Object.assign(a,o);}else nm.assessments.push({id:uid(),done:false,...o});
  save();closeModal();render();}
function toggleAssess(mid,aid){const a=S.modules.find(x=>x.id===mid).assessments.find(x=>x.id===aid);a.done=!a.done;save();render();}

// ── WELLNESS (habits + routines) ──
function rWellness(){
  const m=mk(cur),hs=habits(m),days=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),tk=todayKey(),mon=cur.toLocaleDateString('en-IE',{month:'long',year:'numeric'});

  const streak=h=>{let n=0;for(let d=new Date();;d=addDays(d,-1)){if((S.habitMarks[dk(d)]||[]).includes(h.id))n++;else break;if(n>60)break;}return n;};

  <div class="grid g2" style="margin-top:14px">${rl('morning','Morning routine')}${rl('night','Night routine')}</div>

}

function openClient(id){const c=id?S.suede.clients.find(x=>x.id===id):{name:'',stage:'Enquiry',value:'',note:''};

const SYSTEM=`You are Claude inside Elva Hub, Elva Mellett's personal planner. Elva is 20, studies Economics and ICS at UCD (Stage 3), works full time, and runs The Suede Studio with Laura. She wants short, direct answers: no filler, no long paragraphs. Plain factual wording. Use her real data below; never invent tasks, deadlines or clients that are not there — if something is missing, say so or ask.

You can change the Hub. When she asks you to plan, add, move, complete, prioritise, or update anything, do it by ending your reply with one fenced block exactly like this:

\`\`\`actions
[{"do":"add_task","name":"...","area":"life|suede|study|money","due":"YYYY-MM-DD","day":"YYYY-MM-DD","time":"HH:MM","p":1}]
\`\`\`

Available actions (omit fields you don't need):
- add_task {name, area, due, day, time, p}
- complete_task {name}            — name can be a partial match
- delete_task {name}
- move_task {name, day, time}     — day "" unplans it; time "" removes the time
- set_priority {scope:"today"|"week", slot:1|2|3, name}   — links an existing task, or creates it if new
- set_one_goal {text}
- add_goal {scope:"month"|"quarter", area:"life|suede|money", text}
- add_step {goal, text}           — step under a quarter goal
- add_habit {name}
- add_routine {which:"morning"|"night", text}
- add_note {title, body}
- add_assignment {module, title, due, weight}   — module = code or name
- add_client {name, stage, value, note}  — stage: Enquiry, Discovery, Proposal, Active, Delivered, Retainer
- set_client_stage {name, stage}
- add_invoice {client, amount, due}

Rules: only act on what she asked for or clearly agreed to. When planning her day, use move_task with day and time to put real tasks into free hours around her classes, and set_priority for the top 3. Keep the text part of the reply to what she needs to know; the Hub shows her what changed. Do not describe the block itself.

Current Hub data:
`;
function findTask(n){n=(n||'').toLowerCase().trim();if(!n)return null;const open=S.tasks.filter(t=>!t.done);return open.find(t=>t.name.toLowerCase()===n)||open.find(t=>t.name.toLowerCase().includes(n))||open.find(t=>n.includes(t.name.toLowerCase()))||null;}
function findModule(n){n=(n||'').toLowerCase();return S.modules.find(m=>m.code.toLowerCase()===n)||S.modules.find(m=>m.name.toLowerCase().includes(n)||n.includes(m.code.toLowerCase()))||null;}
function findClient(n){n=(n||'').toLowerCase();return S.suede.clients.find(c=>c.name.toLowerCase()===n)||S.suede.clients.find(c=>c.name.toLowerCase().includes(n))||null;}
function applyActions(text){
  const done=[];let list=[];
  const clean=text.replace(/\`\`\`actions\s*([\s\S]*?)\`\`\`/gi,(_,j)=>{try{const a=JSON.parse(j);list=list.concat(Array.isArray(a)?a:[a]);}catch(e){done.push('Could not read an action block');}return'';})
    .replace(/\[\[task:\s*([^|\]]+?)\s*(?:\|\s*([a-z]*)\s*)?(?:\|\s*([0-9-]*)\s*)?\]\]/gi,(_,n,a,d)=>{list.push({do:'add_task',name:n,area:a,due:d});return'';}).trim();
  const area=a=>S.cats.some(c=>c.id===(a||'').trim())?a.trim():'life';
  const k=todayKey(),wk='W:'+dk(monday(new Date()));
  for(const a of list){try{switch(a.do){
    case 'add_task':{if(!a.name)break;const t=addTask({name:a.name,cat:area(a.area),due:a.due||'',day:a.day||'',time:a.time||'',p:+a.p||0});done.push('Added task: '+t.name+(t.day?' on '+t.day+(t.time?' '+t.time:''):''));break;}
    case 'complete_task':{const t=findTask(a.name);if(!t){done.push('No open task matching "'+a.name+'"');break;}t.done=true;t.doneAt=new Date().toISOString();done.push('Completed: '+t.name);break;}
    case 'delete_task':{const t=findTask(a.name);if(!t){done.push('No open task matching "'+a.name+'"');break;}S.tasks=S.tasks.filter(x=>x.id!==t.id);Object.keys(S.pri).forEach(kk=>S.pri[kk]=S.pri[kk].map(x=>x===t.id?null:x));done.push('Deleted: '+t.name);break;}
    case 'move_task':{const t=findTask(a.name);if(!t){done.push('No open task matching "'+a.name+'"');break;}if(a.day!==undefined)t.day=a.day||'';if(a.time!==undefined)t.time=a.time||'';if(t.day&&!t.due)t.due=t.day;done.push((t.day?'Planned ':'Unplanned ')+t.name+(t.day?' for '+t.day+(t.time?' at '+t.time:''):''));break;}
    case 'set_priority':{const key=a.scope==='week'?wk:k;const slot=Math.min(3,Math.max(1,+a.slot||1))-1;let t=findTask(a.name);if(!t){t=addTask({name:a.name,cat:area(a.area),p:slot+1,day:a.scope==='week'?'':k,due:a.scope==='week'?'':k});}setPriTask(key,slot,t.id);done.push(`${a.scope==='week'?'Week':'Today'} priority ${slot+1}: ${t.name}`);break;}
    case 'set_one_goal':{S.oneGoal={k,t:a.text||'',done:false};done.push("Today's one goal: "+a.text);break;}
    case 'add_goal':{if(a.scope==='quarter'){quarter(qk(new Date())).goals.push({id:uid(),t:a.text,steps:[]});done.push('Added 3-month goal: '+a.text);}else{const ar=['life','suede','money'].includes(a.area)?a.area:'life';goals(mk(new Date()))[ar].push({id:uid(),t:a.text,done:false});done.push('Added month goal ('+ar+'): '+a.text);}break;}
    case 'add_step':{const Q=quarter(qk(new Date()));const g=Q.goals.find(x=>x.t.toLowerCase().includes((a.goal||'').toLowerCase()));if(!g){done.push('No 3-month goal matching "'+a.goal+'"');break;}g.steps.push({id:uid(),t:a.text,done:false});done.push('Added step to '+g.t+': '+a.text);break;}
    case 'add_habit':{habits(mk(new Date())).push({id:uid(),name:a.name});done.push('Tracking habit: '+a.name);break;}
    case 'add_routine':{const w=a.which==='night'?'night':'morning';S.routines[w].push(a.text);done.push('Added to '+w+' routine: '+a.text);break;}
    case 'add_note':{S.notes.push({id:uid(),title:a.title||'Note from Claude',date:k,body:a.body||''});done.push('Saved note: '+(a.title||'Note from Claude'));break;}
    case 'add_assignment':{const m=findModule(a.module);if(!m){done.push('No module matching "'+a.module+'"');break;}m.assessments.push({id:uid(),title:a.title,due:a.due||'',weight:a.weight||'',grade:'',done:false});done.push('Added assignment to '+m.code+': '+a.title+(a.due?' due '+a.due:''));break;}
    case 'add_client':{const st=STAGES.includes(a.stage)?a.stage:'Enquiry';S.suede.clients.push({id:uid(),name:a.name,stage:st,value:a.value||'',note:a.note||''});done.push('Added client: '+a.name+' ('+st+')');break;}
    case 'set_client_stage':{const c=findClient(a.name);if(!c){done.push('No client matching "'+a.name+'"');break;}if(!STAGES.includes(a.stage)){done.push('Unknown stage "'+a.stage+'"');break;}c.stage=a.stage;done.push(c.name+' → '+a.stage);break;}
    case 'add_invoice':{S.suede.invoices.push({id:uid(),client:a.client,amount:a.amount||'',due:a.due||'',paid:false});done.push('Added invoice: '+a.client+' €'+a.amount);break;}
    default:done.push('Unknown action: '+a.do);
  }}catch(e){done.push('Failed: '+(a.do||'?'));}}
  if(list.length)save();
  return{clean,added:done};
}
async function askClaude(messages,system,max_tokens){
  if(!S.claude.url)throw new Error('Set the Worker URL in Settings → Claude first');
  const r=await fetch(S.claude.url,{method:'POST',headers:{'Content-Type':'application/json','x-hub-token':S.claude.token},body:JSON.stringify({model:S.claude.model||'claude-sonnet-4-6',max_tokens:max_tokens||1200,system,messages})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error?.message||d.error||('Worker returned '+r.status));
  return (d.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
}
function applyTaskLines(text){
  const added=[];const clean=text.replace(/\[\[task:\s*([^|\]]+?)\s*(?:\|\s*([a-z]*)\s*)?(?:\|\s*([0-9-]*)\s*)?\]\]/gi,(_,n,a,d)=>{const area=S.cats.some(c=>c.id===(a||'').trim())?a.trim():'life';addTask({name:n.trim(),cat:area,due:(d||'').trim()});added.push(n.trim());return'';}).trim();
  return{clean,added};
}
let chatBusy=false;
function rClaude(){
  const conn=!!S.claude.url;
  const qp=['Plan my day around my classes','Set my top 3 for today','What is due this week?','Give me ideas for Suede Studio this month','Turn my quick notes into tasks','Which assignments should I start first?'];
  return`<div class="title"><h1>Claude</h1><span class="sub">${conn?'can plan your day, update the Task Bank, priorities, goals, habits, notes, assignments and Suede':'not connected yet'}</span><span class="spacer"></span><button class="pill" onclick="if(confirm('Clear this chat?')){S.chat=[];save();render()}">Clear</button></div>
  ${conn?'':'<div style="margin-bottom:14px">'+claudeSetupCard()+'</div>'}
  <div class="card chat"><div class="qp">${qp.map(x=>`<span class="chip" onclick="sendChat(${JSON.stringify(x)})">${x}</span>`).join('')}</div>
    <div class="msgs" id="msgs">${S.chat.length?S.chat.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${fmtMd(m.content)}${m.added?`<span class="added">${m.added.map(esc).join('<br>')}</span>`:''}</div>`).join(''):'<div class="empty">Ask anything about your week, or pick a prompt above.</div>'}${chatBusy?'<div class="msg a thinking">Thinking…</div>':''}</div>
    <div class="chatin"><textarea id="chatIn" placeholder="Message Claude" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea><button class="btn sky" onclick="sendChat()" ${chatBusy?'disabled':''}>Send</button></div></div>`;
}
function fmtMd(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^- /gm,'• ');}
async function sendChat(text){
  const inp=$('chatIn');const v=(text||inp&&inp.value||'').trim();if(!v||chatBusy)return;if(inp)inp.value='';
  S.chat.push({role:'user',content:v});S.chat=S.chat.slice(-40);chatBusy=true;save();render();scrollMsgs();
  try{
    const msgs=S.chat.filter(m=>!m.error).map(m=>({role:m.role,content:m.content}));
    const reply=await askClaude(msgs,SYSTEM+hubContext());
    const {clean,added}=applyActions(reply);
    S.chat.push({role:'assistant',content:clean||'(no reply)',added:added.length?added:undefined});
    if(added.length)toast(`${added.length} change${added.length>1?'s':''} made`);
  }catch(e){S.chat.push({role:'assistant',content:'Could not reach Claude: '+e.message,error:true});}
  chatBusy=false;S.chat=S.chat.slice(-40);save();render();scrollMsgs();
}
function scrollMsgs(){const m=$('msgs');if(m)setTimeout(()=>m.scrollTop=m.scrollHeight,30);}
async function testClaude(){const out=$('claudeTest');if(out)out.textContent='Sending…';toast('Sending…');try{const r=await askClaude([{role:'user',content:'Reply with the single word: connected'}],'You are a connection test.',20);const m='Claude says: '+r.slice(0,60);toast(m);if(out){out.textContent=m+' ✓';out.style.color='#4F7A4A';}render();}catch(e){toast(e.message);if(out){out.textContent='Failed: '+e.message;out.style.color='#B23A2E';}}}
function briefCard(k){
  const b=S.brief[k];
  return`<div class="card" style="margin-bottom:14px;border-left:5px solid #9CC9FF"><h2>Morning briefing<small>from Claude</small><span class="r"><button class="link" onclick="genBrief('${k}')">${b?'Refresh':'Generate'}</button></span></h2>${b?`<div class="brief">${fmtMd(b)}</div>`:`<div class="muted">${S.claude.url?'Tap Generate for a two-minute read on today: classes, deadlines, what to do first.':'Set up Claude in Settings to get a daily briefing here.'}</div>`}</div>`;
}
async function genBrief(k){
  if(!S.claude.url){nav('settings');return;}
  S.brief[k]='Writing…';render();
  try{const r=await askClaude([{role:'user',content:'Write my morning briefing for today. Format: one line on today\'s shape, then "Classes", "Due soon", "Do first" (three items max, from my real tasks and priorities), then one line on Suede Studio if anything is live. Under 150 words. No greeting. Do not include an actions block.'}],SYSTEM+hubContext(),600);S.brief[k]=applyActions(r).clean;}
  catch(e){S.brief[k]='';toast(e.message);}
  save();render();
}

// ── GOOGLE CALENDAR (read-only) ──
async function gcalSync(){
  try{const now=new Date(),then=addDays(now,60);
    const url=`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(GCAL_CALENDAR_ID)}/events?key=${GCAL_API_KEY}&timeMin=${addDays(now,-7).toISOString()}&timeMax=${then.toISOString()}&singleEvents=true&orderBy=startTime&maxResults=200`;
    const r=await fetch(url);const d=await r.json();if(!d.items){toast('Google Calendar sync failed');return;}
    gcalEvents=d.items.map(e=>{const s=e.start?.dateTime||e.start?.date||'';const local=e.start?.dateTime?new Date(s):null;return{id:e.id,title:e.summary||'(no title)',start:local?dk(local)+'T'+pad(local.getHours())+':'+pad(local.getMinutes()):s,allDay:!e.start?.dateTime};});
    localStorage.setItem('elva_gcal_events',JSON.stringify(gcalEvents));render();toast(`Synced ${gcalEvents.length} events`);
  }catch(e){toast('Sync error');}
}

// ── LOCK + INIT ──
function unlock(){if($('lockIn').value===PASSWORD){sessionStorage.setItem('elva_unlocked','1');$('lock').style.display='none';}else{$('lockErr').style.display='block';}}
(async function init(){
  if(sessionStorage.getItem('elva_unlocked'))$('lock').style.display='none';
  await load();
  nav('home');
  if(S.gcal)gcalSync();
})();
</script>
