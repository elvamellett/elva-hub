    <div class="toolbar">
      <button class="primary" onclick="Actions.printCustomerSheet('${c.id}')">🖨 Print this customer's sheet (details + booking answers)</button>
    </div>
    <div class="cols2">
      <div class="card">
        <h2 style="margin-top:0">Details</h2>
        <div class="dl-row"><span class="dl-label">Email</span><span class="dl-value">${esc(c.email || '—')}</span></div>
        <div class="dl-row"><span class="dl-label">Phone</span><span class="dl-value">${esc(c.phone || '—')}</span></div>
        <div class="dl-row"><span class="dl-label">Delivery</span><span class="dl-value">${esc(c.address || '—')}</span></div>
        ${c.notes ? `<div class="dl-row"><span class="dl-label">Staff notes</span><span class="dl-value">${esc(c.notes)} <span class="small muted">(internal)</span></span></div>` : ''}
      </div>
      <div class="card" style="grid-row: span 2">
        <h2 style="margin:0">Appointment questions <span class="badge b-brand">Appointly</span></h2>
        ${AppointlyService.bookingsFor(c.id).map(a => `
          <div style="border-top:1px solid var(--line); margin-top:12px; padding-top:12px">
            <div class="flex" style="margin-bottom:10px">
              <b>${esc(a.service)}</b>
              <span class="badge ${a.status === 'upcoming' ? 'b-blue' : 'b-grey'}">${a.status === 'upcoming' ? 'Upcoming' : 'Completed'}</span>
              <span class="small muted">${fmtDate(a.appointmentAt)}${a.time ? ' · <b>' + esc(a.time) + '</b>' : ''}${a.source === 'appointly' ? ' · booked online' : ' · logged by staff'}</span>
            </div>
            ${a.staffName ? `<div class="small" style="margin-bottom:8px">Looked after by <b>${esc(a.staffName)}</b></div>` : ''}
            ${a.questions.length ? a.questions.map(qa => `<div class="qa"><div class="q">${esc(qa.q)}</div>
              <ul>${(qa.a || '—').split(/\n+/).map(line => `<li>${esc(line)}</li>`).join('')}</ul></div>`).join('')
              : '<div class="small muted">Event-day slot — no booking questions.</div>'}
          </div>`).join('') || '<p class="muted small" style="margin-bottom:0; margin-top:10px">No booking answers yet — they appear here once the customer books through the site.</p>'}
        ${AppointlyService.isLive() || DB.importInfo ? '' : '<div class="seam" style="margin-bottom:0">📅 Appointly — sample data. Bring in the real booking answers on the <a class="plain" href="#/import">Connect data</a> page.</div>'}
      </div>
      <div>
        <h2 style="margin-top:0">Orders (${orders.length})</h2>
        ${orders.map(o => {
          const items = Domain.itemsOf(o.id);
          return `<div class="card" style="margin-bottom:12px">
            <div class="flex" style="justify-content:space-between">
              <b>${esc(o.reference)}</b>
              <span style="margin-left:auto" class="small muted">${fmtDateTime(o.createdAt).split(',')[0]}</span>
            </div>
            <div class="small muted" style="margin-top:6px">${items.map(i => esc(i.title) + (i.colour || i.size ? ' (' + [i.colour, i.size].filter(Boolean).map(esc).join(', ') + ')' : '')).join(' · ')}</div>
            <div class="small" style="margin-top:6px">${UI.eventBadge(o.eventHotel).replace('<br>', ' ')}${o.eventDate ? ' <span class="muted">· ' + fmtDate(o.eventDate) + '</span>' : ''}</div>
          </div>`;
        }).join('') || '<div class="card muted">No orders yet.</div>'}
      </div>
    </div>`;
};
</script>
<script>
/* =============================== CONNECT DATA (CSV import) =============================== */
/* "Connecting" Shopify + Appointly without a server: both apps have
   Export buttons, and this page turns those CSV files into the same
   shape as the seeded sample data. Browsers can't call the Shopify
   Admin API directly (blocked for security, and the token would be
   exposed), so a fully automatic sync needs this dashboard hosted with
   a small backend — the LIVE CREDENTIAL SEAMs above mark where that
   plugs in when the time comes. */

function parseCsv(text) {
  text = String(text || '').replace(/^\uFEFF/, '');
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.length > 1 || row[0].trim() !== '') rows.push(row);
      row = [];
    } else cell += ch;
  }
  row.push(cell);
  if (row.length > 1 || row[0].trim() !== '') rows.push(row);
  if (!rows.length) return { headers: [], records: [] };
  const headers = rows[0].map(h => h.trim());
  const records = rows.slice(1).map(r => { const o = {}; headers.forEach((h, i) => o[h] = (r[i] || '').trim()); return o; });
  return { headers, records };
}

const ImportService = {
  state: { customers: null, orders: null, appointly: null },

  async fileChosen(kind, input) {
    try {
      const file = input.files && input.files[0];
      if (!file) return;
      const text = await file.text();
      const parsed = parseCsv(text);
      if (!parsed.records.length) throw new Error('No data rows found in ' + file.name + ' — is it a CSV export?');
      ImportService.state[kind] = { name: file.name, headers: parsed.headers, records: parsed.records };
      App.route();
    } catch (e) { input.value = ''; UI.err(e); }
  },
  clear(kind) { ImportService.state[kind] = null; App.route(); },

  // First header equal to a candidate wins; then first header containing one.
  _col(headers, ...cands) {
    for (const cand of cands) { const h = headers.find(x => x.toLowerCase() === cand); if (h) return h; }
    for (const cand of cands) { const h = headers.find(x => x.toLowerCase().includes(cand)); if (h) return h; }
    return null;
  },
  _digits: s => String(s || '').replace(/\D/g, ''),
  _normDate(str) {
    const s = String(str || '').trim();
    if (!s) return '';
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[0];
    m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/); // Irish exports: day first
    if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    const d = new Date(s);
    return isNaN(d) ? '' : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  },
  _normTime(str) {
    const m = String(str || '').match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
    if (!m) return '';
    let h = parseInt(m[1], 10);
    if (m[3]) { const pm = m[3].toLowerCase() === 'pm'; if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
    return String(h).padStart(2, '0') + ':' + m[2];
  },
  // Appointly's export can pack all responses into one cell:
  //   "Ques: What is your Daughter's Name? Ans: Emilia ... Ques: ... Ans: ..."
  // Split those into proper question/answer pairs and drop export junk
  // (Variant / Default Title / empty Custom Questions labels).
  _expandQas(qas) {
    const out = [];
    for (const qa of qas || []) {
      const q = String(qa.q || '').trim(), a = String(qa.a || '').trim();
      if (!a) continue;
      if (/^variant$/i.test(q) || /^default title$/i.test(a)) continue;
      if (/Ques\s*:/i.test(a)) {
        const re = /Ques\s*:\s*([\s\S]*?)\s*Ans\s*:\s*([\s\S]*?)(?=Ques\s*:|$)/gi;
        let m;
        while ((m = re.exec(a))) { if (m[2].trim()) out.push({ q: m[1].trim(), a: m[2].trim() }); }
        continue;
      }
      if (/^custom questions?$/i.test(q)) continue;
      out.push({ q, a });
    }
    return out;
  },
  // Sort an order's attribute [key, value] pairs into booking details,
  // event info and question answers. Shared by the CSV importer and the
  // live Shopify sync (Appointly writes bookings onto orders this way).
  _classifyAttrs(pairs) {
    const normDate = ImportService._normDate, normTime = ImportService._normTime;
    const out = { eventHotel: '', eventDate: '', bDate: '', bTime: '', bService: '', bStaff: '', qas: [] };
    for (const [k, val] of pairs) {
      const kl = k.toLowerCase();
      // Anything phrased like a question stays a question — booking Q&As
      // often contain words like "occasion" or "date" in the sentence.
      const isQuestion = k.includes('?') || k.length > 40;
      if (isQuestion) { out.qas.push({ q: k, a: val }); continue; }
      if (/booking date|appointment date/.test(kl) || kl === 'date') out.bDate = normDate(val);
      else if (/booking time|appointment time|start time/.test(kl) || kl === 'time') out.bTime = normTime(val);
      else if (/^(service|appointment type|appointment)$/.test(kl)) out.bService = val;
      else if (/^(staff|employee|team member)$/.test(kl)) out.bStaff = val;
      else if (/event date|ceremony date/.test(kl)) out.eventDate = normDate(val);
      else if (/venue|hotel|location|event|occasion/.test(kl)) out.eventHotel = out.eventHotel || val;
      else out.qas.push({ q: k, a: val });
    }
    return out;
  },

  // Turn whatever files are loaded into { customers, orders, orderItems, appointments }.
  build() {
    const s = ImportService.state;
    const col = ImportService._col, normDate = ImportService._normDate, normTime = ImportService._normTime;
    const customers = [], orders = [], orderItems = [], appointments = [], warnings = [];
    const byEmail = new Map(), byPhone = new Map();
    const findOrCreateCustomer = (name, email, phone, extra) => {
      const e = String(email || '').toLowerCase();
      const p = ImportService._digits(phone);
      let c = (e && byEmail.get(e)) || (p && byPhone.get(p)) || null;
      if (!c) {
        c = { id: uid(), name: (name || email || 'Unknown customer').trim(), daughterName: '', email: email || '',
          phone: phone || '', address: '', notes: '', createdAt: nowIso() };
        customers.push(c);
      }
      if (e) byEmail.set(e, c);
      if (p) byPhone.set(p, c);
      if (extra) for (const k of Object.keys(extra)) if (extra[k] && !c[k]) c[k] = extra[k];
      return c;
    };

    /* ---- Shopify customers export ---- */
    if (s.customers) {
      const H = s.customers.headers;
      const first = col(H, 'first name'), last = col(H, 'last name');
      const email = col(H, 'email'), phone = col(H, 'phone');
      const addr1 = col(H, 'address1'), city = col(H, 'city'), prov = col(H, 'province name', 'province'), zip = col(H, 'zip');
      const note = col(H, 'note');
      if (!email && !first) warnings.push('Customers file: the usual Shopify columns (First Name, Email…) weren\'t found — imported what was possible.');
      for (const r of s.customers.records) {
        const name = [first ? r[first] : '', last ? r[last] : ''].filter(Boolean).join(' ').trim();
        if (!name && !(email && r[email])) continue;
        findOrCreateCustomer(name, email ? r[email] : '', phone ? r[phone] : '', {
          address: [addr1, city, prov, zip].map(h => h ? r[h] : '').filter(Boolean).join(', '),
          notes: note ? r[note] : '',
        });
      }
    }

    /* ---- Shopify orders export (one row per line item) ---- */
    if (s.orders) {
      const H = s.orders.headers;
      const ref = col(H, 'name'), email = col(H, 'email'), created = col(H, 'created at');
      const lineName = col(H, 'lineitem name'), lineQty = col(H, 'lineitem quantity'), linePrice = col(H, 'lineitem price'), lineSku = col(H, 'lineitem sku');
      const bName = col(H, 'billing name'), phone = col(H, 'phone', 'billing phone');
      const notes = col(H, 'notes'), noteAttr = col(H, 'note attributes'), cancelled = col(H, 'cancelled at');
      if (!ref || !lineName) warnings.push('Orders file: expected Shopify columns (Name, Lineitem name…) weren\'t all found — imported what was possible.');
      const groups = new Map();
      for (const r of s.orders.records) {
        const key = ref ? r[ref] : String(groups.size);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      }
      for (const [reference, rows] of groups) {
        const head = rows.find(r => (email && r[email]) || (bName && r[bName])) || rows[0];
        const cust = findOrCreateCustomer(bName ? head[bName] : '', email ? head[email] : '', phone ? head[phone] : '');
        // Appointly writes booking details onto the order as note attributes
        // ("Key: value" lines) — pull out the booking + questions.
        const attrs = [];
        String(noteAttr ? head[noteAttr] : '').split(/\n+/).forEach(line => {
          const m = line.match(/^([^:]{1,120}):\s*(.*)$/);
          if (m && m[2].trim()) attrs.push([m[1].trim(), m[2].trim()]);
        });
        const cls = ImportService._classifyAttrs(attrs);
        const createdAt = (() => { const d = new Date(created ? head[created] : ''); return isNaN(d) ? nowIso() : d.toISOString(); })();
        const order = { id: uid(), customerId: cust.id, reference: reference || ('IMP-' + (orders.length + 1)),
          status: cancelled && head[cancelled] ? 'cancelled' : 'confirmed', createdAt,
          eventHotel: cls.eventHotel, eventDate: cls.eventDate, planType: null, staffNotes: notes ? head[notes] : '' };
        orders.push(order);
        for (const r of rows) {
          const t0 = lineName ? r[lineName] : '';
          if (!t0) continue;
          let title = t0, colour = '', size = '';
          const dash = t0.split(' - ');
          if (dash.length > 1) {
            title = dash[0].trim();
            const vp = dash.slice(1).join(' - ').split(' / ').map(x => x.trim());
            colour = vp[0] || ''; size = vp[1] || '';
          }
          orderItems.push({ id: uid(), orderId: order.id, productId: null, title,
            styleCode: lineSku ? r[lineSku] : '', category: /dress|gown/i.test(title) ? 'dress' : 'accessory',
            colour, size, quantity: parseInt(lineQty ? r[lineQty] : '1', 10) || 1,
            retailPriceCents: parseEuros(linePrice ? r[linePrice] : '') || 0 });
        }
        const qas2 = ImportService._expandQas(cls.qas);
        const dq = qas2.find(qa => /daughter'?s\s+name/i.test(qa.q));
        if (dq && dq.a && !cust.daughterName) cust.daughterName = dq.a;
        if (cls.bDate || qas2.length) {
          const at = cls.bDate || normDate(createdAt.slice(0, 10)) || todayStr();
          appointments.push({ id: uid(), customerId: cust.id, source: 'appointly', service: cls.bService || 'Booking',
            time: cls.bTime, staffName: cls.bStaff, appointmentAt: at, status: at >= todayStr() ? 'upcoming' : 'completed',
            bookedAt: createdAt, syncedAt: nowIso(), questions: qas2 });
        }
      }
    }

    /* ---- Appointly bookings export ---- */
    if (s.appointly) {
      const H = s.appointly.headers;
      const email = col(H, 'email'), name = col(H, 'customer name', 'client name', 'name'), phone = col(H, 'phone');
      const date = col(H, 'appointment date', 'booking date', 'start date', 'date');
      const time = col(H, 'start time', 'appointment time', 'booking time', 'time');
      const service = col(H, 'service', 'appointment type', 'type');
      const staff = col(H, 'staff', 'employee', 'team member', 'assigned');
      const statusCol = col(H, 'status'), location = col(H, 'location', 'venue');
      const known = new Set([email, name, phone, date, time, service, staff, statusCol, location].filter(Boolean));
      // Question columns: headers with a "?" if any exist, otherwise every
      // leftover column that isn't an obvious id/timestamp/money field.
      const withQ = H.filter(h => h.includes('?'));
      const qCols = withQ.length ? withQ
        : H.filter(h => h && !known.has(h) && !/\bid\b|created|updated|duration|price|amount|currency|order|payment|end time|timezone/i.test(h));
      if (!qCols.length) warnings.push('Appointly file: no question columns found — booking answers may be missing.');
      for (const r of s.appointly.records) {
        if (!((email && r[email]) || (name && r[name]))) continue;
        if (statusCol && /cancel/i.test(r[statusCol])) continue;
        const cust = findOrCreateCustomer(name ? r[name] : '', email ? r[email] : '', phone ? r[phone] : '');
        const d = normDate(date ? r[date] : '');
        const qas = ImportService._expandQas(qCols.map(h => ({ q: h, a: r[h] || '' })).filter(qa => qa.a));
        const dq = qas.find(qa => /daughter'?s\s+name/i.test(qa.q));
        if (dq && dq.a && !cust.daughterName) cust.daughterName = dq.a;
        appointments.push({ id: uid(), customerId: cust.id, source: 'appointly',
          service: [service ? r[service] : '', location ? r[location] : ''].filter(Boolean).join(' — ') || 'Appointment',
          appointmentAt: d || todayStr(), time: normTime(time ? r[time] : ''),
          status: (d || todayStr()) >= todayStr() ? 'upcoming' : 'completed',
          bookedAt: nowIso(), syncedAt: nowIso(), staffName: staff ? r[staff] : '',
          questions: qas });
      }
    }

    // Same spam guard as the live sync: when orders are present, keep only
    // customers with an order or booking.
    if (orders.length) {
      const used = new Set(orders.map(o => o.customerId));
      for (const a of appointments) used.add(a.customerId);
      const kept = customers.filter(c => used.has(c.id));
      if (kept.length && kept.length < customers.length) {
        warnings.push((customers.length - kept.length) + ' contact' + (customers.length - kept.length === 1 ? '' : 's') +
          ' with no orders or bookings left out (newsletter/spam signups).');
        return { customers: kept, orders, orderItems, appointments, warnings };
      }
    }
    return { customers, orders, orderItems, appointments, warnings };
  },

  // Appointly file added on its own while live/imported data is connected →
  // merge the bookings in (matched by email/phone) instead of replacing everything.
  _mergeMode() {
    const s = ImportService.state;
    return !!(s.appointly && !s.customers && !s.orders && DB.importInfo);
  },
  mergeAppointly() {
    const b = ImportService.build();
    const stubById = new Map(b.customers.map(c => [c.id, c]));
    const byEmail = new Map(DB.customers.filter(c => c.email).map(c => [c.email.toLowerCase(), c]));
    const byPhone = new Map(DB.customers.filter(c => ImportService._digits(c.phone)).map(c => [ImportService._digits(c.phone), c]));
    let merged = 0, added = 0, created = 0;
    const resolved = [];
    for (const a of b.appointments) {
      const stub = stubById.get(a.customerId);
      if (!stub) continue;
      let real = (stub.email && byEmail.get(stub.email.toLowerCase()))
        || (ImportService._digits(stub.phone) && byPhone.get(ImportService._digits(stub.phone))) || null;
      // Bookings made without a Shopify order (added by staff, or no deposit
      // paid online) belong to customers Shopify has never seen — create them.
      if (!real) {
        real = { id: uid(), name: stub.name, daughterName: stub.daughterName || '', email: stub.email || '',
          phone: stub.phone || '', address: stub.address || '', notes: '', createdAt: nowIso() };
        DB.customers.push(real);
        if (real.email) byEmail.set(real.email.toLowerCase(), real);
        if (ImportService._digits(real.phone)) byPhone.set(ImportService._digits(real.phone), real);
        created++;
      }
      if (stub.daughterName && !real.daughterName) real.daughterName = stub.daughterName;
      a.customerId = real.id; a.source = 'appointly_csv';
      resolved.push(a);
    }
    // The Appointly export is the truth for bookings: for customers in it,
    // drop order-derived bookings whose dates the export doesn't confirm
    // (Shopify's copy of the date can be wrong or stale).
    const csvCusts = new Set(resolved.map(a => a.customerId));
    const csvDates = new Set(resolved.map(a => a.customerId + '|' + a.appointmentAt));
    DB.appointments = DB.appointments.filter(x =>
      !(x.source === 'appointly' && csvCusts.has(x.customerId) && !csvDates.has(x.customerId + '|' + x.appointmentAt)));
    for (const a of resolved) {
      const existing = DB.appointments.find(x => x.customerId === a.customerId && x.appointmentAt === a.appointmentAt);
      if (existing) {
        if (!existing.questions.length && a.questions.length) existing.questions = a.questions;
        if (!existing.time && a.time) existing.time = a.time;
        if (!existing.staffName && a.staffName) existing.staffName = a.staffName;
        merged++;
      } else { DB.appointments.push(a); added++; }
    }
    Store.save(); Domain.refreshAll();
    ImportService.state = { customers: null, orders: null, appointly: null };
    UI.closeModal(); App.route();
    UI.toast('Booking answers merged — ' + merged + ' matched to existing bookings, ' + added + ' added' + (created ? ', ' + created + ' new customers created (booked without an order)' : '') + '.');
  },
  preview() {
    try {
      const b = ImportService.build();
      if (!b.customers.length) throw new Error('Nothing to import yet — add at least one CSV file first.');
      const answers = b.appointments.filter(a => a.questions.some(qa => qa.a)).length;
      UI.modal(`
        <h3>Ready to import</h3>
        ${ImportService._mergeMode() ? '<div class="note info">These bookings will be <b>merged into your connected data</b> — matched to customers by email/phone. Nothing gets replaced, and the live sync keeps the answers.</div>' : ''}
        <ul style="line-height:1.9">
          <li><b>${b.customers.length}</b> customer${b.customers.length === 1 ? '' : 's'}</li>
          <li><b>${b.orders.length}</b> order${b.orders.length === 1 ? '' : 's'} (${b.orderItems.length} item${b.orderItems.length === 1 ? '' : 's'})</li>
          <li><b>${b.appointments.length}</b> booking${b.appointments.length === 1 ? '' : 's'} — <b>${answers}</b> with question answers</li>
        </ul>
        ${b.warnings.map(w => `<div class="note">${esc(w)}</div>`).join('')}
        <p class="small muted">Importing replaces the sample data with your real data. It's stored only in this browser — nothing is uploaded anywhere. “Reset demo data” (bottom left) brings the samples back.</p>
        <div class="modalfoot"><button onclick="UI.closeModal()">Cancel</button>
          <button class="primary" onclick="ImportService.apply()">Import now</button></div>`);
    } catch (e) { UI.err(e); }
  },
  apply() {
    if (ImportService._mergeMode()) { ImportService.mergeAppointly(); return; }
    const b = ImportService.build();
    if (!b.customers.length) return;
    DB.customers = b.customers; DB.orders = b.orders; DB.orderItems = b.orderItems; DB.appointments = b.appointments;
    for (const k of ['payments', 'instalments', 'allocations', 'adjustments', 'reminderTasks', 'customerReminders', 'contactLog', 'outbox'])
      if (Array.isArray(DB[k])) DB[k] = [];
    DB.importInfo = { at: nowIso(), counts: { customers: b.customers.length, orders: b.orders.length, bookings: b.appointments.length } };
    Store.save(); Domain.refreshAll();
    ImportService.state = { customers: null, orders: null, appointly: null };
    UI.closeModal();
    App.go('#/dashboard'); App.route();
    UI.toast('Imported ' + DB.importInfo.counts.customers + ' customers, ' + DB.importInfo.counts.orders + ' orders and ' + DB.importInfo.counts.bookings + ' bookings.');
  },
};

/* ---- Live sync: this same file, served as a Google Apps Script web
   app (see Code.gs), gains a server that calls the Shopify Admin API
   with the token kept in Script properties. The page detects that
   environment and pulls live data through google.script.run. ---- */
const LiveSync = {
  syncing: false,
  _diag: null,
  available: () => typeof google !== 'undefined' && google.script && google.script.run,
  // One-screen debugging aid: what Shopify sent per order and how it was read.
  report() {
    const rows = LiveSync._diag;
    if (!rows || !rows.length) { UI.err(new Error('Run “Sync from Shopify now” first, then open the report.')); return; }
    const withProps = rows.filter(r => r.raw.length);
    const withDate = withProps.filter(r => r.bDate);
    const tally = new Map();
    for (const r of rows) { const k = r.venue || '(no venue found)'; tally.set(k, (tally.get(k) || 0) + 1); }
    const fmt = r => r.ref + ' · created ' + r.created + ' · read: date=' + (r.bDate || '✗') + ' time=' + (r.bTime || '✗') + ' venue=' + (r.venue || '✗') + '\n  ' + r.raw.join('\n  ');
    const problems = withProps.filter(r => !r.bDate || !r.venue).slice(0, 6);
    const good = withProps.filter(r => r.bDate && r.venue).slice(0, 2);
    UI.modal(`
      <h3>Booking data report</h3>
      <p class="small muted">Screenshot this box top to bottom — it shows exactly what Shopify sent and how each order was read.</p>
      <pre style="white-space:pre-wrap; background:var(--grey-bg); padding:12px; border-radius:8px; font-size:.72rem; max-height:55vh; overflow:auto">${esc(
        'Orders from Shopify: ' + rows.length +
        '\nWith Apntly booking info on them: ' + withProps.length +
        '\n  … where the booking date could be read: ' + withDate.length +
        '\n\nOrders per venue:\n' + [...tally.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => '  ' + v + ' × ' + k).join('\n') +
        (problems.length ? '\n\n—— Booking info that could NOT be fully read ——\n' + problems.map(fmt).join('\n\n') : '\n\nEvery order with booking info was read successfully.') +
        (good.length ? '\n\n—— Examples that read fine ——\n' + good.map(fmt).join('\n\n') : ''))}</pre>
      <div class="modalfoot"><button class="primary" onclick="UI.closeModal()">Close</button></div>`, true);
  },
  sync() {
    if (!LiveSync.available()) { UI.err(new Error('Live sync only works when the dashboard is opened from its Google Apps Script web-app link — see Connect data.')); return; }
    if (LiveSync.syncing) return;
    LiveSync.syncing = true;
    UI.toast('Syncing from Shopify…');
    google.script.run
      .withSuccessHandler(payload => {
        LiveSync.syncing = false;
        try { LiveSync.applyPayload(JSON.parse(payload)); } catch (e) { UI.err(e); }
      })
      .withFailureHandler(e => { LiveSync.syncing = false; UI.err(e); })
      .syncShopify();
  },
  // Shopify Admin API JSON → the dashboard's own shape.
  applyPayload(p) {
    if (p.error) throw new Error(p.error);
    const customers = [], orders = [], orderItems = [], appointments = [];
    const byEmail = new Map(), byPhone = new Map(), bySrcId = new Map();
    for (const sc of p.customers || []) {
      const name = [sc.first_name, sc.last_name].filter(Boolean).join(' ').trim() || sc.email || 'Unknown customer';
      const da = sc.default_address || {};
      const c = { id: uid(), name, daughterName: '', email: sc.email || '',
        phone: sc.phone || da.phone || '', address: [da.address1, da.city, da.province, da.zip].filter(Boolean).join(', '),
        notes: sc.note || '', createdAt: sc.created_at || nowIso() };
      customers.push(c);
      if (sc.id != null) bySrcId.set(String(sc.id), c);
      if (c.email) byEmail.set(c.email.toLowerCase(), c);
      const digits = ImportService._digits(c.phone);
      if (digits) byPhone.set(digits, c);
    }
    const diagRows = [];
    for (const so of p.orders || []) {
      let cust = (so.customer && so.customer.id != null && bySrcId.get(String(so.customer.id)))
        || (so.email && byEmail.get(String(so.email).toLowerCase())) || null;
      if (!cust) {
        cust = { id: uid(), name: (so.customer && [so.customer.first_name, so.customer.last_name].filter(Boolean).join(' ').trim()) || so.email || 'Unknown customer',
          daughterName: '', email: so.email || '', phone: '', address: '', notes: '', createdAt: so.created_at || nowIso() };
        customers.push(cust);
        if (cust.email) byEmail.set(cust.email.toLowerCase(), cust);
      }
      const pairs = (so.note_attributes || []).map(a => [String(a.name || '').trim(), String(a.value || '').trim()]).filter(x => x[0] && x[1]);
      // Apntly stamps bookings onto the LINE ITEM as properties:
      //   _booking_by: Appointly · Booking: "Date: Sep 27, 2026 Time: 10:00 AM - 11:00 AM"
      // and the venue lives in the event product's title, e.g.
      //   "Darcy Day Out at Castlemartyr Resort Event - 26th & 27th September 2026".
      let bookingTitle = '';
      const rawProps = [];
      for (const li of so.line_items || []) {
        const props = li.properties || [];
        if (props.length) rawProps.push('[item] ' + String(li.title || '').slice(0, 90));
        if (!bookingTitle && props.some(p => /^_booking/i.test(String(p.name || '')))) bookingTitle = String(li.title || '');
        for (const p of props) {
          const n = String(p.name || '').trim(), v = String(p.value || '').trim();
          rawProps.push(n + ' = ' + v.slice(0, 90));
          if (!n || !v) continue;
          const dt = v.match(/Date:\s*(.+?)\s*Time:\s*([\d:]+\s*(?:AM|PM)?)/i);
          if (dt && (/^booking$/i.test(n) || !n.startsWith('_'))) { pairs.push(['Booking Date', dt[1]], ['Booking Time', dt[2]]); continue; }
          if (n.startsWith('_')) continue; // Apntly internal fields
          pairs.push([n, v]);
        }
      }
      const cls = ImportService._classifyAttrs(pairs);
      let eventHotel = cls.eventHotel;
      if (!eventHotel && bookingTitle) {
        const stripped = bookingTitle.split(/\s+Event\b/i)[0].trim();
        const atIdx = stripped.toLowerCase().lastIndexOf(' at ');
        let occ = atIdx > 0 ? stripped.slice(0, atIdx).trim() : '';
        let ven = atIdx > 0 ? stripped.slice(atIdx + 4).trim() : stripped;
        // Titles often carry the dates ("The Cashel Palace, Tipperary - 19th &
        // 20th September 2026"); drop that so every variant of the same venue
        // lands on ONE venue tile instead of splitting the group.
        ven = ven.replace(/\s*[-–]\s*(?:(?:mon|tues|wednes|thurs|fri|satur|sun)day\b|\d{1,2}(?:st|nd|rd|th)\b)[\s\S]*$/i, '').trim() || ven;
        eventHotel = occ ? occ + ' — ' + ven : ven;
      }
      const eventDate = cls.eventDate || (eventHotel ? cls.bDate : '');
      const order = { id: uid(), customerId: cust.id, reference: so.name || ('SHOP-' + (orders.length + 1)),
        status: so.cancelled_at ? 'cancelled' : 'confirmed', createdAt: so.created_at || nowIso(),
        eventHotel, eventDate, planType: null, staffNotes: so.note || '' };
      orders.push(order);
      for (const li of so.line_items || []) {
        const vt = String(li.variant_title || '');
        const vp = (/^default title$/i.test(vt) ? '' : vt).split(' / ').map(s => s.trim());
        orderItems.push({ id: uid(), orderId: order.id, productId: null, title: li.title || 'Item',
          styleCode: li.sku || '', category: /dress|gown/i.test(li.title || '') ? 'dress' : 'accessory',
          colour: vp[0] || '', size: vp[1] || '', quantity: li.quantity || 1, retailPriceCents: parseEuros(li.price) || 0 });
      }
      // Apntly's first custom question asks for the daughter's name — use it.
      const qas2 = ImportService._expandQas(cls.qas);
      const dq = qas2.find(qa => /daughter'?s\s+name/i.test(qa.q));
      if (dq && dq.a && !cust.daughterName) cust.daughterName = dq.a;
      if (cls.bDate || qas2.length) {
        const at = cls.bDate || ImportService._normDate(order.createdAt.slice(0, 10)) || todayStr();
        appointments.push({ id: uid(), customerId: cust.id, source: 'appointly', service: cls.bService || eventHotel || 'Booking',
          time: cls.bTime, staffName: cls.bStaff, appointmentAt: at, status: at >= todayStr() ? 'upcoming' : 'completed',
          bookedAt: order.createdAt, syncedAt: nowIso(), questions: qas2 });
      }
      diagRows.push({ ref: order.reference, created: String(so.created_at || '').slice(0, 10),
        raw: rawProps, bDate: cls.bDate, bTime: cls.bTime, venue: eventHotel });
    }
    LiveSync._diag = diagRows;
    if (!customers.length) throw new Error('Shopify returned no customers — check the token scopes (read_customers, read_orders).');
    // Booking answers merged in from an Appointly CSV (and hand-logged
    // appointments) must survive re-syncs: re-link them to the freshly
    // built customers by email/phone, folding answers into the synced
    // booking for the same day where one exists.
    const oldCustById = new Map((DB.customers || []).map(c => [c.id, c]));
    const preserved = (DB.appointments || []).filter(a => a.source === 'appointly_csv' || a.source === 'manual');
    for (const a of preserved) {
      const oc = oldCustById.get(a.customerId);
      const nc = (oc && ((oc.email && byEmail.get(String(oc.email).toLowerCase()))
        || (ImportService._digits(oc.phone) && byPhone.get(ImportService._digits(oc.phone))))) || null;
      if (!nc) {
        // Customer exists only in Appointly (booked without an order) —
        // carry them and their booking through the sync untouched.
        if (oc) {
          customers.push(oc);
          if (oc.email) byEmail.set(String(oc.email).toLowerCase(), oc);
          if (ImportService._digits(oc.phone)) byPhone.set(ImportService._digits(oc.phone), oc);
          appointments.push(a);
        }
        continue;
      }
      a.customerId = nc.id;
      if (oc.daughterName && !nc.daughterName) nc.daughterName = oc.daughterName;
      const existing = appointments.find(x => x.customerId === nc.id && x.appointmentAt === a.appointmentAt);
      if (existing) {
        if (!existing.questions.length && a.questions.length) existing.questions = a.questions;
        if (!existing.time && a.time) existing.time = a.time;
        if (!existing.staffName && a.staffName) existing.staffName = a.staffName;
      } else appointments.push(a);
    }
    // Where the Appointly export has spoken for a customer, its dates win
    // over the copy on the Shopify order — every sync, not just at import.
    const csvCust2 = new Set(), csvKeep2 = new Set();
    for (const a of appointments) if (a.source === 'appointly_csv' || a.source === 'manual') {
      csvCust2.add(a.customerId);
      csvKeep2.add(a.customerId + '|' + a.appointmentAt);
    }
    for (let i = appointments.length - 1; i >= 0; i--) {
      const a = appointments[i];
      if (a.source === 'appointly' && csvCust2.has(a.customerId) && !csvKeep2.has(a.customerId + '|' + a.appointmentAt)) appointments.splice(i, 1);
    }
    // Shopify customer lists collect spam/newsletter signups. Keep only
    // people with an actual order or booking (when there are orders at all).
    let kept = customers;
    if (orders.length) {
      const used = new Set(orders.map(o => o.customerId));
      for (const a of appointments) used.add(a.customerId);
      kept = customers.filter(c => used.has(c.id));
      if (!kept.length) kept = customers;
    }
    const skipped = customers.length - kept.length;
    DB.customers = kept; DB.orders = orders; DB.orderItems = orderItems; DB.appointments = appointments;
    for (const k of ['payments', 'instalments', 'allocations', 'adjustments', 'reminderTasks', 'customerReminders', 'contactLog', 'outbox'])
      if (Array.isArray(DB[k])) DB[k] = [];
    DB.importInfo = { at: nowIso(), live: true, counts: { customers: kept.length, orders: orders.length, bookings: appointments.length } };
    Store.save(); Domain.refreshAll(); App.route();
    UI.toast('Live sync complete — ' + kept.length + ' customers, ' + orders.length + ' orders, ' + appointments.length + ' bookings' +
      (skipped > 0 ? ' (' + skipped + ' contacts with no orders — newsletter/spam signups — left out).' : '.'));
  },
};

/* =============================== PRINTING (the only actions) =============================== */

   feed in, and the only thing it DOES is print — A4 customer sheets
   (contact details + the Appointly booking answers) and the staff run
   sheet for an event day. Editing, payments, invoicing and reminders
   come back in a later phase. */
const Actions = {
  /* Shared A4 sheet builder — one page per customer. Each row:
     { c, items, orderRef, qa, headline, slotMain, slotSub, staffName } */
  _sheetHtml(rows, docTitle) {

      .fl { display: inline-flex; align-items: flex-end; gap: 6px; margin: 7px 12px 0 0; vertical-align: bottom; }

    </style></head><body>

        </div>
        <h2>What they told us when booking (Appointly)</h2>
        ${r.qa ? r.qa.questions.map(q => `<div class="qa"><div class="q">${esc(q.q)}</div><div class="a">${esc(q.a || '—')}</div></div>`).join('')
          : '<div class="m">No booking answers on file.</div>'}
        <h2>Already on order${r.orderRef ? ' (' + esc(r.orderRef) + ')' : ''}</h2>
        <table class="itms">${r.items.map(i => `<tr><td><b>${esc(i.title)}</b></td><td>${esc(i.colour || '—')}</td><td>${esc(i.size || '—')}</td><td>× ${i.quantity}</td></tr>`).join('') || '<tr><td class="m">Nothing yet.</td></tr>'}</table>
        <h2>Ordered at this appointment — fill in</h2>
        ${line('Dress / style:', '58%')}${line('Size:', '36%')}
        ${line('Colour:', '46%')}${line('Alterations:', '48%')}
        <div style="margin-top:4px">${line('Bow:', '30%')}${line('Veil:', '30%')}${line('Shoes:', '31%')}

      </div>`).join('')}
    </body></html>`;
  },
  _sheetModal(heading, blurb, html, count) {
    UI.modal(`
      <h3>${heading}</h3>
      <p class="small muted">${blurb}</p>
      <iframe class="invoice-frame" id="csframe"></iframe>
      <div class="modalfoot"><button onclick="UI.closeModal()">Close</button>
        <button class="primary" onclick="document.getElementById('csframe').contentWindow.print()">🖨 Print / save PDF (${count} sheet${count === 1 ? '' : 's'})</button></div>`, true);
    document.getElementById('csframe').srcdoc = html;
  },
  /* One customer → one generic sheet row (used by the all-customers and
     single-customer prints, where there's no specific event day). */
  _customerRow(c) {
    const orders = Domain.ordersOf(c.id).filter(o => o.status !== 'cancelled').sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);
    const o = orders[0] || null;
    const appts = AppointlyService.bookingsFor(c.id);
    const upcoming = appts.filter(a => a.appointmentAt >= todayStr())
      .sort((a, b) => (a.appointmentAt + (a.time || '')) < (b.appointmentAt + (b.time || '')) ? -1 : 1)[0];
    const qa = appts.filter(a => a.questions.length).sort((a, b) => a.appointmentAt < b.appointmentAt ? 1 : -1)[0];
    return {
      c, qa,
      items: o ? Domain.itemsOf(o.id) : [],
      orderRef: o ? o.reference : '',
      headline: o && o.eventHotel ? esc(o.eventHotel) + (o.eventDate ? ' · <b>' + esc(fmtDate(o.eventDate)) + '</b>' : '') : 'No event on file',
      slotMain: upcoming && upcoming.time ? upcoming.time : '—',
      slotSub: upcoming ? fmtDate(upcoming.appointmentAt) : 'No appointment booked',
      staffName: (upcoming && upcoming.staffName) || '',
    };
  },
  /* Every customer in the system: details + Appointly answers, one A4 page each. */
  printAllCustomerSheets() {
    const rows = DB.customers.slice().sort((a, b) => a.name.localeCompare(b.name)).map(Actions._customerRow);
    Actions._sheetModal('Customer sheets — all customers',
      'One A4 page per customer: contact details plus the questions they answered when booking through Appointly. Print the lot or save as one PDF.',
      Actions._sheetHtml(rows, 'Customer sheets — all customers'), rows.length);
  },
  /* Single customer, from their page. */
  printCustomerSheet(customerId) {
    const c = Domain.customer(customerId);
    if (!c) return;
    const rows = [Actions._customerRow(c)];
    Actions._sheetModal(`Customer sheet — ${esc(c.name)}`,
      'Contact details plus the questions they answered when booking through Appointly.',
      Actions._sheetHtml(rows, `Customer sheet — ${c.name}`), 1);
  },
  /* One event day at one venue: a sheet per booked customer, in slot order. */
  printCustomerSheets(venueEnc, day) {
    const venue = decodeURIComponent(venueEnc);
    const cfg = DB.settings.eventDay;
    const dayLabel = new Date(day + 'T00:00').toLocaleDateString('en-IE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const blockOf = t => {
      if (!t) return null;
      const h = parseInt(t.slice(0, 2), 10);
      return h >= cfg.startHour && h < cfg.endHour ? h - cfg.startHour + 1 : null;
    };
    const rows = [];
    for (const o of DB.orders) {
      if (!o.eventHotel || o.eventDate !== day) continue;
      const parts = o.eventHotel.split(/\s+—\s+/);
      if ((parts[1] || parts[0]).trim() !== venue) continue;
      const c = Domain.customer(o.customerId);
      const slot = DB.appointments.filter(x => x.customerId === c.id && x.appointmentAt === day)
        .sort((p, q) => (p.time || '') < (q.time || '') ? -1 : 1)[0];
      // Booking answers can live on an earlier fitting appointment.
      const qa = DB.appointments.filter(x => x.customerId === c.id && x.questions.length)
        .sort((p, q) => p.appointmentAt < q.appointmentAt ? 1 : -1)[0];
      const blk = slot ? blockOf(slot.time) : null;
      rows.push({
        c, qa, items: Domain.itemsOf(o.id), orderRef: o.reference,
        headline: esc(venue) + ' · <b>' + esc(dayLabel) + '</b> · ' + esc((parts[0] || '').trim()),
        slotMain: slot && slot.time ? slot.time : '—',
        slotSub: blk ? 'Block ' + blk : 'No slot booked',
        staffName: (slot && slot.staffName) || '',
        _t: (slot && slot.time) || '99',
      });
    }
    rows.sort((a, b) => a._t < b._t ? -1 : 1);
    Actions._sheetModal(`Customer sheets — ${esc(venue)}, ${esc(dayLabel)}`,
      'One A4 page per customer, in block order, staff name top-right for sorting into piles. Print the lot before the event.',
      Actions._sheetHtml(rows, `Customer sheets — ${venue}`), rows.length);
  },
  /* Printable run sheet: hand each staff member the day's schedule —
     time, customer, who it's for, dress, assigned staff. No balances. */
  printRunSheet(venueEnc, day) {
    const venue = decodeURIComponent(venueEnc);
    const cfg = DB.settings.eventDay;
    const hh = h => String(h).padStart(2, '0');
    const dayLabel = new Date(day + 'T00:00').toLocaleDateString('en-IE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const rows = [];
    for (const o of DB.orders) {
      if (!o.eventHotel || o.eventDate !== day) continue;
      const parts = o.eventHotel.split(/\s+—\s+/);
      if ((parts[1] || parts[0]).trim() !== venue) continue;
      const c = Domain.customer(o.customerId);
      const a = DB.appointments.filter(x => x.customerId === c.id && x.appointmentAt === day)
        .sort((p, q) => (p.time || '') < (q.time || '') ? -1 : 1)[0];
      const dress = Domain.itemsOf(o.id).filter(i => i.category === 'dress')[0];
      // Booking answers can live on an earlier appointment than the event slot.
      const qa = DB.appointments.filter(x => x.customerId === c.id && x.questions.some(z => z.a))
        .sort((p, q) => p.appointmentAt < q.appointmentAt ? 1 : -1)[0];
      rows.push({ c, o, a, dress, qa, occasion: (parts[0] || '').trim() });
    }
    const blockRows = [];
    for (let h = cfg.startHour; h < cfg.endHour; h++) {
      const inBlock = rows.filter(r => r.a && r.a.time && r.a.time >= hh(h) + ':00' && r.a.time < hh(h + 1) + ':00')
        .sort((p, q) => p.a.time < q.a.time ? -1 : 1);
      if (inBlock.length) blockRows.push({ label: hh(h) + ':00 – ' + hh(h + 1) + ':00', rows: inBlock });
    }
    const unslotted = rows.filter(r => !r.a || !r.a.time);
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Run sheet — ${esc(venue)}</title><style>
      body { font-family: "Segoe UI", Helvetica, Arial, sans-serif; color: #1f2229; margin: 0; padding: 30px 36px; font-size: 13.5px; }
      h1 { font-size: 20px; margin: 0; color: #9b2c4d; } .m { color: #666; }
      h2 { font-size: 13px; background: #f2e5ea; padding: 6px 10px; border-radius: 6px; margin: 22px 0 4px; }
      table { border-collapse: collapse; width: 100%; }
      th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: #777; border-bottom: 2px solid #ddd; padding: 6px 8px; }
      td { padding: 8px; border-bottom: 1px solid #eee; vertical-align: top; }
      .t { font-weight: 800; font-size: 15px; white-space: nowrap; } .s { font-weight: 700; }
      .blank { color: #bbb; } @media print { body { padding: 0 } }
    </style></head><body>
      <h1>Darcybow — staff run sheet</h1>
      <div class="m">${esc(venue)} · <b>${esc(dayLabel)}</b> · private appointments, up to ${cfg.slotCapacity} customers per slot</div>
      ${(() => {
        // Answers only, one per line, with a short label instead of the
        // full question wording.
        const label = q => /daughter'?s\s+name|child'?s\s+name/i.test(q) ? "Child's name"
          : /school/i.test(q) ? 'School'
          : /communion/i.test(q) ? 'Communion date'
          : /occasion/i.test(q) ? 'Occasion' : '';
        const answers = r => {
          const qas = ImportService._expandQas(r.qa ? r.qa.questions : []).filter(z => z.a);
          return qas.length ? qas.map((z, n) => '<div>' + (n + 1) + '. ' +
            (label(z.q) ? '<span class="m">' + label(z.q) + ':</span> ' : '') + '<b>' + esc(z.a) + '</b></div>').join('')
            : '<span class="blank">—</span>';
        };
        const head = '<thead><tr><th style="width:60px">Time</th><th style="width:26%">Customer</th><th style="width:20%">Dress / occasion</th><th>Booking answers</th></tr></thead>';
        return blockRows.map(b => `<h2>${b.label}</h2>
        <table>${head}
        <tbody>${b.rows.map(r => `<tr>
          <td class="t">${esc(r.a.time)}</td>
          <td class="s">${esc(r.c.name)}<br><span class="m" style="font-weight:400">${esc(r.c.phone)}</span></td>
          <td>${r.dress ? esc(r.dress.title) + '<br><span class="m">' + esc(r.dress.colour) + ' · ' + esc(r.dress.size) + '</span><br>' : ''}<span class="m">${esc(r.occasion)}</span></td>
          <td>${answers(r)}</td>
        </tr>`).join('')}</tbody></table>`).join('') +
        (unslotted.length ? `<h2>No slot time yet</h2><table>${head}
        <tbody>${unslotted.map(r => `<tr>
          <td class="t blank">____</td><td class="s">${esc(r.c.name)}<br><span class="m" style="font-weight:400">${esc(r.c.phone)}</span></td>
          <td>${r.dress ? esc(r.dress.title) : '—'}</td>
          <td>${answers(r)}</td>
        </tr>`).join('')}</tbody></table>` : '');
      })()}
    </body></html>`;
    UI.modal(`
      <h3>Staff run sheet — ${esc(venue)}, ${esc(dayLabel)}</h3>
      <p class="small muted">One sheet for the whole day: time, customer, who it's for, dress and their booking answers. Balances are deliberately left off.</p>
      <iframe class="invoice-frame" id="runframe"></iframe>
      <div class="modalfoot"><button onclick="UI.closeModal()">Close</button>
        <button class="primary" onclick="document.getElementById('runframe').contentWindow.print()">🖨 Print / save PDF</button></div>`, true);
    document.getElementById('runframe').srcdoc = html;
  },
};

/* =============================== BOOT =============================== */
(function boot() {
  Store.load();
  // Clean up any question blobs stored by earlier imports (idempotent).
  let migrated = false;
  for (const a of DB.appointments || []) {
    const before = (a.questions || []).length;
    a.questions = ImportService._expandQas(a.questions || []);
    if (a.questions.length !== before) migrated = true;
    const dq = a.questions.find(qa => /daughter'?s\s+name/i.test(qa.q));
    if (dq && dq.a) {
      const c = (DB.customers || []).find(x => x.id === a.customerId);
      if (c && !c.daughterName) { c.daughterName = dq.a; migrated = true; }
    }
  }
  if (migrated) Store.save();
  Domain.refreshAll();
  window.addEventListener('hashchange', App.route);
  App.route();
  // Served as the Apps Script web app → refresh from Shopify on every open.
  if (LiveSync.available()) LiveSync.sync();
})();
</script>
</body>
</html>
