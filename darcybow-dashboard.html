<script>
/* =============================== CONNECT DATA (CSV import) =============================== */
/* "Connecting" Shopify + Appointly without a server: both apps have
   Export buttons, and this page turns those CSV files into the same
   shape as the seeded sample data. Browsers can't call the Shopify
   Admin API directly (blocked for security, and the token would be
   exposed), so a fully automatic sync needs this dashboard hosted with
   a small backend — the LIVE CREDENTIAL SEAMs above mark where that
   plugs in when the time comes. */

function parseCsv(text) {
  text = String(text || '').replace(/^\uFEFF/, '');
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); cell = '';
      if (row.length > 1 || row[0].trim() !== '') rows.push(row);
      row = [];
    } else cell += ch;
  }
  row.push(cell);
  if (row.length > 1 || row[0].trim() !== '') rows.push(row);
  if (!rows.length) return { headers: [], records: [] };
  const headers = rows[0].map(h => h.trim());
  const records = rows.slice(1).map(r => { const o = {}; headers.forEach((h, i) => o[h] = (r[i] || '').trim()); return o; });
  return { headers, records };
}

const ImportService = {
  state: { customers: null, orders: null, appointly: null },

  async fileChosen(kind, input) {
    try {
      const file = input.files && input.files[0];
      if (!file) return;
      const text = await file.text();
      const parsed = parseCsv(text);
      if (!parsed.records.length) throw new Error('No data rows found in ' + file.name + ' — is it a CSV export?');
      ImportService.state[kind] = { name: file.name, raw: text, headers: parsed.headers, records: parsed.records };
      App.route();
    } catch (e) { input.value = ''; UI.err(e); }
  },
  clear(kind) { ImportService.state[kind] = null; App.route(); },

  // First header equal to a candidate wins; then first header containing one.
  _col(headers, ...cands) {
    for (const cand of cands) { const h = headers.find(x => x.toLowerCase() === cand); if (h) return h; }
    for (const cand of cands) { const h = headers.find(x => x.toLowerCase().includes(cand)); if (h) return h; }
    return null;
  },
  _digits: s => String(s || '').replace(/\D/g, ''),
  _normDate(str) {
    const s = String(str || '').trim();
    if (!s) return '';
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[0];
    m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/); // Irish exports: day first
    if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
    const d = new Date(s);
    return isNaN(d) ? '' : d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  },
  _normTime(str) {
    const m = String(str || '').match(/(\d{1,2}):(\d{2})\s*(am|pm)?/i);
    if (!m) return '';
    let h = parseInt(m[1], 10);
    if (m[3]) { const pm = m[3].toLowerCase() === 'pm'; if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
    return String(h).padStart(2, '0') + ':' + m[2];
  },
  // Appointly's export can pack all responses into one cell:
  //   "Ques: What is your Daughter's Name? Ans: Emilia ... Ques: ... Ans: ..."
  // Split those into proper question/answer pairs and drop export junk
  // (Variant / Default Title / empty Custom Questions labels).
  _expandQas(qas) {
    const out = [];
    for (const qa of qas || []) {
      const q = String(qa.q || '').trim(), a = String(qa.a || '').trim();
      if (!a) continue;
      if (/^variant$/i.test(q) || /^default title$/i.test(a)) continue;
      if (/Ques\s*:/i.test(a)) {
        const re = /Ques\s*:\s*([\s\S]*?)\s*Ans\s*:\s*([\s\S]*?)(?=Ques\s*:|$)/gi;
        let m;
        while ((m = re.exec(a))) { if (m[2].trim()) out.push({ q: m[1].trim(), a: m[2].trim() }); }
        continue;
      }
      if (/^custom questions?$/i.test(q)) continue;
      out.push({ q, a });
    }
    return out;
  },
  // "Darcy Day Out at The Cashel Palace, Tipperary - 19th & 20th September
  // 2026 (Deleted)" → "Darcy Day Out — The Cashel Palace, Tipperary".
  _eventFromTitle(t) {
    const stripped = String(t || '').split(/\s+Event\b/i)[0].replace(/\s*\(deleted\)\s*/ig, ' ').trim();
    const atIdx = stripped.toLowerCase().lastIndexOf(' at ');
    const occ = atIdx > 0 ? stripped.slice(0, atIdx).trim() : '';
    let ven = atIdx > 0 ? stripped.slice(atIdx + 4).trim() : stripped;
    ven = ven.replace(/\s*[-–]\s*(?:(?:mon|tues|wednes|thurs|fri|satur|sun)day\b|\d{1,2}(?:st|nd|rd|th)\b)[\s\S]*$/i, '').trim() || ven;
    return occ ? occ + ' — ' + ven : ven;
  },
  // The booking questions include contact fields (Address 1/2/3, Postcode,
  // Mobile, Email) — fold those into the customer record and keep only the
  // real questions.
  _absorbContactQas(cust, qas) {
    const rest = [];
    const addr = { a1: '', a2: '', a3: '', post: '' };
    for (const qa of qas) {
      const q = String(qa.q || '').toLowerCase();
      if (/^address\s*1/.test(q)) addr.a1 = qa.a;
      else if (/^address\s*2/.test(q)) addr.a2 = qa.a;
      else if (/^address\s*3/.test(q)) addr.a3 = qa.a;
      else if (/^(post\s*code|postcode|eircode)/.test(q)) addr.post = qa.a;
      else if (/^(mobile|phone|contact)\b/.test(q)) { if (cust && !cust.phone) cust.phone = qa.a; }
      else if (/^e-?mail/.test(q)) { /* already keyed on email */ }
      else rest.push(qa);
    }
    const full = [addr.a1, addr.a2, addr.a3, addr.post].filter(Boolean).join(', ');
    if (full && cust && !cust.address) cust.address = full;
    return rest;
  },
  // Sort an order's attribute [key, value] pairs into booking details,
  // event info and question answers. Shared by the CSV importer and the
  // live Shopify sync (Appointly writes bookings onto orders this way).
  _classifyAttrs(pairs) {
    const normDate = ImportService._normDate, normTime = ImportService._normTime;
    const out = { eventHotel: '', eventDate: '', bDate: '', bTime: '', bService: '', bStaff: '', qas: [] };
    for (const [k, val] of pairs) {
      const kl = k.toLowerCase();
      // Anything phrased like a question stays a question — booking Q&As
      // often contain words like "occasion" or "date" in the sentence.
      const isQuestion = k.includes('?') || k.length > 40;
      if (isQuestion) { out.qas.push({ q: k, a: val }); continue; }
      if (/booking date|appointment date/.test(kl) || kl === 'date') out.bDate = normDate(val);
      else if (/booking time|appointment time|start time/.test(kl) || kl === 'time') out.bTime = normTime(val);
      else if (/^(service|appointment type|appointment)$/.test(kl)) out.bService = val;
      else if (/^(staff|employee|team member)$/.test(kl)) out.bStaff = val;
      else if (/event date|ceremony date/.test(kl)) out.eventDate = normDate(val);
      else if (/venue|hotel|location|event|occasion/.test(kl)) out.eventHotel = out.eventHotel || val;
      else out.qas.push({ q: k, a: val });
    }
    return out;
  },

  // Turn whatever files are loaded into { customers, orders, orderItems, appointments }.
  build() {
    const s = ImportService.state;
    const col = ImportService._col, normDate = ImportService._normDate, normTime = ImportService._normTime;
    const customers = [], orders = [], orderItems = [], appointments = [], warnings = [];
    const byEmail = new Map(), byPhone = new Map();
    const findOrCreateCustomer = (name, email, phone, extra) => {
      const e = String(email || '').toLowerCase();
      const p = ImportService._digits(phone);
      let c = (e && byEmail.get(e)) || (p && byPhone.get(p)) || null;
      if (!c) {
        c = { id: uid(), name: (name || email || 'Unknown customer').trim(), daughterName: '', email: email || '',
          phone: phone || '', address: '', notes: '', createdAt: nowIso() };
        customers.push(c);
      }
      if (e) byEmail.set(e, c);
      if (p) byPhone.set(p, c);
      if (extra) for (const k of Object.keys(extra)) if (extra[k] && !c[k]) c[k] = extra[k];
      return c;
    };

    /* ---- Shopify customers export ---- */
    if (s.customers) {
      const H = s.customers.headers;
      const first = col(H, 'first name'), last = col(H, 'last name');
      const email = col(H, 'email'), phone = col(H, 'phone');
      const addr1 = col(H, 'address1'), city = col(H, 'city'), prov = col(H, 'province name', 'province'), zip = col(H, 'zip');
      const note = col(H, 'note');
      if (!email && !first) warnings.push('Customers file: the usual Shopify columns (First Name, Email…) weren\'t found — imported what was possible.');
      for (const r of s.customers.records) {
        const name = [first ? r[first] : '', last ? r[last] : ''].filter(Boolean).join(' ').trim();
        if (!name && !(email && r[email])) continue;
        findOrCreateCustomer(name, email ? r[email] : '', phone ? r[phone] : '', {
          address: [addr1, city, prov, zip].map(h => h ? r[h] : '').filter(Boolean).join(', '),
          notes: note ? r[note] : '',
        });
      }
    }

    /* ---- Shopify orders export (one row per line item) ---- */
    if (s.orders) {
      const H = s.orders.headers;
      const ref = col(H, 'name'), email = col(H, 'email'), created = col(H, 'created at');
      const lineName = col(H, 'lineitem name'), lineQty = col(H, 'lineitem quantity'), linePrice = col(H, 'lineitem price'), lineSku = col(H, 'lineitem sku');
      const bName = col(H, 'billing name'), phone = col(H, 'phone', 'billing phone');
      const notes = col(H, 'notes'), noteAttr = col(H, 'note attributes'), cancelled = col(H, 'cancelled at');
      if (!ref || !lineName) warnings.push('Orders file: expected Shopify columns (Name, Lineitem name…) weren\'t all found — imported what was possible.');
      const groups = new Map();
      for (const r of s.orders.records) {
        const key = ref ? r[ref] : String(groups.size);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(r);
      }
      for (const [reference, rows] of groups) {
        const head = rows.find(r => (email && r[email]) || (bName && r[bName])) || rows[0];
        const cust = findOrCreateCustomer(bName ? head[bName] : '', email ? head[email] : '', phone ? head[phone] : '');
        // Appointly writes booking details onto the order as note attributes
        // ("Key: value" lines) — pull out the booking + questions.
        const attrs = [];
        String(noteAttr ? head[noteAttr] : '').split(/\n+/).forEach(line => {
          const m = line.match(/^([^:]{1,120}):\s*(.*)$/);
          if (m && m[2].trim()) attrs.push([m[1].trim(), m[2].trim()]);
        });
        const cls = ImportService._classifyAttrs(attrs);
        const createdAt = (() => { const d = new Date(created ? head[created] : ''); return isNaN(d) ? nowIso() : d.toISOString(); })();
        const order = { id: uid(), customerId: cust.id, reference: reference || ('IMP-' + (orders.length + 1)),
          status: cancelled && head[cancelled] ? 'cancelled' : 'confirmed', createdAt,
          eventHotel: cls.eventHotel, eventDate: cls.eventDate, planType: null, staffNotes: notes ? head[notes] : '' };
        orders.push(order);
        for (const r of rows) {
          const t0 = lineName ? r[lineName] : '';
          if (!t0) continue;
          let title = t0, colour = '', size = '';
          const dash = t0.split(' - ');
          if (dash.length > 1) {
            title = dash[0].trim();
            const vp = dash.slice(1).join(' - ').split(' / ').map(x => x.trim());
            colour = vp[0] || ''; size = vp[1] || '';
          }
          orderItems.push({ id: uid(), orderId: order.id, productId: null, title,
            styleCode: lineSku ? r[lineSku] : '', category: /dress|gown/i.test(title) ? 'dress' : 'accessory',
            colour, size, quantity: parseInt(lineQty ? r[lineQty] : '1', 10) || 1,
            retailPriceCents: parseEuros(linePrice ? r[linePrice] : '') || 0 });
        }
        const qas2 = ImportService._expandQas(cls.qas);
        const dq = qas2.find(qa => /daughter'?s\s+name/i.test(qa.q));
        if (dq && dq.a && !cust.daughterName) cust.daughterName = dq.a;
        if (cls.bDate || qas2.length) {
          const at = cls.bDate || normDate(createdAt.slice(0, 10)) || todayStr();
          appointments.push({ id: uid(), customerId: cust.id, source: 'appointly', service: cls.bService || 'Booking',
            time: cls.bTime, staffName: cls.bStaff, appointmentAt: at, status: at >= todayStr() ? 'upcoming' : 'completed',
            bookedAt: createdAt, syncedAt: nowIso(), questions: qas2 });
        }
      }
    }

    /* ---- Appointly bookings export ---- */
    if (s.appointly) {
      const H = s.appointly.headers;
      const email = col(H, 'email'), name = col(H, 'customer name', 'client name', 'name'), phone = col(H, 'phone');
      const date = col(H, 'appointment date', 'booking date', 'start date', 'date');
      const time = col(H, 'start time', 'appointment time', 'booking time', 'time');
      const service = col(H, 'service', 'appointment type', 'type');
      const staff = col(H, 'staff', 'employee', 'team member', 'assigned');
      const statusCol = col(H, 'status'), location = col(H, 'location', 'venue');
      const known = new Set([email, name, phone, date, time, service, staff, statusCol, location].filter(Boolean));
      // Question columns: headers with a "?" if any exist, otherwise every
      // leftover column that isn't an obvious id/timestamp/money field.
      const withQ = H.filter(h => h.includes('?'));
      const qCols = withQ.length ? withQ
        : H.filter(h => h && !known.has(h) && !/\bid\b|created|updated|duration|price|amount|currency|order|payment|end time|timezone/i.test(h));
      if (!qCols.length) warnings.push('Appointly file: no question columns found — booking answers may be missing.');
      const orderCol = col(H, 'order');
      const createdCol = col(H, 'createdat', 'created at', 'booked at', 'created');
      for (const r of s.appointly.records) {
        if (!((email && r[email]) || (name && r[name]))) continue;
        if (statusCol && /cancel/i.test(r[statusCol])) continue;
        const cust = findOrCreateCustomer(name ? r[name] : '', email ? r[email] : '', phone ? r[phone] : '');
        // "Appointment Time" often carries date AND time in one cell.
        const rawWhen = (date ? r[date] : '') || (time ? r[time] : '');
        const d = normDate(rawWhen);
        const qas = ImportService._absorbContactQas(cust,
          ImportService._expandQas(qCols.map(h => ({ q: h, a: r[h] || '' })).filter(qa => qa.a)));
        const dq = qas.find(qa => /daughter'?s\s+name/i.test(qa.q));
        if (dq && dq.a && !cust.daughterName) cust.daughterName = dq.a;
        const svcRaw = (service ? r[service] : '').replace(/\s*\(deleted\)\s*/ig, ' ').trim();
        const eventHotel = /\sat\s/i.test(svcRaw) ? ImportService._eventFromTitle(svcRaw) : '';
        appointments.push({ id: uid(), customerId: cust.id, source: 'appointly',
          service: [eventHotel || svcRaw, location ? r[location] : ''].filter(Boolean).join(' — ') || 'Appointment',
          eventHotel, _orderRef: orderCol ? (r[orderCol] || '').trim() : '',
          appointmentAt: d || todayStr(), time: normTime((time ? r[time] : '') || rawWhen),
          status: (d || todayStr()) >= todayStr() ? 'upcoming' : 'completed',
          bookedAt: (() => { const bd = new Date(createdCol ? r[createdCol] : ''); return isNaN(bd) ? nowIso() : bd.toISOString(); })(),
          syncedAt: nowIso(), staffName: staff ? r[staff] : '',
          questions: qas });
      }
    }

    // Same spam guard as the live sync: when orders are present, keep only
    // customers with an order or booking.
    if (orders.length) {
      const used = new Set(orders.map(o => o.customerId));
      for (const a of appointments) used.add(a.customerId);
      const kept = customers.filter(c => used.has(c.id));
      if (kept.length && kept.length < customers.length) {
        warnings.push((customers.length - kept.length) + ' contact' + (customers.length - kept.length === 1 ? '' : 's') +
          ' with no orders or bookings left out (newsletter/spam signups).');
        return { customers: kept, orders, orderItems, appointments, warnings };
      }
    }
    return { customers, orders, orderItems, appointments, warnings };
  },

  // Appointly file added on its own while live/imported data is connected →
  // merge the bookings in (matched by email/phone) instead of replacing everything.
  _mergeMode() {
    const s = ImportService.state;
    return !!(s.appointly && !s.customers && !s.orders && DB.importInfo);
  },
  mergeAppointly(fromServer) {
    const rawCsv = ImportService.state.appointly && ImportService.state.appointly.raw;
    const b = ImportService.build();
    const stubById = new Map(b.customers.map(c => [c.id, c]));
    const byEmail = new Map(DB.customers.filter(c => c.email).map(c => [c.email.toLowerCase(), c]));
    const byPhone = new Map(DB.customers.filter(c => ImportService._digits(c.phone)).map(c => [ImportService._digits(c.phone), c]));
    let merged = 0, added = 0, created = 0;
    const resolved = [];
    const custById = new Map(DB.customers.map(c => [c.id, c]));
    const byOrderRef = new Map(DB.orders.map(o => [String(o.reference || '').trim(), o.customerId]));
    for (const a of b.appointments) {
      const stub = stubById.get(a.customerId);
      if (!stub) continue;
      let real = (stub.email && byEmail.get(stub.email.toLowerCase()))
        || (ImportService._digits(stub.phone) && byPhone.get(ImportService._digits(stub.phone)))
        || (a._orderRef && custById.get(byOrderRef.get(a._orderRef))) || null;
      // Bookings made without a Shopify order (added by staff, or no deposit
      // paid online) belong to customers Shopify has never seen — create them.
      if (!real) {
        real = { id: uid(), name: stub.name, daughterName: stub.daughterName || '', email: stub.email || '',
          phone: stub.phone || '', address: stub.address || '', notes: '', createdAt: nowIso() };
        DB.customers.push(real);
        if (real.email) byEmail.set(real.email.toLowerCase(), real);
        if (ImportService._digits(real.phone)) byPhone.set(ImportService._digits(real.phone), real);
        created++;
      }
      if (stub.daughterName && !real.daughterName) real.daughterName = stub.daughterName;
      if (stub.phone && !real.phone) real.phone = stub.phone;
      if (stub.address && !real.address) real.address = stub.address;
      a.customerId = real.id; a.source = 'appointly_csv';
      resolved.push(a);
    }
    // The Appointly export is the truth for bookings: for customers in it,
    // drop bookings (order-derived or from an older export) whose dates
    // this export doesn't confirm.
    const csvCusts = new Set(resolved.map(a => a.customerId));
    const csvDates = new Set(resolved.map(a => a.customerId + '|' + a.appointmentAt));
    DB.appointments = DB.appointments.filter(x =>
      !((x.source === 'appointly' || x.source === 'appointly_csv') && csvCusts.has(x.customerId) && !csvDates.has(x.customerId + '|' + x.appointmentAt)));
    for (const a of resolved) {
      const existing = DB.appointments.find(x => x.customerId === a.customerId && x.appointmentAt === a.appointmentAt);
      if (existing) {
        if (!existing.questions.length && a.questions.length) existing.questions = a.questions;
        if (!existing.time && a.time) existing.time = a.time;
        if (!existing.staffName && a.staffName) existing.staffName = a.staffName;
        if (!existing.eventHotel && a.eventHotel) existing.eventHotel = a.eventHotel;
        existing.source = 'appointly_csv'; // export-backed: survives every re-sync
        merged++;
      } else { DB.appointments.push(a); added++; }
    }
    Store.save(); Domain.refreshAll();
    ImportService.state = { customers: null, orders: null, appointly: null };
    UI.closeModal(); App.route();
    UI.toast('Booking answers merged — ' + merged + ' matched to existing bookings, ' + added + ' added' + (created ? ', ' + created + ' new customers created (booked without an order)' : '') + '.');
    // Manually imported here → store the export centrally so every other
    // browser opening the dashboard link receives it on its next sync.
    if (!fromServer && rawCsv && LiveSync.available()) {
      try { google.script.run.saveBookingsCsv(rawCsv); } catch (e) { /* non-fatal */ }
    }
  },
  preview() {
    try {
      const b = ImportService.build();
      if (!b.customers.length) throw new Error('Nothing to import yet — add at least one CSV file first.');
      const answers = b.appointments.filter(a => a.questions.some(qa => qa.a)).length;
      UI.modal(`
        <h3>Ready to import</h3>
        ${ImportService._mergeMode() ? '<div class="note info">These bookings will be <b>merged into your connected data</b> — matched to customers by email/phone. Nothing gets replaced, and the live sync keeps the answers.</div>' : ''}
        <ul style="line-height:1.9">
          <li><b>${b.customers.length}</b> customer${b.customers.length === 1 ? '' : 's'}</li>
          <li><b>${b.orders.length}</b> order${b.orders.length === 1 ? '' : 's'} (${b.orderItems.length} item${b.orderItems.length === 1 ? '' : 's'})</li>
          <li><b>${b.appointments.length}</b> booking${b.appointments.length === 1 ? '' : 's'} — <b>${answers}</b> with question answers</li>
        </ul>
        ${b.warnings.map(w => `<div class="note">${esc(w)}</div>`).join('')}
        <p class="small muted">Importing replaces the sample data with your real data. It's stored only in this browser — nothing is uploaded anywhere. “Reset demo data” (bottom left) brings the samples back.</p>
        <div class="modalfoot"><button onclick="UI.closeModal()">Cancel</button>
          <button class="primary" onclick="ImportService.apply()">Import now</button></div>`);
    } catch (e) { UI.err(e); }
  },
  apply() {
    if (ImportService._mergeMode()) { ImportService.mergeAppointly(); return; }
    const b = ImportService.build();
    if (!b.customers.length) return;
    DB.customers = b.customers; DB.orders = b.orders; DB.orderItems = b.orderItems; DB.appointments = b.appointments;
    for (const k of ['payments', 'instalments', 'allocations', 'adjustments', 'reminderTasks', 'customerReminders', 'contactLog', 'outbox'])
      if (Array.isArray(DB[k])) DB[k] = [];
    // Keep saved invoices pointing at the replaced customer records.
    const invByEmail = new Map(b.customers.filter(c => c.email).map(c => [c.email.toLowerCase(), c]));
    for (const inv of (DB.invoices || [])) {
      const nc = inv.contact && inv.contact.email ? invByEmail.get(String(inv.contact.email).toLowerCase()) : null;
      if (nc) inv.customerId = nc.id;
    }
    DB.importInfo = { at: nowIso(), counts: { customers: b.customers.length, orders: b.orders.length, bookings: b.appointments.length } };
    Store.save(); Domain.refreshAll();
    ImportService.state = { customers: null, orders: null, appointly: null };
    UI.closeModal();
    App.go('#/dashboard'); App.route();
    UI.toast('Imported ' + DB.importInfo.counts.customers + ' customers, ' + DB.importInfo.counts.orders + ' orders and ' + DB.importInfo.counts.bookings + ' bookings.');
  },
};

/* ---- Live sync: this same file, served as a Google Apps Script web
   app (see Code.gs), gains a server that calls the Shopify Admin API
   with the token kept in Script properties. The page detects that
   environment and pulls live data through google.script.run. ---- */
const LiveSync = {
  syncing: false,
  _diag: null,
  available: () => typeof google !== 'undefined' && google.script && google.script.run,
  // One-screen debugging aid: what Shopify sent per order and how it was read.
  report() {
    const rows = LiveSync._diag;
    if (!rows || !rows.length) { UI.err(new Error('Run “Sync from Shopify now” first, then open the report.')); return; }
    const withProps = rows.filter(r => r.raw.length);
    const withDate = withProps.filter(r => r.bDate);
    const tally = new Map();
    for (const r of rows) { const k = r.venue || '(no venue found)'; tally.set(k, (tally.get(k) || 0) + 1); }
    const fmt = r => r.ref + ' · created ' + r.created + ' · read: date=' + (r.bDate || '✗') + ' time=' + (r.bTime || '✗') + ' venue=' + (r.venue || '✗') + '\n  ' + r.raw.join('\n  ');
    const problems = withProps.filter(r => !r.bDate || !r.venue).slice(0, 6);
    const good = withProps.filter(r => r.bDate && r.venue).slice(0, 2);
    UI.modal(`
      <h3>Booking data report</h3>
      <p class="small muted">Screenshot this box top to bottom — it shows exactly what Shopify sent and how each order was read.</p>
      <pre style="white-space:pre-wrap; background:var(--grey-bg); padding:12px; border-radius:8px; font-size:.72rem; max-height:55vh; overflow:auto">${esc(
        'Orders from Shopify: ' + rows.length +
        '\nWith Apntly booking info on them: ' + withProps.length +
        '\n  … where the booking date could be read: ' + withDate.length +
        '\n\nOrders per venue:\n' + [...tally.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => '  ' + v + ' × ' + k).join('\n') +
        (problems.length ? '\n\n—— Booking info that could NOT be fully read ——\n' + problems.map(fmt).join('\n\n') : '\n\nEvery order with booking info was read successfully.') +
        (good.length ? '\n\n—— Examples that read fine ——\n' + good.map(fmt).join('\n\n') : ''))}</pre>
      <div class="modalfoot"><button class="primary" onclick="UI.closeModal()">Close</button></div>`, true);
  },
  sync() {
    if (!LiveSync.available()) { UI.err(new Error('Live sync only works when the dashboard is opened from its Google Apps Script web-app link — see Connect data.')); return; }
    if (LiveSync.syncing) return;
    LiveSync.syncing = true;
    UI.toast('Syncing from Shopify…');
    google.script.run
      .withSuccessHandler(payload => {
        LiveSync.syncing = false;
        try { LiveSync.applyPayload(JSON.parse(payload)); } catch (e) { UI.err(e); }
      })
      .withFailureHandler(e => { LiveSync.syncing = false; UI.err(e); })
      .syncShopify();
  },
  // Shopify Admin API JSON → the dashboard's own shape.
  // Order-independent fingerprint of an invoices payload, ignoring the
  // fields that legitimately change every sync (customer ids are rebuilt),
  // so we can tell whether the central Drive copy is missing local edits.
  _invFp(o) {
    const inv = (o.invoices || []).map(v => { const c = Object.assign({}, v); delete c.customerId; delete c._venueKey; return c; })
      .sort((a, b) => String(a.id) < String(b.id) ? -1 : 1);
    const st = o.settings ? Object.assign({}, o.settings, { eventCodes: Object.entries((o.settings && o.settings.eventCodes) || {}).sort() }) : null;
    return JSON.stringify({ inv, st });
  },
  // Shopify storefront products.json → { title, colours[], sizes[], priceCents }.
  // Option names vary (Colour/Color, Size/Age), so match loosely; where the
  // options carry no values, derive them from the variants instead.
  _mapCatalogue(list) {
    const out = [];
    for (const p of list || []) {
      const title = String(p.title || '').trim();
      if (!title) continue;
      let colours = [], sizes = [];
      const clean = vals => [...new Set((vals || []).filter(v => v && !/^default title$/i.test(String(v))).map(v => String(v).trim()))];
      (p.options || []).forEach((o, idx) => {
        let vals = clean(o.values);
        if (!vals.length) vals = clean((p.variants || []).map(v => v['option' + (idx + 1)]));
        const n = String(o.name || '');
        if (/colou?r/i.test(n)) colours = vals;
        else if (/size|age/i.test(n)) sizes = vals;
      });
      const priceCents = parseEuros(p.variants && p.variants[0] ? p.variants[0].price : '') || 0;
      out.push({ title, colours, sizes, priceCents, type: String(p.product_type || '') });
    }
    return out;
  },
  applyPayload(p) {
    if (p.error) throw new Error(p.error);
    const customers = [], orders = [], orderItems = [], appointments = [];
    const byEmail = new Map(), byPhone = new Map(), bySrcId = new Map();
    for (const sc of p.customers || []) {
      const name = [sc.first_name, sc.last_name].filter(Boolean).join(' ').trim() || sc.email || 'Unknown customer';
      const da = sc.default_address || {};
      const c = { id: uid(), name, daughterName: '', email: sc.email || '',
        phone: sc.phone || da.phone || '', address: [da.address1, da.city, da.province, da.zip].filter(Boolean).join(', '),
        notes: sc.note || '', createdAt: sc.created_at || nowIso() };
      customers.push(c);
      if (sc.id != null) bySrcId.set(String(sc.id), c);
      if (c.email) byEmail.set(c.email.toLowerCase(), c);
      const digits = ImportService._digits(c.phone);
      if (digits) byPhone.set(digits, c);
    }
    const diagRows = [];
    for (const so of p.orders || []) {
      let cust = (so.customer && so.customer.id != null && bySrcId.get(String(so.customer.id)))
        || (so.email && byEmail.get(String(so.email).toLowerCase())) || null;
      if (!cust) {
        cust = { id: uid(), name: (so.customer && [so.customer.first_name, so.customer.last_name].filter(Boolean).join(' ').trim()) || so.email || 'Unknown customer',
          daughterName: '', email: so.email || '', phone: '', address: '', notes: '', createdAt: so.created_at || nowIso() };
        customers.push(cust);
        if (cust.email) byEmail.set(cust.email.toLowerCase(), cust);
      }
      const pairs = (so.note_attributes || []).map(a => [String(a.name || '').trim(), String(a.value || '').trim()]).filter(x => x[0] && x[1]);
      // Apntly stamps bookings onto the LINE ITEM as properties:
      //   _booking_by: Appointly · Booking: "Date: Sep 27, 2026 Time: 10:00 AM - 11:00 AM"
      // and the venue lives in the event product's title, e.g.
      //   "Darcy Day Out at Castlemartyr Resort Event - 26th & 27th September 2026".
      let bookingTitle = '';
      const rawProps = [];
      for (const li of so.line_items || []) {
        const props = li.properties || [];
        if (props.length) rawProps.push('[item] ' + String(li.title || '').slice(0, 90));
        if (!bookingTitle && props.some(p => /^_booking/i.test(String(p.name || '')))) bookingTitle = String(li.title || '');
        for (const p of props) {
          const n = String(p.name || '').trim(), v = String(p.value || '').trim();
          rawProps.push(n + ' = ' + v.slice(0, 90));
          if (!n || !v) continue;
          const dt = v.match(/Date:\s*(.+?)\s*Time:\s*([\d:]+\s*(?:AM|PM)?)/i);
          if (dt && (/^booking$/i.test(n) || !n.startsWith('_'))) { pairs.push(['Booking Date', dt[1]], ['Booking Time', dt[2]]); continue; }
          if (n.startsWith('_')) continue; // Apntly internal fields
          pairs.push([n, v]);
        }
      }
      const cls = ImportService._classifyAttrs(pairs);
      let eventHotel = cls.eventHotel;
      if (!eventHotel && bookingTitle) eventHotel = ImportService._eventFromTitle(bookingTitle);
      const eventDate = cls.eventDate || (eventHotel ? cls.bDate : '');
      const order = { id: uid(), customerId: cust.id, reference: so.name || ('SHOP-' + (orders.length + 1)),
        status: so.cancelled_at ? 'cancelled' : 'confirmed', createdAt: so.created_at || nowIso(),
        eventHotel, eventDate, planType: null, staffNotes: so.note || '' };
      orders.push(order);
      for (const li of so.line_items || []) {
        const vt = String(li.variant_title || '');
        const vp = (/^default title$/i.test(vt) ? '' : vt).split(' / ').map(s => s.trim());
        orderItems.push({ id: uid(), orderId: order.id, productId: null, title: li.title || 'Item',
          styleCode: li.sku || '', category: /dress|gown/i.test(li.title || '') ? 'dress' : 'accessory',
          colour: vp[0] || '', size: vp[1] || '', quantity: li.quantity || 1, retailPriceCents: parseEuros(li.price) || 0 });
      }
      // Apntly's first custom question asks for the daughter's name — use it.
      const qas2 = ImportService._absorbContactQas(cust, ImportService._expandQas(cls.qas));
      const dq = qas2.find(qa => /daughter'?s\s+name/i.test(qa.q));
      if (dq && dq.a && !cust.daughterName) cust.daughterName = dq.a;
      if (cls.bDate || qas2.length) {
        const at = cls.bDate || ImportService._normDate(order.createdAt.slice(0, 10)) || todayStr();
        appointments.push({ id: uid(), customerId: cust.id, source: 'appointly', service: cls.bService || eventHotel || 'Booking',
          eventHotel, time: cls.bTime, staffName: cls.bStaff, appointmentAt: at, status: at >= todayStr() ? 'upcoming' : 'completed',
          bookedAt: order.createdAt, syncedAt: nowIso(), questions: qas2 });
      }
      diagRows.push({ ref: order.reference, created: String(so.created_at || '').slice(0, 10),
        raw: rawProps, bDate: cls.bDate, bTime: cls.bTime, venue: eventHotel });
    }
    LiveSync._diag = diagRows;
    if (!customers.length) throw new Error('Shopify returned no customers — check the token scopes (read_customers, read_orders).');
    // Booking answers merged in from an Appointly CSV (and hand-logged
    // appointments) must survive re-syncs: re-link them to the freshly
    // built customers by email/phone, folding answers into the synced
    // booking for the same day where one exists.
    const oldCustById = new Map((DB.customers || []).map(c => [c.id, c]));
    const preserved = (DB.appointments || []).filter(a => a.source === 'appointly_csv' || a.source === 'manual');
    for (const a of preserved) {
      const oc = oldCustById.get(a.customerId);
      const nc = (oc && ((oc.email && byEmail.get(String(oc.email).toLowerCase()))
        || (ImportService._digits(oc.phone) && byPhone.get(ImportService._digits(oc.phone))))) || null;
      if (!nc) {
        // Customer exists only in Appointly (booked without an order) —
        // carry them and their booking through the sync untouched.
        if (oc) {
          customers.push(oc);
          if (oc.email) byEmail.set(String(oc.email).toLowerCase(), oc);
          if (ImportService._digits(oc.phone)) byPhone.set(ImportService._digits(oc.phone), oc);
          appointments.push(a);
        }
        continue;
      }
      a.customerId = nc.id;
      if (oc.daughterName && !nc.daughterName) nc.daughterName = oc.daughterName;
      const existing = appointments.find(x => x.customerId === nc.id && x.appointmentAt === a.appointmentAt);
      if (existing) {
        if (!existing.questions.length && a.questions.length) existing.questions = a.questions;
        if (!existing.time && a.time) existing.time = a.time;
        if (!existing.staffName && a.staffName) existing.staffName = a.staffName;
        if (!existing.eventHotel && a.eventHotel) existing.eventHotel = a.eventHotel;
        existing.source = 'appointly_csv'; // keep the export-backed marker alive
      } else appointments.push(a);
    }
    // Where the Appointly export has spoken for a customer, its dates win
    // over the copy on the Shopify order — every sync, not just at import.
    const csvCust2 = new Set(), csvKeep2 = new Set();
    for (const a of appointments) if (a.source === 'appointly_csv' || a.source === 'manual') {
      csvCust2.add(a.customerId);
      csvKeep2.add(a.customerId + '|' + a.appointmentAt);
    }
    for (let i = appointments.length - 1; i >= 0; i--) {
      const a = appointments[i];
      if (a.source === 'appointly' && csvCust2.has(a.customerId) && !csvKeep2.has(a.customerId + '|' + a.appointmentAt)) appointments.splice(i, 1);
    }
    // Shopify customer lists collect spam/newsletter signups. Keep only
    // people with an actual order or booking (when there are orders at all).
    let kept = customers;
    if (orders.length) {
      const used = new Set(orders.map(o => o.customerId));
      for (const a of appointments) used.add(a.customerId);
      kept = customers.filter(c => used.has(c.id));
      if (!kept.length) kept = customers;
    }
    const skipped = customers.length - kept.length;
    DB.customers = kept; DB.orders = orders; DB.orderItems = orderItems; DB.appointments = appointments;
    // The website's product catalogue (fetched server-side from the public
    // storefront) — powers the dress/colour/size dropdowns on invoices.
    if (Array.isArray(p.products) && p.products.length) DB.catalogue = LiveSync._mapCatalogue(p.products);
    for (const k of ['payments', 'instalments', 'allocations', 'adjustments', 'reminderTasks', 'customerReminders', 'contactLog', 'outbox'])
      if (Array.isArray(DB[k])) DB[k] = [];
    DB.importInfo = { at: nowIso(), live: true, counts: { customers: kept.length, orders: orders.length, bookings: appointments.length } };
    Store.save(); Domain.refreshAll(); App.route();
    UI.toast('Live sync complete — ' + kept.length + ' customers, ' + orders.length + ' orders, ' + appointments.length + ' bookings' +
      (skipped > 0 ? ' (' + skipped + ' contacts with no orders — newsletter/spam signups — left out).' : '.'));
    // Shared school corrections (aliases + dismissed suggestions) — union
    // the central copy with anything decided locally.
    if (p.schoolsJson) {
      try {
        const sj = JSON.parse(p.schoolsJson);
        DB.schoolAliases = Object.assign({}, sj.aliases || {}, DB.schoolAliases || {});
        DB.schoolNotSame = [...new Set([...(sj.notSame || []), ...(DB.schoolNotSame || [])])];
        Store.save();
        // Self-heal: if this browser holds school decisions the central copy
        // is missing (a background save that never landed), upload the merged
        // result now so nothing typed in here can be lost.
        const sfp = o => JSON.stringify([Object.entries(o.a || {}).sort(), [...(o.n || [])].sort()]);
        if (sfp({ a: sj.aliases, n: sj.notSame }) !== sfp({ a: DB.schoolAliases, n: DB.schoolNotSame })) Schools._save();
      } catch (e) { /* non-fatal */ }
    } else if (Object.keys(DB.schoolAliases || {}).length || (DB.schoolNotSame || []).length) {
      // Central store is empty but this browser has decisions — the first
      // upload must have failed. Put them back.
      Schools._save();
    }
    // Shared invoices: merge (newest edit wins per invoice), then re-link to
    // the freshly built customers by email/phone — customer ids change on
    // every sync, but the contact details saved on the invoice do not.
    if (p.invoicesJson) {
      try {
        const ij = JSON.parse(p.invoicesJson);
        const byId = new Map((DB.invoices || []).map(i => [i.id, i]));
        for (const inv of (ij.invoices || [])) {
          const cur = byId.get(inv.id);
          if (!cur || String(inv.updatedAt || '') > String(cur.updatedAt || '')) byId.set(inv.id, inv);
        }
        DB.invoices = [...byId.values()];
        if (ij.settings) {
          const mine = DB.invoiceSettings;
          const winner = (!mine || String(ij.settings.updatedAt || '') > String(mine.updatedAt || '')) ? ij.settings : mine;
          const loser = winner === ij.settings ? mine : ij.settings;
          // Venue→code memory is additive: keep codes learned in ANY browser,
          // whichever settings copy is newer overall.
          winner.eventCodes = Object.assign({}, (loser && loser.eventCodes) || {}, winner.eventCodes || {});
          DB.invoiceSettings = winner;
        }
        // Self-heal: if this browser holds invoice edits the central copy is
        // missing (a background save that never landed), upload the merged
        // result now so nothing typed in here can be lost.
        if (LiveSync._invFp(ij) !== LiveSync._invFp({ invoices: DB.invoices, settings: DB.invoiceSettings })) Invoices._push();
      } catch (e) { /* non-fatal */ }
    } else if ((DB.invoices || []).length) {
      // Central store is empty but this browser has invoices — the first
      // upload must have failed. Put them back.
      Invoices._push();
    }
    // Shared per-customer email notes (keyed by email) — newest edit wins,
    // and local-only notes self-heal back to the central store.
    if (p.notesJson) {
      try {
        const nj = JSON.parse(p.notesJson);
        const server = (nj && nj.notes) || {};
        const merged = Object.assign({}, server);
        for (const k of Object.keys(DB.custNotes || {})) {
          const mine = DB.custNotes[k];
          if (!merged[k] || String(mine.updatedAt || '') > String(merged[k].updatedAt || '')) merged[k] = mine;
        }
        DB.custNotes = merged;
        if (CustNotes._fp(server) !== CustNotes._fp(merged)) CustNotes._push();
      } catch (e) { /* non-fatal */ }
    } else if (Object.keys(DB.custNotes || {}).length) {
      CustNotes._push();
    }
    for (const inv of (DB.invoices || [])) {
      const em = String((inv.contact && inv.contact.email) || '').toLowerCase();
      const ph = ImportService._digits((inv.contact && inv.contact.phone) || '');
      const nc = (em && byEmail.get(em)) || (ph && byPhone.get(ph)) || null;
      if (nc) inv.customerId = nc.id;
    }
    Store.save();
    // Replay the centrally stored Appointly export (put there by whoever
    // imported it last) so this browser has the bookings and answers too.
    if (p.bookingsCsv) {
      try {
        const parsed = parseCsv(p.bookingsCsv);
        if (parsed.records.length) {
          ImportService.state.appointly = { name: 'shared bookings', raw: '', headers: parsed.headers, records: parsed.records };
          ImportService.mergeAppointly(true);
        }
      } catch (e) { /* non-fatal — manual import still available */ }
    }
  },
};

          : `<label class="btn small primary" style="cursor:pointer; display:inline-block">Choose CSV<input type="file" accept=".csv,text/csv" style="display:none" onchange="ImportService.fileChosen('${kind}', this)"></label>`}

  const any = st.customers || st.orders || st.appointly;

    <h2>Route 1 — CSV import (works now)</h2>
    <p class="small muted" style="max-width:780px">Export from each app, then add the files below. Any one file works on its own; together they build the full picture. Everything stays in this browser — nothing is uploaded anywhere.</p>
    ${slot('customers', '1 · Shopify customers', 'Shopify admin → Customers → Export → “Plain CSV file”. Names, emails, phones and addresses.')}
    ${slot('orders', '2 · Shopify orders', 'Shopify admin → Orders → Export → “Plain CSV file”. What each customer ordered — and if Appointly saved the booking onto the order, the booking questions come in too.')}
    ${slot('appointly', '3 · Appointly bookings', 'Appointly app → Appointments → Export. Any CSV with a customer email and date works; question columns become the booking answers.')}
    <div class="toolbar">
      <button class="primary" ${any ? '' : 'disabled'} onclick="ImportService.preview()">Preview import…</button>
      <button onclick="App.resetDemo()">↺ Back to sample data</button>
    </div>
    <h2 style="margin-top:28px">Route 2 — live dashboard (free, via Google Apps Script)</h2>
    ${LiveSync.available() ? `
    <div class="card" style="max-width:780px">
      <p class="small" style="margin-top:0">✅ This copy is running as your Google Apps Script web app — it can pull straight from Shopify, and the booking answers come with the orders.</p>
      <button class="primary" onclick="LiveSync.sync()">⟳ Sync from Shopify now</button>
      <button onclick="LiveSync.report()" style="margin-left:8px">🔍 Booking data report</button>
      ${DB.importInfo && DB.importInfo.live ? `<span class="small muted" style="margin-left:10px">Last sync ${fmtDateTime(DB.importInfo.at)}</span>` : ''}
      <p class="small muted" style="margin-bottom:0; margin-top:10px">It also syncs by itself every time the page opens. If a sync fails, check the Script properties in the Apps Script project settings: SHOPIFY_STORE plus either SHOPIFY_CLIENT_ID + SHOPIFY_CLIENT_SECRET or SHOPIFY_TOKEN.</p>
    </div>`
    : `
    <div class="card" style="max-width:780px">
      <p class="small" style="margin-top:0">A file opened straight from the computer can't call Shopify — browsers block it, and the API key would be visible to anyone with the file. The free fix: run this same file as a <b>Google Apps Script web app</b>. Google's servers make the Shopify calls, the token stays private, and only your Google account can open the page. The dashboard then syncs itself every time you open it. One-time setup, about 10 minutes:</p>
      <ol class="small" style="line-height:1.8; padding-left:20px; margin:10px 0">
        <li><b>Get a Shopify token:</b> Shopify admin → Settings → Apps and sales channels → Develop apps → Create app (call it “Darcybow dashboard”) → Configure Admin API scopes → tick <b>read_customers</b> and <b>read_orders</b> → Install app → reveal and copy the Admin API access token (starts <b>shpat_</b>).</li>
        <li>Go to <b>script.new</b> in the browser (signed in to your Google account).</li>
        <li>Replace the contents of <b>Code.gs</b> with the <b>darcybow-Code.gs</b> file that comes with this dashboard.</li>
        <li>Click <b>+</b> next to Files → HTML → name it <b>index</b> → paste this entire dashboard file into it (replacing what's there).</li>
        <li>⚙ Project Settings → Script properties → add <b>SHOPIFY_STORE</b> (e.g. darcybow.myshopify.com) plus the app's credentials: <b>SHOPIFY_CLIENT_ID</b> and <b>SHOPIFY_CLIENT_SECRET</b> (Dev Dashboard → your app → Settings → Credentials), or <b>SHOPIFY_TOKEN</b> if you have a legacy shpat_… token.</li>
        <li><b>Deploy → New deployment → Web app</b> → Execute as <b>Me</b> · Who has access <b>Only myself</b> → Deploy. Open the web-app link and bookmark it — that link IS the live dashboard.</li>
      </ol>
      <p class="small muted" style="margin-bottom:0">Appointly's booking answers ride along on the Shopify orders, so the one connection covers both apps. Until it's set up, CSV import above does the same job manually.</p>
    </div>`}`;
};

const INV_DEFAULT_PAYTO = { accountName: 'Darcybow', accountDetails: 'AIB, Main Street, Gorey, Co Wexford',
  accountNo: '31044055', sortCode: '93 36 43', swift: 'AIBKIE2D', iban: 'IE35AIBK93364331044055' };
const INV_DEFAULT_TERMS = [
  '1. Personal Details & Order Accuracy',
  'Double-check your personal details, especially your home address for delivery.',
  'Ensure you are ordering the correct dress, size, and colour.',
  'No refunds unless the dress is faulty.',
  '2. Payment & Transactions',
  'Full payment is required before your dress is ordered.',
  'One-to-one appointments accept debit/credit cards (via SumUp) and cash.',
  'Once a deposit is made, the dress is scheduled with the production team.',
  'Deposits are non-refundable because your dress is reserved specifically for you.',
  '3. Production & Returns',
  'Production begins after payment: materials are selected and cut to your size.',
  'No returns are accepted for pre-ordered dresses, except for faulty goods.',
  'Dresses are shipped with An Post tracked service on a gold hanger in a garment bag.',
  'Check your dress on arrival and try it on well in advance of your event.',
  '4. Delivery',
  'Dresses are dispatched as soon as they are ready, depending on style.',
  'You will receive your dress well before your special day.',
  '5. Alterations',
  'Alterations are not included in the dress price.',
  'The company does not perform alterations.',
  'Use a reputable alteration service and agree on the price before starting any work.',

const eurPlain = c => '€' + ((c / 100) % 1 ? (c / 100).toFixed(2) : String(Math.round(c / 100)));

let InvDraft = null;

const Invoices = {
  settings() {
    if (!DB.invoiceSettings) DB.invoiceSettings = { paymentTo: Object.assign({}, INV_DEFAULT_PAYTO),
      terms: INV_DEFAULT_TERMS, eventCodes: {}, passHash: '', updatedAt: nowIso() };
    if (!DB.invoiceSettings.eventCodes) DB.invoiceSettings.eventCodes = {};
    if (!DB.invoiceSettings.emailTemplate) DB.invoiceSettings.emailTemplate = {
      subject: 'Your Darcybow invoice — {{invoice_number}}',
      body: 'Hi {{first_name}},\n\nThank you so much for your order with Darcybow! Your invoice ({{invoice_number}}) is attached.\n\nInvoice total: {{total}}\nRemainder to pay: {{remainder}}\n\nPayment details are on the invoice. If you have any questions, just reply to this email.\n\nDarcybow x',
      replyTo: '',
    };
    if (DB.invoiceSettings.emailTemplate.fromAddress == null) DB.invoiceSettings.emailTemplate.fromAddress = 'edelle@darcybow.ie';
    if (DB.invoiceSettings.emailTemplate.copyTo == null) DB.invoiceSettings.emailTemplate.copyTo = 'edelle@darcybow.ie';
    return DB.invoiceSettings;
  },
  emailVars(inv) {
    const t = Invoices.totals(inv);
    return {
      name: inv.contact.name, first_name: (inv.contact.name || '').split(' ')[0],
      invoice_number: inv.code + ' - ' + inv.contact.name + ' - ' + inv.seq,
      total: eurPlain(t.linesTotal), paid: eurPlain(t.paidCents),
      remainder: (inv.paidInFull || t.remainderCents <= 0) ? 'nothing — paid in full!' : eurPlain(Math.max(t.remainderCents, 0)),
      issue_date: inv.issueDate,
    };
  },
  fill: (tpl, vars) => String(tpl || '').replace(/\{\{(\w+)\}\}/g, (_, k) => vars[k] != null ? vars[k] : ''),
  sendModal() {
    const inv = Invoices.save(true);
    if (!inv) return;
    if (!inv.contact.email) { UI.err(new Error('No email on the invoice — add one in “Bill to” first.')); return; }
    const st = Invoices.settings();
    const vars = Invoices.emailVars(inv);
    UI.modal(`
      <h3>✉ Send invoice ${esc(vars.invoice_number)}</h3>
      <div id="em-health" class="note info">Checking the email connection…</div>
      <label class="f">To</label><input id="em-to" style="width:100%" value="${esc(inv.contact.email)}">
      <label class="f">Subject</label><input id="em-subject" style="width:100%" value="${esc(Invoices.fill(st.emailTemplate.subject, vars))}">
      <label class="f">Message</label><textarea id="em-body" rows="9" style="width:100%">${esc(Invoices.fill(st.emailTemplate.body, vars))}</textarea>
      ${inv.sentAt ? `<p class="small muted">Last sent ${fmtDateTime(inv.sentAt)}.</p>` : ''}
      <div class="modalfoot">
        <button onclick="UI.closeModal()">Cancel</button>
        <button onclick="Invoices.sendEmail(true)">📧 Send test to me</button>
        <button class="primary" onclick="Invoices.sendEmail(false)">✉ Send to customer</button>
      </div>`, true);
    Invoices._checkHealth();
  },
  // Fills the strip at the top of the send window: green when THIS copy of
  // the dashboard is allowed to send email, red (with the reason) when the
  // open link is an old deployment without the Gmail permission.
  _checkHealth() {
    const el = document.getElementById('em-health');
    if (!el) return;
    if (typeof LiveSync === 'undefined' || !LiveSync.available()) {
      el.className = 'note';
      el.textContent = 'Sending only works from the live dashboard link (the Google web app).';
      return;
    }
    google.script.run
      .withSuccessHandler(res => {
        const box = document.getElementById('em-health');
        if (!box) return;
        try {
          const h = JSON.parse(res);
          box.className = 'note ' + (h.canSend ? 'ok' : 'err');
          box.innerHTML = (h.canSend
            ? '✅ Email is connected — this will send from <b>' + esc(h.account || 'the dashboard account') + '</b>. The two-page invoice PDF is attached automatically.'
            : '⚠ <b>This copy of the dashboard is not allowed to send email.</b> Screenshot this box — the line below says exactly why.')
            + (h.detail ? '<br><span class="small mono">' + esc(h.detail) + '</span>' : '');
        } catch (e) { /* leave the strip as-is */ }
      })
      .withFailureHandler(() => {
        const box = document.getElementById('em-health');
        if (box) { box.className = 'note err'; box.textContent = '⚠ Could not reach the email engine — reload the page and try again.'; }
      })
      .emailHealth();
  },
  sendEmail(isTest) {
    const inv = Invoices.invFor(InvDraft ? InvDraft.customerId : '') || InvDraft;
    if (!inv) return;
    if (typeof LiveSync === 'undefined' || !LiveSync.available()) {
      UI.err(new Error('Email sending only works from the live dashboard link (the Google web app).')); return;
    }
    const to = document.getElementById('em-to').value.trim();
    const subject = document.getElementById('em-subject').value;
    const bodyText = document.getElementById('em-body').value;
    if (!isTest && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) { UI.err(new Error('That customer email doesn\'t look right.')); return; }
    const vars = Invoices.emailVars(inv);
    const payload = {
      to, isTest: !!isTest, subject: isTest ? '[TEST] ' + subject : subject,
      textBody: bodyText,
      htmlBody: bodyText.split('\n').map(l => esc(l) || '&nbsp;').join('<br>'),
      pdfHtml: Invoices.docHtml(inv, true),
      filename: (inv.code + ' - ' + inv.contact.name + ' - ' + inv.seq).replace(/[\\/:*?"<>|]/g, '-'),
      replyTo: Invoices.settings().emailTemplate.replyTo || '',
      fromAddress: Invoices.settings().emailTemplate.fromAddress || '',
      bcc: Invoices.settings().emailTemplate.copyTo || '',
    };
    UI.toast(isTest ? 'Sending test…' : 'Sending invoice…');
    google.script.run
      .withSuccessHandler(res => {
        try {
          const r = JSON.parse(res);
          if (r.error) { UI.err(new Error(r.error)); return; }
          if (r.warning) UI.toast('⚠ ' + r.warning, 9000);
          if (isTest) { UI.toast('Test sent to your own inbox (' + (r.sentTo || 'you') + ') — check it before sending to the customer.'); return; }
          inv.sentAt = nowIso(); inv.updatedAt = nowIso();
          Store.save(); Invoices._push(); UI.closeModal(); App.route();
          UI.toast('Invoice emailed to ' + to + ' ✓');
        } catch (e) { UI.err(e); }
      })
      .withFailureHandler(e => UI.err(e))
      .sendInvoiceEmail(JSON.stringify(payload));
  },
  _hash(s) { let h = 5381; for (const ch of String(s)) h = ((h * 33) ^ ch.charCodeAt(0)) >>> 0; return String(h); },
  unlocked() { const st = Invoices.settings(); return !!st.passHash && localStorage.getItem('darcybow-inv-unlock') === st.passHash; },
  unlock() {
    const st = Invoices.settings();
    if (!st.passHash) {
      const p1 = prompt('Set an invoicing passcode — only people who know it can open or edit invoices:');
      if (!p1 || !p1.trim()) return false;
      st.passHash = Invoices._hash(p1.trim()); st.updatedAt = nowIso();
      localStorage.setItem('darcybow-inv-unlock', st.passHash);
      Invoices._push(); Store.save();
      UI.toast('Invoicing passcode set — keep it safe.');
      return true;
    }
    const p = prompt('Enter the invoicing passcode:');
    if (p !== null && Invoices._hash(p.trim()) === st.passHash) { localStorage.setItem('darcybow-inv-unlock', st.passHash); return true; }
    if (p !== null) UI.err(new Error('Wrong passcode.'));
    return false;
  },
  open(customerId) {
    if (!Invoices.unlocked() && !Invoices.unlock()) return;
    App.go('#/invoice/' + customerId);
  },
  invFor: custId => (DB.invoices || []).find(i => i.customerId === custId) || null,
  status(custId) {
    const inv = Invoices.invFor(custId);
    if (!inv) return null;
    return (inv.paidInFull || Invoices.totals(inv).remainderCents <= 0) ? 'paid' : 'invoiced';
  },
  statusBadge(custId) {
    const s = Invoices.status(custId);
    const inv = Invoices.invFor(custId);
    const sent = inv && inv.sentAt ? ' · sent ✉' : '';
    return s === 'paid' ? '<span class="badge b-green">Invoice · paid in full</span>'
      : s === 'invoiced' ? '<span class="badge b-blue">Invoiced' + sent + '</span>'
      : '<span class="badge b-grey">Not invoiced</span>';
  },
  // Event code from the hotel the customer is linked to: remembered override,
  // else first four letters of the venue name ("The Cashel Palace" → CASH).
  codeFor(custId) {
    const orders = Domain.ordersOf(custId).filter(o => o.eventHotel).sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);
    const eh = orders[0] ? orders[0].eventHotel : '';
    const parts = String(eh).split(/\s+—\s+/);
    const venue = (parts[1] || parts[0] || '').trim();
    if (!venue) return { code: 'DBW', venueKey: '' };
    const key = venue.toLowerCase();
    const st = Invoices.settings();
    if (st.eventCodes[key]) return { code: st.eventCodes[key], venueKey: key };
    const word = venue.replace(/^the\s+/i, '').replace(/[^a-z ]/ig, '').trim().split(/\s+/)[0] || 'DBW';
    return { code: word.slice(0, 4).toUpperCase(), venueKey: key };
  },
  nextSeq(code) {
    let max = 0;
    for (const i of DB.invoices || []) if (i.code === code && i.seq > max) max = i.seq;
    return max + 1;
  },
  totals(inv) {
    const linesTotal = (inv.lines || []).reduce((s, l) => s + (l.priceCents || 0) * (l.qty || 0), 0);
    const st = inv.sterling || {};
    // Matches the paper invoices: "Paid sterling @ £1.15 · €345 = £300",
    // i.e. euros credited = pounds × rate.
    const sterlingEur = (st.gbpCents > 0 && st.rate > 0) ? Math.round(st.gbpCents * st.rate) : 0;
    const paidCents = (inv.depositCents || 0) + (inv.otherPaidCents || 0) + sterlingEur;
    return { linesTotal, sterlingEur, paidCents, remainderCents: linesTotal - paidCents };
  },
  dressTitles() {
    return [...new Set(DB.orderItems.filter(i => i.category === 'dress' && i.title).map(i => i.title))].sort();
  },
  // Product catalogue for the invoice dropdowns: the live website list
  // (synced from darcybow.ie on every sync) when connected, else the
  // sample catalogue in demo mode.
  catalogue() {
    if (Array.isArray(DB.catalogue) && DB.catalogue.length) return DB.catalogue;
    if (DB.importInfo) return []; // real data, catalogue not synced yet — never show demo products
    return (DB.products || []).filter(p => p.active !== false).map(p => ({
      title: p.title, colours: p.colours || [], sizes: p.sizes || [], priceCents: p.retailPriceCents || 0 }));
  },
  catFor(title) {
    const t = String(title || '').trim().toLowerCase();
    return t ? Invoices.catalogue().find(p => String(p.title).toLowerCase() === t) || null : null;
  },
  // Dress dropdown = every product on the website, plus anything seen on
  // past orders (bespoke lines typed in before stay available).
  productTitles() {
    return [...new Set([...Invoices.catalogue().map(p => p.title), ...Invoices.dressTitles()])].sort((a, b) => a.localeCompare(b));
  },
  // A dress was picked or edited on line i → refresh that line's colour and
  // size options from the catalogue and prefill the price if it's empty.
  lineChanged(i) {
    const tEl = document.getElementById('inv-l' + i + '-title');
    const p = tEl ? Invoices.catFor(tEl.value) : null;
    const fill = (id, vals) => { const dl = document.getElementById(id); if (dl) dl.innerHTML = (vals || []).map(v => `<option value="${esc(v)}">`).join(''); };
    fill('dl-colour-' + i, p ? p.colours : []);
    fill('dl-size-' + i, p ? p.sizes : []);
    const priceEl = document.getElementById('inv-l' + i + '-price');
    if (p && priceEl && !priceEl.value.trim() && p.priceCents) {
      priceEl.value = p.priceCents % 100 ? (p.priceCents / 100).toFixed(2) : String(p.priceCents / 100);
    }
    Invoices.recalc();
  },
  blank(custId) {
    const c = Domain.customer(custId);
    const { code } = Invoices.codeFor(custId);
    const dresses = Domain.ordersOf(custId).flatMap(o => Domain.itemsOf(o.id)).filter(i => i.category === 'dress');
    return {
      id: uid(), customerId: custId,
      contact: { name: c.name || '', address: String(c.address || '').split(',').map(s => s.trim()).filter(Boolean).join('\n'),
        phone: c.phone || '', email: c.email || '' },
      code, seq: Invoices.nextSeq(code), issueDate: todayStr(),
      lines: dresses.length ? dresses.map(d => ({ title: d.title, colour: d.colour || '', size: d.size || '',
        qty: d.quantity || 1, priceCents: d.retailPriceCents || 0 }))
        : [{ title: '', colour: '', size: '', qty: 1, priceCents: 0 }],
      depositCents: 0, otherPaidCents: 0, sterling: { gbpCents: 0, rate: 0 },
      paidInFull: false, createdAt: nowIso(), updatedAt: nowIso(),
    };
  },
  readForm() {
    if (!InvDraft) return null;
    const v = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    InvDraft.contact = { name: v('inv-name').trim(), address: v('inv-addr'), phone: v('inv-phone').trim(), email: v('inv-email').trim() };
    InvDraft.code = v('inv-code').trim().toUpperCase() || 'DBW';
    InvDraft.seq = Math.max(1, parseInt(v('inv-seq'), 10) || 1);
    InvDraft.issueDate = v('inv-date') || todayStr();
    InvDraft.lines = InvDraft.lines.map((l, i) => ({
      title: v('inv-l' + i + '-title').trim(), colour: v('inv-l' + i + '-colour').trim(), size: v('inv-l' + i + '-size').trim(),
      qty: Math.max(1, parseInt(v('inv-l' + i + '-qty'), 10) || 1),
      priceCents: parseEuros(v('inv-l' + i + '-price')) || 0,
    }));
    InvDraft.depositCents = parseEuros(v('inv-dep')) || 0;
    InvDraft.otherPaidCents = parseEuros(v('inv-other')) || 0;
    InvDraft.sterling = { gbpCents: parseEuros(v('inv-gbp')) || 0, rate: parseFloat(v('inv-rate')) || 0 };
    return InvDraft;
  },
  recalc() {
    const inv = Invoices.readForm();
    if (!inv) return;
    const t = Invoices.totals(inv);
    inv.lines.forEach((l, i) => { const el = document.getElementById('inv-l' + i + '-total'); if (el) el.textContent = eurPlain(l.priceCents * l.qty); });
    const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
    set('inv-total', eurPlain(t.linesTotal));
    set('inv-ster-eur', t.sterlingEur ? '= ' + eurPlain(t.sterlingEur) : '');
    set('inv-paid', eurPlain(t.paidCents));
    set('inv-remain', eurPlain(Math.max(t.remainderCents, 0)));
    set('inv-num-preview', inv.code + ' - ' + (inv.contact.name || '…') + ' - ' + inv.seq);
  },
  addLine() { Invoices.readForm(); InvDraft.lines.push({ title: '', colour: '', size: '', qty: 1, priceCents: 0 }); App.route(); },
  removeLine(i) { Invoices.readForm(); InvDraft.lines.splice(i, 1); if (!InvDraft.lines.length) InvDraft.lines.push({ title: '', colour: '', size: '', qty: 1, priceCents: 0 }); App.route(); },
  save(silent) {
    const inv = Invoices.readForm();
    if (!inv) return null;
    inv.updatedAt = nowIso();
    const st = Invoices.settings();
    if (inv._venueKey && inv.code) { st.eventCodes[inv._venueKey] = inv.code; st.updatedAt = nowIso(); }
    if (!DB.invoices) DB.invoices = [];
    const idx = DB.invoices.findIndex(x => x.id === inv.id);
    if (idx >= 0) DB.invoices[idx] = inv; else DB.invoices.push(inv);

  markPaid(custId, flag) {

        <td class="c">${l && l.qty > 1 ? l.qty : (l ? l.qty : '')}</td>

    }

    if (gbp) {

      .payto table td { padding: 0 2mm 0 0; vertical-align: top; }
      .payto td.k { font-variant: small-caps; color: #536161; white-space: nowrap; }
      .paysum { text-align: right; font-size: 10pt; line-height: 2; letter-spacing: .08em; color: #3d4547; border-left: 1px solid #c9cecd; padding-left: 6mm; }

      @media screen { .pg { margin: 10px auto; box-shadow: 0 2px 14px rgba(0,0,0,.25); } body { background: #666; } }
      ${pdfMode ? `

/* =============================== EMAILS PER CUSTOMER =============================== */
/* Live view of the correspondence with one customer: recent threads from
   the mailbox that does the sending (invoices out; incoming mail too once
   Outlook forwards a copy), plus a shared "email notes" box keyed by the
   customer's email address so it survives re-syncs and reaches every browser. */
const CustNotes = {
  key: c => String((c && c.email) || '').trim().toLowerCase(),
  get(c) { const k = CustNotes.key(c); return (k && DB.custNotes && DB.custNotes[k] && DB.custNotes[k].text) || ''; },
  set(custId, text) {
    if (!Invoices.unlocked()) { UI.err(new Error('Email notes need the invoicing passcode.')); return; }
    const c = Domain.customer(custId);
    const k = CustNotes.key(c);
    if (!k) { UI.err(new Error('This customer has no email address to attach the note to.')); return; }
    DB.custNotes = DB.custNotes || {};
    DB.custNotes[k] = { text: String(text), updatedAt: nowIso() };
    Store.save(); CustNotes._push();
    UI.toast('Email note saved — shared with every browser.');
  },
  _push() {
    if (typeof LiveSync !== 'undefined' && LiveSync.available()) {
      try { google.script.run.saveNotes(JSON.stringify({ notes: DB.custNotes || {} })); } catch (e) { /* non-fatal */ }
    }
  },
  _fp: o => JSON.stringify(Object.entries(o || {}).map(([k, v]) => [k, v && v.text, v && v.updatedAt]).sort()),
};

const Emails = {
  gmailUrl: em => 'https://mail.google.com/mail/u/0/#search/' + encodeURIComponent(em),
  open(custId) {
    const c = Domain.customer(custId);
    if (!c || !c.email) { UI.err(new Error('No email address on this customer.')); return; }
    window.open(Emails.gmailUrl(c.email), '_blank');
  },
  load(custId) {
    const c = Domain.customer(custId);
    const box = document.getElementById('emaillist');
    if (!box || !c || !c.email) return;
    if (typeof LiveSync === 'undefined' || !LiveSync.available()) {
      box.innerHTML = '<span class="small muted">Live email history appears here when the dashboard is opened from its web-app link.</span>';
      return;
    }
    box.innerHTML = '<span class="small muted">Checking the mailbox…</span>';
    google.script.run
      .withSuccessHandler(res => {
        const el = document.getElementById('emaillist');
        if (!el) return; // navigated away meanwhile
        try {
          const r = JSON.parse(res);
          if (r.error) { el.innerHTML = '<span class="small muted">Couldn’t read emails: ' + esc(r.error) + '</span>'; return; }
          if (!r.threads || !r.threads.length) {
            el.innerHTML = '<span class="small muted">No emails with this customer in the dashboard mailbox yet.</span>'; return;
          }
          el.innerHTML = r.threads.map(t => `

/* =============================== PRODUCTION =============================== */
/* Once an invoice exists and money has been taken, the order goes to the
   manufacturer. Grouped BY DRESS so size runs are obvious, with per-size
   tallies, the customer's details, their accessories, and an editable note
   per order. Exports the whole board as a real Excel file via the backend. */
const Production = {
  isDress(title) {
    const t = String(title || '');
    return Invoices.dressTitles().includes(t) || /dress|gown/i.test(t);
  },
  entries() {
    const out = [];
    for (const inv of (DB.invoices || [])) {
      const t = Invoices.totals(inv);
      if (!(inv.paidInFull || t.paidCents > 0)) continue; // deposit taken = in production
      const c = Domain.customer(inv.customerId);
      const dressLines = [], accessories = [];
      for (const l of (inv.lines || [])) {
        if (!l.title) continue;
        (Production.isDress(l.title) ? dressLines : accessories).push(l);
      }
      if (!dressLines.length) continue;
      const orders = Domain.ordersOf(inv.customerId);
      const latest = orders.slice().sort((a, b) => a.createdAt < b.createdAt ? 1 : -1)[0];
      out.push({ inv, name: (c && c.name) || inv.contact.name, daughter: (c && c.daughterName) || '',
        phone: inv.contact.phone || (c && c.phone) || '', email: inv.contact.email || (c && c.email) || '',
        dressLines, accessories, event: latest ? latest.eventHotel : '' });
    }
    return out;
  },
  groups(query) {
    const q = String(query || '').trim().toLowerCase();
    const map = new Map();
    for (const e of Production.entries()) {
      for (const l of e.dressLines) {
        const hay = (l.title + ' ' + l.colour + ' ' + l.size + ' ' + e.name + ' ' + e.daughter + ' ' + e.event).toLowerCase();
        if (q && !hay.includes(q)) continue;
        if (!map.has(l.title)) map.set(l.title, []);
        map.get(l.title).push({ e, l });
      }
    }
    const sizeKey = s => { const n = parseFloat(String(s).replace(/[^\d.]/g, '')); return isNaN(n) ? 999 : n; };
    return [...map.entries()].map(([dress, rows]) => {
      rows.sort((a, b) => sizeKey(a.l.size) - sizeKey(b.l.size) || a.e.name.localeCompare(b.e.name));
      const tally = new Map();
      for (const r of rows) { const k = r.l.size || '—'; tally.set(k, (tally.get(k) || 0) + (r.l.qty || 1)); }
      return { dress, rows, tally: [...tally.entries()] };
    }).sort((a, b) => b.rows.length - a.rows.length || a.dress.localeCompare(b.dress));
  },
  setNote(invId, value) {
    if (!Invoices.unlocked()) { UI.err(new Error('Notes need the invoicing passcode.')); return; }
    const inv = (DB.invoices || []).find(i => i.id === invId);
    if (!inv) return;
    inv.productionNotes = value; inv.updatedAt = nowIso();
    Store.save(); Invoices._push();
  },
  accessoriesText: e => e.accessories.map(a => a.title + (a.qty > 1 ? ' ×' + a.qty : '')).join(', '),
  exportXlsx() {
    if (typeof LiveSync === 'undefined' || !LiveSync.available()) {
      UI.err(new Error('The Excel export needs the live dashboard link (the Google web app).')); return;
    }
    const groups = Production.groups('').map(g => ({
      dress: g.dress,
      tally: g.tally.map(([size, n]) => size + ' × ' + n).join(', '),
      rows: g.rows.map(r => ({ size: r.l.size || '', colour: r.l.colour || '', qty: r.l.qty || 1,
        customer: r.e.name, daughter: r.e.daughter, phone: r.e.phone, email: r.e.email,
        accessories: Production.accessoriesText(r.e), notes: r.e.inv.productionNotes || '', event: r.e.event })),
    }));
    if (!groups.length) { UI.err(new Error('Nothing in production yet.')); return; }
    UI.toast('Building the Excel file…');
    google.script.run
      .withSuccessHandler(res => {
        try {
          const r = JSON.parse(res);
          if (r.error) { UI.err(new Error(r.error)); return; }
          const a = document.createElement('a');
          a.href = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,' + r.b64;
          a.download = r.name;
          document.body.appendChild(a); a.click(); a.remove();
          UI.toast('Excel file downloaded.');
        } catch (e) { UI.err(e); }
      })
      .withFailureHandler(e => UI.err(e))
      .exportProductionXlsx(JSON.stringify({ groups, date: todayStr() }));
  },
};

  },
  /* One customer → one generic sheet row (used by the all-customers and
     single-customer prints, where there's no specific event day). */
  _customerRow(c) {
    const orders = Domain.ordersOf(c.id).filter(o => o.status !== 'cancelled').sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);
    const o = orders[0] || null;
    const appts = AppointlyService.bookingsFor(c.id);
    const upcoming = appts.filter(a => a.appointmentAt >= todayStr())
      .sort((a, b) => (a.appointmentAt + (a.time || '')) < (b.appointmentAt + (b.time || '')) ? -1 : 1)[0];

      c, qa,
      items: o ? Domain.itemsOf(o.id) : [],
