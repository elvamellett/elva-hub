<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darcybow — Customers & Events</title>
<style>
  :root {
    --brand: #9b2c4d;
    --brand-dark: #7c1f3c;
    --brand-soft: #fdf0f4;
    --ink: #23262e;
    --muted: #6b7280;
    --bg: #f4f5f7;
    --card: #ffffff;
    --line: #e5e7eb;
    --green: #157347; --green-bg: #e6f4ec;
    --amber: #b45309; --amber-bg: #fef3c7;
    --red: #b91c1c;   --red-bg: #fde8e8;
    --blue: #1d4ed8;  --blue-bg: #e7edfd;
    --grey-bg: #eef0f3;
    --sidebar: #221722;
    --radius: 10px;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex; min-height: 100vh;
  }
  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 218px; background: var(--sidebar); color: #e8dfe4; flex-shrink: 0;
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  #sidebar .logo { padding: 22px 20px 14px; }
  #sidebar .logo b { font-size: 1.35rem; letter-spacing: .04em; color: #fff; font-weight: 600; }
  #sidebar .logo span { display:block; font-size: .72rem; color: #b99aa8; letter-spacing: .12em; text-transform: uppercase; margin-top: 3px; }
  #sidebar nav { flex: 1; padding: 8px 10px; }
  #sidebar nav a {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin: 2px 0;
    color: #cdbcc5; text-decoration: none; border-radius: 8px; font-size: .95rem;
  }
  #sidebar nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
  #sidebar nav a.active { background: var(--brand); color: #fff; }
  #sidebar nav a .cnt {
    margin-left: auto; background: rgba(255,255,255,.15); border-radius: 99px;
    font-size: .72rem; padding: 1px 8px; min-width: 22px; text-align: center;
  }
  #sidebar nav a.active .cnt { background: rgba(255,255,255,.25); }
  #sidebar .staffbox { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.1); font-size: .8rem; }
  #sidebar .staffbox label { color: #b99aa8; display: block; margin-bottom: 5px; }
  #sidebar .staffbox select {
    width: 100%; background: #3a2733; border: 1px solid #55404c; color: #fff;
    border-radius: 6px; padding: 6px 8px; font-size: .85rem;
  }
  #sidebar .demo { padding: 10px 16px 16px; }
  #sidebar .demo button {
    width: 100%; background: none; border: 1px solid #55404c; color: #b99aa8;
    border-radius: 6px; padding: 6px; font-size: .75rem; cursor: pointer;
  }
  #sidebar .demo button:hover { color: #fff; border-color: #7a5f6f; }

  /* ---------- Main ---------- */
  #main { flex: 1; min-width: 0; padding: 22px 28px 60px; }
  h1 { font-size: 1.45rem; margin: 6px 0 4px; font-weight: 650; }
  h2 { font-size: 1.05rem; margin: 22px 0 10px; font-weight: 650; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 18px; }

  /* ---------- Notification banner ---------- */
  #banner {
    background: linear-gradient(90deg, var(--brand), var(--brand-dark)); color: #fff;
    border-radius: var(--radius); padding: 13px 18px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(155,44,77,.25); cursor: pointer;
  }
  #banner.quiet { background: #fff; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  #banner .bell { font-size: 1.3rem; }
  #banner b { font-weight: 650; }
  #banner .pill { background: rgba(255,255,255,.18); border-radius: 99px; padding: 2px 11px; font-size: .82rem; }
  #banner.quiet .pill { background: var(--grey-bg); }

  /* ---------- Cards, stats ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; }
  .statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat .v { font-size: 1.35rem; font-weight: 700; margin-top: 2px; }
  .stat .l { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; }
  .stat.warn .v { color: var(--amber); }
  .stat.bad .v { color: var(--red); }
  .stat.good .v { color: var(--green); }

  /* ---------- Tables ---------- */
  .tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #fafafb; color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  tbody tr.click:hover { background: var(--brand-soft); cursor: pointer; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .grouphead td {
    background: var(--grey-bg); font-weight: 650; font-size: .8rem; text-transform: uppercase;
    letter-spacing: .04em; color: #444; padding: 7px 12px;
  }

  /* ---------- Badges ---------- */
  .badge { display: inline-block; border-radius: 99px; padding: 2px 10px; font-size: .74rem; font-weight: 600; white-space: nowrap; }
  .b-green { background: var(--green-bg); color: var(--green); }
  .b-amber { background: var(--amber-bg); color: var(--amber); }
  .b-red { background: var(--red-bg); color: var(--red); }
  .b-blue { background: var(--blue-bg); color: var(--blue); }
  .b-grey { background: var(--grey-bg); color: #4b5563; }
  .b-brand { background: var(--brand-soft); color: var(--brand); }
  .b-purple { background: #f0e7fd; color: #6d28d9; }
  .b-teal { background: #d8f1ee; color: #0f766e; }
  .b-gold { background: #fdf0d5; color: #92600a; }

  /* ---------- Buttons, inputs ---------- */
  button, .btn {
    font: inherit; border-radius: 8px; border: 1px solid var(--line); background: #fff;
    padding: 7px 14px; cursor: pointer; font-size: .88rem; color: var(--ink);
  }
  button:hover, .btn:hover { border-color: #c9ccd2; background: #fafafa; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--brand-dark); }
  button.danger { color: var(--red); border-color: #f3c2c2; }
  button.danger:hover { background: var(--red-bg); }
  button.small, .btn.small { padding: 3px 10px; font-size: .78rem; border-radius: 6px; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, select, textarea {
    font: inherit; border: 1px solid #cfd3da; border-radius: 8px; padding: 7px 10px;
    background: #fff; color: var(--ink); font-size: .9rem;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
  label.f { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  .formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 18px; }
  .formgrid input, .formgrid select, .formgrid textarea { width: 100%; }
  .searchbar {
    width: 100%; max-width: 620px; font-size: 1.05rem; padding: 12px 16px;
    border-radius: 12px; border: 1.5px solid #cfd3da; margin-bottom: 16px;
  }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .toolbar .spacer { flex: 1; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 13px;
    font-size: .8rem; cursor: pointer; color: #444;
  }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

  /* ---------- Modal ---------- */
  #modalroot { position: fixed; inset: 0; display: none; z-index: 50; }
  #modalroot.open { display: block; }
  #modalroot .scrim { position: absolute; inset: 0; background: rgba(20,15,20,.55); }
  #modalroot .box {
    position: relative; background: #fff; border-radius: 14px; max-width: 860px; width: calc(100% - 40px);
    margin: 4vh auto; max-height: 92vh; overflow-y: auto; padding: 24px 26px;
    box-shadow: 0 18px 60px rgba(0,0,0,.3);
  }
  #modalroot .box.wide { max-width: 1040px; }
  #modalroot h3 { margin: 0 0 4px; font-size: 1.15rem; }
  .modalfoot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .x { position: absolute; top: 14px; right: 16px; border: none; background: none; font-size: 1.25rem; color: var(--muted); cursor: pointer; }

  .note { background: var(--amber-bg); border: 1px solid #f4d488; color: #7c5205; border-radius: 8px; padding: 9px 13px; font-size: .85rem; margin: 10px 0; }
  .note.info { background: var(--blue-bg); border-color: #c3d0f5; color: #1e3a8a; }
  .note.ok { background: var(--green-bg); border-color: #bfe3cf; color: var(--green); }
  .note.err { background: var(--red-bg); border-color: #f3c2c2; color: var(--red); }
  .muted { color: var(--muted); }
  .small { font-size: .8rem; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: .84em; }
  .right { text-align: right; }
  .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .cols2 { grid-template-columns: 1fr; } body { flex-direction: column; } #sidebar { width: 100%; height: auto; position: static; } }
  a.plain { color: var(--brand); text-decoration: none; font-weight: 600; }
  a.plain:hover { text-decoration: underline; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { border-left: 2px solid var(--line); padding: 4px 0 10px 14px; margin-left: 6px; position: relative; font-size: .86rem; }
  .timeline li::before { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--brand); position: absolute; left: -5px; top: 9px; }
  .invoice-frame { width: 100%; height: 66vh; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .seam {
    border: 1.5px dashed var(--brand); background: var(--brand-soft); border-radius: 8px;
    padding: 10px 14px; font-size: .82rem; color: var(--brand-dark); margin: 10px 0;
  }
  .cname { font-weight: 700; font-size: 1.02rem; }
  .bigselect { padding: 11px 12px; border-radius: 12px; border: 1.5px solid #cfd3da; font-size: .95rem; max-width: 300px; }
  table.roomy td { padding: 13px 12px; }
  .qa { margin: 0 0 14px; }
  .qa .q { font-size: .95rem; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
  .qa ul { margin: 2px 0 0; padding-left: 20px; }
  .qa li { font-size: .95rem; margin-bottom: 3px; }
  .dl-row { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .dl-row:last-child { border-bottom: none; }
  .dl-label { width: 92px; flex-shrink: 0; font-size: .74rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .dl-value { font-size: 1rem; font-weight: 700; color: var(--ink); flex: 1; }
  .dl-value .muted { font-weight: 400; }
  .dl-row.editable { cursor: pointer; border-radius: 8px; }
  .dl-row.editable:hover { background: var(--brand-soft); }
  .editpen { color: var(--brand); opacity: 0; font-size: .9rem; padding-left: 8px; }
  .dl-row.editable:hover .editpen { opacity: 1; }
  .venuegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  @media (max-width: 560px) { .venuegrid { grid-template-columns: 1fr; } }
  .vtile {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px 24px; cursor: pointer; transition: box-shadow .12s, transform .12s;
  }
  .vtile:hover { box-shadow: 0 6px 18px rgba(155,44,77,.14); transform: translateY(-1px); border-color: #e3c3ce; }
  .vtile-date { font-size: .8rem; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
  .vtile-name { font-size: 1.3rem; font-weight: 750; line-height: 1.25; margin-bottom: 8px; }
  .vtile-sub { font-size: .82rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .vrow { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .vrow:first-child { border-top: none; }
  .vrow:hover { background: var(--brand-soft); margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
  .vtime { width: 86px; flex-shrink: 0; text-align: center; line-height: 1.3; }
  .vclock { font-size: 1.15rem; font-weight: 750; color: var(--brand); font-variant-numeric: tabular-nums; }
  .blockhead { margin: 14px 0 8px; }
  .blockhead b { font-size: 1.02rem; }
  select.mini { padding: 4px 8px; font-size: .82rem; border-radius: 6px; }
  .toast {
    position: fixed; bottom: 22px; right: 22px; background: var(--ink); color: #fff;
    border-radius: 10px; padding: 12px 18px; font-size: .9rem; z-index: 99;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); max-width: 380px;
  }
</style>
</head>
<body>
  <aside id="sidebar">
    <div class="logo"><b>Darcybow</b><span>Customers &amp; Events</span></div>
    <nav id="nav"></nav>
    <div class="demo"><button onclick="App.resetDemo()">↺ Reset demo data</button></div>
  </aside>
  <main id="main"></main>
  <div id="modalroot"><div class="scrim" onclick="UI.closeModal()"></div><div class="box" id="modalbox"></div></div>

<script>
"use strict";
/* =====================================================================
   Darcybow Customers & Events — single-file VIEWING platform.

   Phase 1 is deliberately read-only: Shopify (customers, orders,
   products) and Appointly (bookings + the questions each customer
   answered) are pulled together into one place for staff to browse.
   The ONLY actions are printing — A4 customer sheets (details + the
   Appointly booking answers) and the staff run sheet for an event day.

   Runs fully offline on seeded mock data (persisted in localStorage).
   External integrations are isolated in ShopifyService /
   AppointlyService below, each with a clearly marked LIVE CREDENTIAL
   SEAM where the real API credentials plug in — once filled, the same
   screens fill with real data and nothing else changes.
   ===================================================================== */

/* ---------------------- small utilities ---------------------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
const nowIso = () => new Date().toISOString();
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function daysFromNow(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
function isoDaysAgo(n, h) { const d = new Date(); d.setDate(d.getDate() - n); if (h != null) d.setHours(h, 15, 0, 0); return d.toISOString(); }
function daysUntil(dateStr) {
  const a = new Date(todayStr() + 'T00:00:00'); const b = new Date(dateStr + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
// Calendar-month addition clamped to shorter months (31 Jan + 1m = 28/29 Feb).
function addCalendarMonths(dateStr, months) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const t = new Date(y, m - 1 + months, 1);
  const dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  t.setDate(Math.min(d, dim));
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
}
function fmtDate(ds) {
  if (!ds) return '—';
  return new Date(ds + 'T00:00:00').toLocaleDateString('en-IE', { day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtDateTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-IE', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

/* ------- money: integer euro cents everywhere ------- */
const eur = c => (c / 100).toLocaleString('en-IE', { style: 'currency', currency: 'EUR' });
function parseEuros(str) {
  const clean = String(str ?? '').replace(/[€,\s]/g, '');
  if (clean === '' || !/^-?\d+(\.\d{1,2})?$/.test(clean)) return null;
  return Math.round(parseFloat(clean) * 100);
}
// Split a total into n instalments; rounding difference goes to the FINAL one.
function splitCents(total, n) {
  const base = Math.floor(total / n);
  const out = Array(n).fill(base);
  out[n - 1] = total - base * (n - 1);
  return out;
}

/* ---------------------- data store ---------------------- */
const STORE_KEY = 'darcybow-db-v5';
let DB = null;

const Store = {
  load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) { DB = JSON.parse(raw); return; }
    } catch (e) { /* corrupt store: fall through to reseed */ }
    DB = Seed.build();
    Store.save();
  },
  save() { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); },
  reset() { localStorage.removeItem(STORE_KEY); DB = Seed.build(); Store.save(); },
};

const DEFAULT_SETTINGS = {
  // Internal reminder stages, in days before the due date (editable in Settings).
  reminderOffsets: { upcoming: 14, dueSoon: 7 },
  duplicateReminderWindowDays: 3,
  dailySummary: { enabled: false, recipients: ['owner@darcybow.ie'], sendHour: 8 },
  reminderTemplate: {
    subject: 'Darcybow — payment reminder ({{orderReference}})',
    body: 'Hi {{customerName}},\n\nA friendly reminder about the remaining balance on your Darcybow order {{orderReference}} (invoice {{invoiceNumber}}).\n\nOrder total: {{orderTotal}}\nPayments received: {{totalPaid}}\nRemaining balance: {{remainingBalance}}\nDue date: {{dueDate}}\n\n{{paymentLink}}\n\nIf you have any questions, or have already made this payment, just reply to this email or give us a ring.\n\nWarm regards,\nDarcybow\nhello@darcybow.ie · +353 21 123 4567 · darcybow.ie',
  },
  // The three booking questions Appointly asks when a customer books an
  // appointment through Shopify. Shown with the customer's answers on the
  // customer page; also used to prefill manual logging.
  appointlyQuestions: [
    'What is the occasion, and when is it?',
    'Who is the appointment for, and what age/size do they usually wear?',
    'Are there any styles, colours or budget you have in mind?',
  ],
  shop: {
    name: 'Darcybow', addressLine: 'Unit 4, The Courtyard, Douglas, Cork, Ireland',
    email: 'hello@darcybow.ie', phone: '+353 21 123 4567', web: 'darcybow.ie', vat: 'IE 1234567X',
  },
  // Six staff run private appointments with customers at event days.
  staff: [
    { name: 'Elva', role: 'admin' },
    { name: 'Aoife', role: 'staff' },
    { name: 'Niamh', role: 'staff' },
    { name: 'Sinéad', role: 'staff' },
    { name: 'Ciara', role: 'staff' },
    { name: 'Emma', role: 'staff' },
  ],
  // Event-day schedule: hourly blocks from 9am to 6pm, up to 6 customers
  // per slot (private appointments, one staff member per customer).
  eventDay: { startHour: 9, endHour: 18, slotCapacity: 6 },
};

/* ---------------------- seed data ---------------------- */
const Seed = {
  build() {
    const db = {
      seededAt: nowIso(),
      settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
      customers: [], products: [], orders: [], orderItems: [], instalments: [],
      payments: [], allocations: [], adjustments: [], reminderTasks: [],
      contactLog: [], customerReminders: [], outbox: [], appointments: [],
      counters: { order: 1040, invoice: 2100 },
    };

    // Product catalogue — in live mode this is refreshed from Shopify
    // via ShopifyService.fetchCatalogue(); these mirror that shape.
    const P = (title, styleCode, category, price, colours, sizes) =>
      ({ id: uid(), shopifySourceId: 'gid://shopify/Product/' + Math.floor(1e12 + Math.random() * 9e12),
         title, styleCode, category, retailPriceCents: price, colours, sizes, active: true });
    const products = [
      P('Isabella Communion Gown', 'DB-IS01', 'dress', 38500, ['Ivory','White'], ['Age 7','Age 8','Age 9','Age 10']),
      P('Grace Communion Dress', 'DB-GR02', 'dress', 32000, ['White','Ivory'], ['Age 7','Age 8','Age 9','Age 10']),
      P('Aoibhinn Flower Girl Dress', 'DB-AO03', 'dress', 18500, ['Ivory','Blush','Champagne'], ['Age 3','Age 4','Age 5','Age 6','Age 7']),
      P('Sofia Debs Gown', 'DB-SF04', 'dress', 42500, ['Emerald','Navy','Ruby','Black'], ['6','8','10','12','14','16']),
      P('Valentina Debs Gown', 'DB-VL05', 'dress', 48000, ['Champagne','Dusty Rose','Sage'], ['6','8','10','12','14','16']),
      P('Clara Confirmation Dress', 'DB-CL06', 'dress', 24500, ['White','Powder Blue','Lilac'], ['Age 11','Age 12','Age 13']),
      P('Mother-of-the-Bride Two Piece', 'DB-MB07', 'dress', 39500, ['Teal','Silver','Plum'], ['10','12','14','16','18','20']),
      P('Willow Christening Gown', 'DB-CH08', 'dress', 14500, ['Ivory','White'], ['0-3 months','3-6 months','6-12 months','12-18 months']),
      P('Satin Ballet Pumps', 'DB-SH10', 'shoes', 5500, ['White','Ivory'], ['28','29','30','31','32','33','34','35']),
      P('Pearl Heeled Sandals', 'DB-SH11', 'shoes', 7500, ['Ivory','Silver','Nude'], ['36','37','38','39','40','41']),
      P('Crystal Tiara', 'DB-AC20', 'accessory', 4500, ['Silver','Gold'], ['One size']),
      P('Pearl Bolero Jacket', 'DB-AC21', 'accessory', 6500, ['White','Ivory'], ['Age 7-8','Age 9-10','S','M','L']),
      P('Communion Veil with Comb', 'DB-AC22', 'accessory', 3500, ['White','Ivory'], ['One size']),
      P('Satin Gloves', 'DB-AC23', 'accessory', 1800, ['White','Ivory'], ['Child','Adult']),
      P('Beaded Clutch Bag', 'DB-AC24', 'accessory', 4200, ['Silver','Champagne','Navy'], ['One size']),
    ];
    db.products = products;
    const prod = code => products.find(p => p.styleCode === code);

    const C = (name, daughterName, email, phone, address, notes) =>
      ({ id: uid(), name, daughterName, email, phone, address, notes, createdAt: isoDaysAgo(90), updatedAt: isoDaysAgo(10) });

    // Venues usually host a whole weekend of events (Saturday + Sunday):
    // find the Saturday ~5 weeks out so the seed demos the day filters.
    let satN = 35; while (new Date(Date.now() + satN * 86400000).getDay() !== 6) satN++;
    const SAT = daysFromNow(satN), SUN = daysFromNow(satN + 1);

    // Helper: create a full order with items, deposit, plan and payments.
    // spec: { customer, items:[{code,colour,size,qty?}], eventHotel, eventDate, staffNotes,
    //         confirmedDaysAgo, plan: 'paid_in_full'|'fifty_fifty'|'custom'|null,
    //         custom:[{amount,dueInDays,notes}], finalDueInDays, payments:[{amount|'rest1'|'all', daysAgo, method}],
    //         status?, flags?, writeOff?, reminderSentDaysAgo?, contact?[], promisedInDays? }
    let refN = db.counters.order;
    const mkOrder = (spec) => {
      const cust = spec.customer; db.customers.push(cust);
      const oid = uid();
      const created = isoDaysAgo(spec.confirmedDaysAgo, 11);
      const order = {
        id: oid, reference: 'DB-' + (refN++), customerId: cust.id,
        status: spec.status || 'confirmed', planType: spec.plan || null,
        eventHotel: spec.eventHotel || '', eventDate: spec.eventDate || null,
        staffNotes: spec.staffNotes || '',
        remindersPaused: !!(spec.flags && spec.flags.remindersPaused),
        needsReview: !!(spec.flags && spec.flags.needsReview),
        refundProcessing: false, promisedPaymentDate: spec.promisedInDays != null ? daysFromNow(spec.promisedInDays) : null,
        createdAt: created, updatedAt: created,
      };
      db.orders.push(order);
      let total = 0;
      for (const it of spec.items) {
        const p = prod(it.code); const qty = it.qty || 1;
        total += p.retailPriceCents * qty;
        db.orderItems.push({ id: uid(), orderId: oid, productId: p.id, title: p.title, styleCode: p.styleCode,
          category: p.category, colour: it.colour, size: it.size, quantity: qty, retailPriceCents: p.retailPriceCents });
      }
      // Every order starts with the €25 Shopify deposit (the only thing sold through checkout).
      const payments = [{ amount: 2500, daysAgo: spec.confirmedDaysAgo, method: 'shopify_deposit',
        notes: 'Shopify deposit product — order #' + order.reference }];
      for (const pay of (spec.payments || [])) payments.push(pay);

      // Build instalments.
      const insts = [];
      const mkInst = (n, due, dueDate, notes) => {
        const inst = { id: uid(), dressOrderId: oid, instalmentNumber: n, amountDueCents: due, amountPaidCents: 0,
          dueDate, status: 'scheduled', paidAt: null, reminderStatus: 'not_due', lastReminderSentAt: null,
          nextReminderAt: null, notes: notes || '', createdAt: created, updatedAt: created };
        insts.push(inst); db.instalments.push(inst); return inst;
      };
      if (spec.plan === 'paid_in_full') {
        mkInst(1, total, daysFromNow(-(spec.confirmedDaysAgo)), 'Paid in full at confirmation');
      } else if (spec.plan === 'fifty_fifty') {
        const [h1] = splitCents(total, 2);
        mkInst(1, h1, daysFromNow(-(spec.confirmedDaysAgo)), 'First 50% at confirmation');
        mkInst(2, total - h1, spec.finalDueInDays != null ? daysFromNow(spec.finalDueInDays)
          : addCalendarMonths(daysFromNow(-(spec.confirmedDaysAgo)), 1), 'Final balance');
      } else if (spec.plan === 'custom') {
        let n = 1;
        for (const ci of spec.custom) mkInst(n++, ci.amount, daysFromNow(ci.dueInDays), ci.notes || '');
      }
      // Record payments and allocate oldest-instalment-first.
      for (const pay of payments) {
        let amt = pay.amount;
        if (amt === 'rest1') amt = insts[0].amountDueCents - insts[0].amountPaidCents;
        if (amt === 'all') amt = total - payments.filter(p2 => typeof p2.amount === 'number').reduce((s, p2) => s + p2.amount, 0);
        const pm = { id: uid(), orderId: oid, amountCents: amt, method: pay.method || 'card', reference: '',
          receivedAt: isoDaysAgo(pay.daysAgo, 14), recordedBy: pay.by || 'Elva', notes: pay.notes || '',
          voided: false, voidReason: '', createdAt: isoDaysAgo(pay.daysAgo, 14) };
        db.payments.push(pm);
        let left = amt;
        for (const inst of insts) {
          if (left <= 0) break;
          const need = inst.amountDueCents - inst.amountPaidCents;
          if (need <= 0) continue;
          const take = Math.min(left, need);
          db.allocations.push({ id: uid(), paymentId: pm.id, instalmentId: inst.id, amountCents: take, createdAt: pm.createdAt });
          inst.amountPaidCents += take; left -= take;
          if (inst.amountPaidCents >= inst.amountDueCents) { inst.paidAt = pm.receivedAt; }
        }
      }
      if (spec.writeOff) {
        db.adjustments.push({ id: uid(), orderId: oid, type: 'write_off', amountCents: spec.writeOff.amount,
          reason: spec.writeOff.reason, staff: 'Elva', previousValue: 'balance ' + eur(spec.writeOff.amount),
          newValue: 'balance €0.00 (written off)', createdAt: isoDaysAgo(spec.writeOff.daysAgo, 16) });
        order.status = 'written_off';
      }
      if (spec.reminderSentDaysAgo != null) {
        const inst = insts[insts.length - 1];
        inst.reminderStatus = 'sent'; inst.lastReminderSentAt = isoDaysAgo(spec.reminderSentDaysAgo, 10);
        db.customerReminders.push({ id: uid(), orderId: oid, instalmentId: inst.id, method: 'email',
          recipient: cust.email, subject: 'Darcybow — payment reminder (' + order.reference + ')',
          body: 'Hi ' + cust.name + ',\n\nA friendly reminder about the remaining balance on your Darcybow order ' + order.reference + '. (seeded sample reminder)',
          sentBy: 'Aoife', sentAt: isoDaysAgo(spec.reminderSentDaysAgo, 10), deliveryStatus: 'delivered', customerResponse: spec.reminderResponse || '' });
      }
      for (const cl of (spec.contact || [])) {
        db.contactLog.push({ id: uid(), orderId: oid, reminderTaskId: null, action: cl.action, note: cl.note || '',
          staff: cl.by || 'Aoife', createdAt: isoDaysAgo(cl.daysAgo, 15) });
      }
      return order;
    };

    /* ---- Scenario 1: paid in full (recently paid) ---- */

<script>
/* =====================================================================
   Domain — every euro figure is computed here from the ledger, never
   taken from UI state. In the live build this module moves server-side.
   ===================================================================== */
const Domain = {

  customer: id => DB.customers.find(c => c.id === id),
  order: id => DB.orders.find(o => o.id === id),
  itemsOf: orderId => DB.orderItems.filter(i => i.orderId === orderId),
  instalmentsOf: orderId => DB.instalments.filter(i => i.dressOrderId === orderId).sort((a, b) => a.instalmentNumber - b.instalmentNumber),
  paymentsOf: orderId => DB.payments.filter(p => p.orderId === orderId).sort((a, b) => a.receivedAt < b.receivedAt ? -1 : 1),
  ordersOf: customerId => DB.orders.filter(o => o.customerId === customerId),

  orderTotalCents(orderId) {
    return Domain.itemsOf(orderId).reduce((s, i) => s + i.retailPriceCents * i.quantity, 0);
  },
  paidCents(orderId) {
    return Domain.paymentsOf(orderId).filter(p => !p.voided).reduce((s, p) => s + p.amountCents, 0);
  },
  creditCents(orderId) { // discounts + write-offs: reduce the balance, are NOT payments
    return DB.adjustments.filter(a => a.orderId === orderId && (a.type === 'discount' || a.type === 'write_off'))
      .reduce((s, a) => s + (a.amountCents || 0), 0);
  },
  balanceCents(orderId) {
    return Domain.orderTotalCents(orderId) - Domain.paidCents(orderId) - Domain.creditCents(orderId);
  },

  /* -------- instalment status (recomputed, never trusted from UI) -------- */
  refreshInstalment(inst) {
    if (inst.status === 'cancelled') return;
    const order = Domain.order(inst.dressOrderId);
    if (order.status === 'cancelled') { inst.status = 'cancelled'; return; }
    const offs = DB.settings.reminderOffsets;
    const du = daysUntil(inst.dueDate);
    let status;
    if (inst.amountPaidCents >= inst.amountDueCents) status = 'paid';
    else if (du < 0) status = 'overdue';
    else if (inst.amountPaidCents > 0) status = 'partially_paid';
    else if (du <= offs.dueSoon) status = 'due_soon';
    else status = 'scheduled';
    if (status !== inst.status) { inst.status = status; inst.updatedAt = nowIso(); }
    // reminderStatus: pending once inside the reminder window, unless already sent
    if (status === 'paid') inst.reminderStatus = inst.reminderStatus === 'sent' ? 'sent' : 'not_due';
    else if (inst.reminderStatus !== 'sent' && inst.reminderStatus !== 'failed') {
      inst.reminderStatus = du <= offs.upcoming ? 'pending' : 'not_due';
    }
    inst.nextReminderAt = status === 'paid' ? null
      : du > offs.upcoming ? daysFromNow(du - offs.upcoming)
      : du > offs.dueSoon ? daysFromNow(du - offs.dueSoon)
      : du > 0 ? inst.dueDate : todayStr();
  },

  nextUnpaidInstalment(orderId) {
    return Domain.instalmentsOf(orderId).find(i => i.status !== 'cancelled' && i.amountPaidCents < i.amountDueCents) || null;
  },

  reminderStage(inst) {
    const du = daysUntil(inst.dueDate);
    const offs = DB.settings.reminderOffsets;
    if (du < 0) return 'overdue';
    if (du === 0) return 'due_today';
    if (du <= offs.dueSoon) return 'upcoming_7';
    if (du <= offs.upcoming) return 'upcoming_14';
    return null;
  },

  /* -------- reminder engine: internal follow-up tasks --------
     Tasks are created per (instalment, stage) and are never cleared just
     because they were reviewed — they close only when the balance hits
     zero, the order is cancelled, or the balance is written off. */
  refreshAll() {
    for (const inst of DB.instalments) Domain.refreshInstalment(inst);
    for (const order of DB.orders) {
      const balance = Domain.balanceCents(order.id);
      const active = order.status !== 'cancelled' && order.status !== 'written_off';
      if (active && balance <= 0 && order.status !== 'fully_paid' && order.planType) {
        order.status = 'fully_paid'; order.updatedAt = nowIso();
      }
      const done = !active || balance <= 0;
      if (done) { // stop reminders, keep history
        for (const t of DB.reminderTasks.filter(t => t.orderId === order.id && t.status !== 'closed')) {
          t.status = 'closed'; t.updatedAt = nowIso();
        }
        continue;
      }
      if (order.remindersPaused) continue;
      const inst = Domain.nextUnpaidInstalment(order.id);
      if (!inst) continue;
      const stage = Domain.reminderStage(inst);
      if (!stage) continue;
      let task = DB.reminderTasks.find(t => t.instalmentId === inst.id && t.stage === stage);
      if (!task) {
        task = { id: uid(), orderId: order.id, instalmentId: inst.id, stage, status: 'open',
          snoozedUntil: null, promisedPaymentDate: null, createdAt: nowIso(), updatedAt: nowIso() };
        DB.reminderTasks.push(task);
      }
      // Reopen when a snooze or promised payment date has passed unpaid.
      if (task.status === 'snoozed' && task.snoozedUntil && task.snoozedUntil <= todayStr()) {
        task.status = 'open'; task.updatedAt = nowIso();
        DB.contactLog.push({ id: uid(), orderId: order.id, reminderTaskId: task.id, action: 'reopened',
          note: 'Snooze until ' + fmtDate(task.snoozedUntil) + ' elapsed with balance still outstanding.', staff: 'System', createdAt: nowIso() });
        task.snoozedUntil = null;
      }
      if (order.promisedPaymentDate && order.promisedPaymentDate < todayStr()) {
        if (task.status === 'reviewed') {
          task.status = 'open'; task.updatedAt = nowIso();
          DB.contactLog.push({ id: uid(), orderId: order.id, reminderTaskId: task.id, action: 'reopened',
            note: 'Promised payment date ' + fmtDate(order.promisedPaymentDate) + ' passed unpaid.', staff: 'System', createdAt: nowIso() });
        }
        order.promisedPaymentDate = null;
      }
    }
    Store.save();
  },

  openTasks() {
    return DB.reminderTasks.filter(t => {
      if (t.status === 'closed') return false;
      if (t.status === 'snoozed' && t.snoozedUntil && t.snoozedUntil > todayStr()) return false;
      return true;
    });
  },

  /* -------- payment plans -------- */
  createPlan(orderId, planType, opts, staff) {
    const order = Domain.order(orderId);
    if (!order) throw new Error('Order not found');
    if (Domain.instalmentsOf(orderId).some(i => i.status !== 'cancelled'))
      throw new Error('This order already has an active plan. Cancel it first (with a reason) to re-plan.');
    const total = Domain.orderTotalCents(orderId);
    const outstanding = Domain.balanceCents(orderId);
    const now = nowIso();
    const mk = (n, amountDueCents, dueDate, notes) => DB.instalments.push({
      id: uid(), dressOrderId: orderId, instalmentNumber: n, amountDueCents, amountPaidCents: 0,
      dueDate, status: 'scheduled', paidAt: null, reminderStatus: 'not_due', lastReminderSentAt: null,
      nextReminderAt: null, notes: notes || '', createdAt: now, updatedAt: now,
    });

    if (planType === 'paid_in_full') {
      mk(1, total, todayStr(), 'Paid in full');
    } else if (planType === 'fifty_fifty') {
      // First payment is 50% of the ORDER TOTAL; rounding cent goes to the final instalment.
      const [first] = splitCents(total, 2);
      const finalDue = opts.finalDueDate || addCalendarMonths(todayStr(), 1); // default: one calendar month after first payment; editable
      if (finalDue < todayStr()) throw new Error('Final instalment due date cannot be in the past.');
      mk(1, first, todayStr(), 'First 50% of order total');
      mk(2, total - first, finalDue, 'Final balance');
    } else if (planType === 'custom') {
      const rows = opts.instalments || [];
      if (!rows.length) throw new Error('Add at least one instalment.');
      let sum = 0, n = 1;
      for (const r of rows) {
        if (!Number.isInteger(r.amountCents) || r.amountCents <= 0) throw new Error('Instalment ' + n + ': enter a valid amount.');
        if (!r.dueDate || !/^\d{4}-\d{2}-\d{2}$/.test(r.dueDate)) throw new Error('Instalment ' + n + ': enter a due date.');
        sum += r.amountCents; n++;
      }
      // Scheduled instalments must sum to the outstanding balance (server-side rule).
      if (sum !== outstanding) {
        throw new Error('Instalments sum to ' + eur(sum) + ' but the outstanding balance is ' + eur(outstanding) +
          '. Difference: ' + eur(sum - outstanding) + '.');
      }
      n = 1;
      for (const r of rows.slice().sort((a, b) => a.dueDate < b.dueDate ? -1 : 1)) mk(n++, r.amountCents, r.dueDate, r.notes || '');
    } else {
      throw new Error('Unknown plan type');
    }
    order.planType = planType; order.needsReview = false; order.updatedAt = now;
    // Existing payments (e.g. the Shopify deposit) allocate onto the new schedule.
    Domain.reallocateAll(orderId);
    Domain.refreshAll();
  },

  cancelPlan(orderId, reason, staff) {
    const insts = Domain.instalmentsOf(orderId).filter(i => i.status !== 'cancelled');
    for (const i of insts) { i.status = 'cancelled'; i.updatedAt = nowIso(); }
    for (const al of DB.allocations.filter(a => insts.some(i => i.id === a.instalmentId))) {
      // keep allocation history; amounts re-allocate when a new plan is made
    }
    const order = Domain.order(orderId);
    DB.adjustments.push({ id: uid(), orderId, type: 'plan_cancelled', amountCents: 0, reason, staff,
      previousValue: 'plan: ' + (order.planType || 'none'), newValue: 'plan cancelled', createdAt: nowIso() });
    order.planType = null; order.updatedAt = nowIso();
    Domain.refreshAll();
  },

  // Rebuild allocations for an order from its non-voided payments, oldest
  // payment → lowest-numbered unpaid instalment. Keeps the audit trail:
  // old allocation rows for voided payments are removed with the void entry logged.
  reallocateAll(orderId) {
    const insts = Domain.instalmentsOf(orderId).filter(i => i.status !== 'cancelled');
    const orderInstIds = new Set(Domain.instalmentsOf(orderId).map(i => i.id));
    DB.allocations = DB.allocations.filter(a => !orderInstIds.has(a.instalmentId));
    for (const i of insts) { i.amountPaidCents = 0; i.paidAt = null; }
    for (const p of Domain.paymentsOf(orderId).filter(p => !p.voided)) {
      let left = p.amountCents;
      for (const inst of insts) {
        if (left <= 0) break;
        const need = inst.amountDueCents - inst.amountPaidCents;
        if (need <= 0) continue;
        const take = Math.min(left, need);
        DB.allocations.push({ id: uid(), paymentId: p.id, instalmentId: inst.id, amountCents: take, createdAt: nowIso() });
        inst.amountPaidCents += take; left -= take;
        if (inst.amountPaidCents >= inst.amountDueCents) inst.paidAt = p.receivedAt;
      }
    }
  },

  /* -------- payments -------- */
  recordPayment(orderId, { amountCents, method, receivedAt, notes, recordedBy, allocations }) {
    if (!Number.isInteger(amountCents) || amountCents <= 0) throw new Error('Enter a valid payment amount.');
    const order = Domain.order(orderId);
    if (!order) throw new Error('Order not found');
    if (order.status === 'cancelled') throw new Error('This order is cancelled — record an adjustment instead.');
    const balance = Domain.balanceCents(orderId);
    if (amountCents > balance) throw new Error('Payment (' + eur(amountCents) + ') exceeds the outstanding balance (' + eur(balance) + '). Record the correct amount, or apply an adjustment for overpayments.');
    const pm = { id: uid(), orderId, amountCents, method: method || 'card', reference: '',
      receivedAt: receivedAt || nowIso(), recordedBy, notes: notes || '', voided: false, voidReason: '', createdAt: nowIso() };
    DB.payments.push(pm);
    const insts = Domain.instalmentsOf(orderId).filter(i => i.status !== 'cancelled');
    let left = amountCents;
    if (allocations && allocations.length) {
      // Manual split: must match the payment amount exactly.
      const sum = allocations.reduce((s, a) => s + a.amountCents, 0);
      if (sum !== amountCents) throw new Error('Allocations (' + eur(sum) + ') must equal the payment amount (' + eur(amountCents) + ').');
      for (const a of allocations) {
        const inst = insts.find(i => i.id === a.instalmentId);
        if (!inst) throw new Error('Unknown instalment in allocation.');
        const need = inst.amountDueCents - inst.amountPaidCents;
        if (a.amountCents > need) throw new Error('Allocation to instalment ' + inst.instalmentNumber + ' exceeds what is owed on it (' + eur(need) + ').');
        DB.allocations.push({ id: uid(), paymentId: pm.id, instalmentId: inst.id, amountCents: a.amountCents, createdAt: nowIso() });
        inst.amountPaidCents += a.amountCents;
        if (inst.amountPaidCents >= inst.amountDueCents) inst.paidAt = pm.receivedAt;
        inst.updatedAt = nowIso();
      }
    } else {
      // Auto: oldest unpaid instalment first.
      for (const inst of insts) {
        if (left <= 0) break;
        const need = inst.amountDueCents - inst.amountPaidCents;
        if (need <= 0) continue;
        const take = Math.min(left, need);
        DB.allocations.push({ id: uid(), paymentId: pm.id, instalmentId: inst.id, amountCents: take, createdAt: nowIso() });
        inst.amountPaidCents += take; left -= take;
        if (inst.amountPaidCents >= inst.amountDueCents) inst.paidAt = pm.receivedAt;
        inst.updatedAt = nowIso();
      }
    }
    order.updatedAt = nowIso();
    Domain.refreshAll(); // marks order fully_paid at zero balance and closes reminder tasks
    return pm;
  },

  voidPayment(paymentId, reason, staff) {
    const pm = DB.payments.find(p => p.id === paymentId);
    if (!pm) throw new Error('Payment not found');
    if (pm.voided) throw new Error('Payment already corrected.');
    pm.voided = true; pm.voidReason = reason;
    DB.adjustments.push({ id: uid(), orderId: pm.orderId, type: 'payment_correction', amountCents: 0,
      reason, staff, previousValue: eur(pm.amountCents) + ' ' + pm.method + ' on ' + fmtDateTime(pm.receivedAt),
      newValue: 'payment voided', createdAt: nowIso() });
    const order = Domain.order(pm.orderId);
    if (order.status === 'fully_paid' && Domain.balanceCents(order.id) + pm.amountCents > 0) order.status = 'confirmed';
    Domain.reallocateAll(pm.orderId);
    Domain.refreshAll();
  },

  /* -------- adjustments (admin only, always audited) -------- */
  applyAdjustment(orderId, { type, amountCents, reason, staff, previousValue, newValue }) {
    if (!reason || !reason.trim()) throw new Error('A reason is required for every adjustment.');
    DB.adjustments.push({ id: uid(), orderId, type, amountCents: amountCents || 0, reason: reason.trim(),
      staff, previousValue: previousValue || '', newValue: newValue || '', createdAt: nowIso() });
    if (type === 'write_off') {
      const order = Domain.order(orderId);
      if (Domain.balanceCents(orderId) <= 0) { order.status = 'written_off'; order.updatedAt = nowIso(); }
    }
    Domain.refreshAll();
  },

  changeDueDate(instalmentId, newDate, reason, staff) {
    const inst = DB.instalments.find(i => i.id === instalmentId);
    if (!inst) throw new Error('Instalment not found');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(newDate)) throw new Error('Enter a valid date.');
    Domain.applyAdjustment(inst.dressOrderId, {
      type: 'due_date_change', reason, staff,
      previousValue: 'instalment ' + inst.instalmentNumber + ' due ' + fmtDate(inst.dueDate),
      newValue: 'due ' + fmtDate(newDate),
    });
    inst.dueDate = newDate; inst.updatedAt = nowIso();
    Domain.refreshAll();
  },

  /* -------- outstanding balances view -------- */
  balanceRows() {
    const rows = [];
    for (const order of DB.orders) {
      if (order.status === 'cancelled') continue;
      const balance = Domain.balanceCents(order.id);
      const writtenOff = order.status === 'written_off';
      if (balance <= 0 && !writtenOff) continue;
      if (writtenOff) continue; // written-off balances appear in reporting, not as owing customers
      const cust = Domain.customer(order.customerId);
      const next = Domain.nextUnpaidInstalment(order.id);
      const du = next ? daysUntil(next.dueDate) : null;
      const lastRem = DB.customerReminders.filter(r => r.orderId === order.id).sort((a, b) => a.sentAt < b.sentAt ? 1 : -1)[0];
      const dress = Domain.itemsOf(order.id).filter(i => i.category === 'dress').map(i => i.title).join(', ')
        || Domain.itemsOf(order.id).map(i => i.title).join(', ');
      let group;
      if (!next) group = 'no_plan';
      else if (du < 0) group = next.amountPaidCents > 0 ? 'partially_paid_overdue' : 'overdue';
      else if (du === 0) group = 'due_today';
      else if (du <= DB.settings.reminderOffsets.dueSoon) group = 'due_7';
      else if (du <= DB.settings.reminderOffsets.upcoming) group = 'due_14';
      else group = 'due_later';
      const reminderRequired = next && du <= DB.settings.reminderOffsets.dueSoon && (!lastRem || (du < 0 && lastRem.sentAt < new Date(Date.now() - DB.settings.duplicateReminderWindowDays * 86400000).toISOString()));
      rows.push({
        order, customer: cust, dress,
        totalCents: Domain.orderTotalCents(order.id), paidCents: Domain.paidCents(order.id),
        creditCents: Domain.creditCents(order.id), balanceCents: balance,
        next, daysUntilDue: du, group, lastReminder: lastRem || null,
        reminderRequired: !!reminderRequired,
        planStatus: order.planType ? (next ? next.status : 'paid') : 'no_plan',
      });
    }
    return rows;
  },

  balanceSummary(rows) {
    const withinSoon = rows.filter(r => r.daysUntilDue != null && r.daysUntilDue >= 0 && r.daysUntilDue <= DB.settings.reminderOffsets.dueSoon);
    const overdue = rows.filter(r => r.daysUntilDue != null && r.daysUntilDue < 0);
    return {
      totalOutstanding: rows.reduce((s, r) => s + r.balanceCents, 0),
      dueSoonAmount: withinSoon.reduce((s, r) => s + (r.next ? r.next.amountDueCents - r.next.amountPaidCents : 0), 0),
      dueSoonCount: withinSoon.length,
      overdueAmount: overdue.reduce((s, r) => s + r.balanceCents, 0),
      overdueCount: overdue.length,
      customersOwing: new Set(rows.map(r => r.customer.id)).size,
      remindersNeeded: rows.filter(r => r.reminderRequired).length,
      writtenOffCents: DB.adjustments.filter(a => a.type === 'write_off').reduce((s, a) => s + a.amountCents, 0),
    };
  },

  /* -------- customer reminder guard-rails --------
     These are the conditions under which a reminder must never be sent
     automatically; for manual sends they surface as blocks/warnings. */
  reminderBlocks(orderId) {
    const order = Domain.order(orderId);
    const blocks = [];
    if (Domain.balanceCents(orderId) <= 0) blocks.push('The balance is already paid.');
    if (order.status === 'cancelled') blocks.push('The order is cancelled.');
    if (order.refundProcessing) blocks.push('A refund is being processed.');
    if (order.remindersPaused) blocks.push('Reminders are paused for this order.');
    if (order.needsReview) blocks.push('The record is flagged as needing review.');
    if (order.promisedPaymentDate && order.promisedPaymentDate >= todayStr())
      blocks.push('An agreed payment date is in the future (' + fmtDate(order.promisedPaymentDate) + ').');
    return blocks;
  },
  duplicateReminderWarning(orderId) {
    const win = DB.settings.duplicateReminderWindowDays;
    const cutoff = new Date(Date.now() - win * 86400000).toISOString();
    const recent = DB.customerReminders.filter(r => r.orderId === orderId && r.sentAt >= cutoff)
      .sort((a, b) => a.sentAt < b.sentAt ? 1 : -1)[0];
    return recent ? 'A reminder was already sent ' + fmtDateTime(recent.sentAt) + ' by ' + recent.sentBy +
      ' (' + recent.method + '). Sending again within ' + win + ' days needs an authorised override.' : null;
  },

  invoiceNumber(order, variant) {
    return 'INV-' + order.reference.replace('DB-', '') + (variant === 'accountant' ? '-A' : '-C');
  },

  /* -------- stock export -------- */
  stockRows() {
    const map = new Map();
    for (const order of DB.orders) {
      if (order.status === 'cancelled') continue;
      for (const it of Domain.itemsOf(order.id)) {
        const key = it.styleCode + '|' + it.title;
        if (!map.has(key)) map.set(key, { styleCode: it.styleCode, title: it.title, category: it.category, total: 0, variants: new Map() });
        const row = map.get(key);
        row.total += it.quantity;
        const vk = (it.colour || '—') + ' / ' + (it.size || '—');
        row.variants.set(vk, (row.variants.get(vk) || 0) + it.quantity);
      }
    }
    return [...map.values()].sort((a, b) => b.total - a.total);
  },
};
</script>

/* =====================================================================
   Integration services. The app runs fully on mock data with NO keys
   present; supplying credentials at the marked seams switches to live.
   ===================================================================== */

const Credentials = {
  // ------------------------------------------------------------------
  // LIVE CREDENTIAL SEAM — Shopify Admin API
  // To go live, fill these in (store domain + Admin API access token
  // with read_products scope) and ShopifyService switches from the
  // seeded mock catalogue to the real one. Nothing else changes.
  // ------------------------------------------------------------------
  shopify: {
    storeDomain: '',        // e.g. 'darcybow.myshopify.com'
    adminApiAccessToken: '', // shpat_...  (read_products)
  },
  // ------------------------------------------------------------------
  // LIVE CREDENTIAL SEAM — Appointly (appointment booking on Shopify)
  // Appointly asks three questions when a customer books an appointment
  // through the Shopify storefront and stores the answers with the
  // booking. Fill in the Appointly API key (Appointly app → Settings →
  // API) — plus the same Shopify credentials above — and
  // AppointlyService pulls each booking's Q&As and matches them to
  // customers by email/phone. Until then, seeded sample bookings are
  // shown and staff can log answers manually.
  // ------------------------------------------------------------------
  appointly: {
    apiKey: '',
  },
};

const ShopifyService = {
  isLive: () => !!(Credentials.shopify.storeDomain && Credentials.shopify.adminApiAccessToken),
  // Returns the full product catalogue for staff selection. The dresses,
  // shoes and accessories exist in Shopify as product records only —
  // checkout is used solely for the €25 deposit product, so no order or
  // payment data ever comes from Shopify; just the catalogue.
  async fetchCatalogue() {
    if (ShopifyService.isLive()) {
      // LIVE CREDENTIAL SEAM — real call goes here, e.g.:
      //   GET https://{storeDomain}/admin/api/2024-10/products.json
      //   Header: X-Shopify-Access-Token: {adminApiAccessToken}
      // Map each product/variant to { id, shopifySourceId, title, styleCode,
      // category, retailPriceCents, colours[], sizes[], active } and merge
      // into DB.products keyed on shopifySourceId.
      throw new Error('Live Shopify fetch not wired in this offline slice.');
    }
    return DB.products.filter(p => p.active); // mock catalogue seeded from Seed.build()
  },
};

const AppointlyService = {
  isLive: () => !!(Credentials.appointly.apiKey && ShopifyService.isLive()),
  // Returns appointment bookings with the three question/answer pairs.
  async fetchBookings() {
    if (AppointlyService.isLive()) {
      // LIVE CREDENTIAL SEAM — real sync goes here, e.g.:
      //   GET https://api.appointly.io/v1/bookings  (X-Api-Key: {apiKey})
      //   or read the booking's question answers from the Shopify order's
      //   note_attributes on the Appointly booking order.
      // Map each booking to { id, customerId (matched on email/phone),
      // source:'appointly', service, appointmentAt, status, bookedAt,
      // questions:[{q,a}×3], syncedAt } and merge into DB.appointments.
      throw new Error('Live Appointly sync not wired in this offline slice.');
    }
    return DB.appointments; // seeded sample bookings (same shape as the live sync)
  },
  bookingsFor(customerId) {
    return DB.appointments.filter(a => a.customerId === customerId)
      .sort((a, b) => a.appointmentAt < b.appointmentAt ? 1 : -1);
  },
};

<script>
/* =====================================================================
   UI — hash-routed single page app.
   ===================================================================== */
const UI = {
  modal(html, wide) {
    const root = document.getElementById('modalroot');
    const box = document.getElementById('modalbox');
    box.className = 'box' + (wide ? ' wide' : '');
    box.innerHTML = '<button class="x" onclick="UI.closeModal()">✕</button>' + html;
    root.classList.add('open');
    box.scrollTop = 0;
  },
  closeModal() { document.getElementById('modalroot').classList.remove('open'); },
  toast(msg, ms = 3200) {
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), ms);
  },
  err(e) { UI.toast('⚠ ' + (e.message || e), 5000); },

  badge(status) {
    const map = {
      paid: ['b-green', 'Paid'], fully_paid: ['b-green', 'Fully paid'], scheduled: ['b-grey', 'Scheduled'],
      due_soon: ['b-amber', 'Due soon'], partially_paid: ['b-blue', 'Partially paid'], overdue: ['b-red', 'Overdue'],
      cancelled: ['b-grey', 'Cancelled'], confirmed: ['b-blue', 'Active'], written_off: ['b-grey', 'Written off'],
      draft: ['b-grey', 'Draft'], no_plan: ['b-amber', 'No plan yet'],
      not_due: ['b-grey', 'Not due'], pending: ['b-amber', 'Reminder pending'], sent: ['b-blue', 'Reminder sent'], failed: ['b-red', 'Send failed'],
      open: ['b-amber', 'Open'], reviewed: ['b-blue', 'Reviewed'], snoozed: ['b-grey', 'Snoozed'], closed: ['b-green', 'Closed'],
      mock_sent: ['b-blue', 'Mock sent'],
    };
    const [cls, label] = map[status] || ['b-grey', status];
    return `<span class="badge ${cls}">${esc(label)}</span>`;
  },
  // Occasion badge, colour-coded by type so Communion / Confirmation /
  // Christening / Debs / Wedding are distinguishable at a glance.
  eventBadge(eventHotel) {
    if (!eventHotel) return '<span class="muted">—</span>';
    const [type, venue] = eventHotel.split(/\s+—\s+/);
    const cls = /communion/i.test(type) ? 'b-blue'
      : /confirmation/i.test(type) ? 'b-purple'
      : /christening|baptism/i.test(type) ? 'b-teal'
      : /debs|prom|grad/i.test(type) ? 'b-brand'
      : /wedding|flower/i.test(type) ? 'b-gold' : 'b-grey';
    return `<span class="badge ${cls}">${esc(type)}</span>${venue ? `<br><span class="muted">${esc(venue)}</span>` : ''}`;
  },
  dueBadge(du) {
    if (du == null) return '';
    if (du < 0) return `<span class="badge b-red">${Math.abs(du)}d overdue</span>`;
    if (du === 0) return `<span class="badge b-red">Due today</span>`;
    if (du <= DB.settings.reminderOffsets.dueSoon) return `<span class="badge b-amber">${du}d</span>`;
    return `<span class="badge b-grey">${du}d</span>`;
  },
};

const App = {
  resetDemo() {
    if (!confirm('Reset all demo data back to the seeded sample set?')) return;
    Store.reset(); Domain.refreshAll(); App.route();
    UI.toast('Demo data reset.');
  },

  /* ---------- router ---------- */
  route() {
    Domain.refreshAll();
    const hash = location.hash || '#/dashboard';
    const [_, pageRaw, argRaw] = hash.split('/');
    const page = (pageRaw || '').split('?')[0];
    const arg = (argRaw || '').split('?')[0];
    const nav = [
      ['dashboard', '⌂', 'Dashboard'],
      ['customers', '👥', 'Customers', () => DB.customers.length],
      ['venues', '📍', 'Venues'],
      ['import', '⇪', 'Connect data'],
    ];
    document.getElementById('nav').innerHTML = nav.map(([key, icon, label, cnt]) =>
      `<a href="#/${key}" class="${page === key ? 'active' : ''}"><span>${icon}</span> ${label}${cnt ? `<span class="cnt">${cnt()}</span>` : ''}</a>`).join('');

  go(hash) { if (location.hash === hash) App.route(); else location.hash = hash; },
};

      <tbody>
        ${matches.map(c => {
          const orders = Domain.ordersOf(c.id);
          const latest = orders.slice().sort((a, b) => a.createdAt < b.createdAt ? 1 : -1)[0];
          const items = orders.flatMap(o => Domain.itemsOf(o.id));

/* =============================== VENUES =============================== */
const fmtWd = d => new Date(d + 'T00:00').toLocaleDateString('en-IE', { weekday: 'short', day: 'numeric', month: 'short' });

// Orders grouped by venue (the part after the "—" in event/hotel),
// sorted chronologically by each venue's next event date.
function venueGroups() {
  const groups = new Map();
  for (const o of DB.orders) {
    if (!o.eventHotel) continue;
    const parts = o.eventHotel.split(/\s+—\s+/);
    const venue = (parts[1] || parts[0]).trim();
    if (!groups.has(venue)) groups.set(venue, []);
    groups.get(venue).push(o);
  }
  return [...groups.entries()].map(([venue, orders]) => {
    const dates = [...new Set(orders.map(o => o.eventDate).filter(Boolean))].sort();
    const nextDate = dates.find(d => d >= todayStr()) || null;
    const occasions = [...new Set(orders.map(o => (o.eventHotel.split(/\s+—\s+/)[0] || '').trim()).filter(Boolean))];
    return { venue, orders, dates, nextDate, occasions };
  }).sort((a, b) => (a.nextDate || '9999-' + (a.dates.slice(-1)[0] || '')) < (b.nextDate || '9999-' + (b.dates.slice(-1)[0] || '')) ? -1 : 1);
}

/* ---- Single venue: every customer + coming-in times, chronological.
       Venues often host a whole weekend (Sat + Sun), so each event day
       gets its own filter chip alongside "All customers". ---- */
let venueDayFilter = '';
let venueDayFilterVenue = '';
Pages.venueDetail = (venueName) => {
  const v = venueGroups().find(x => x.venue === venueName);
  if (!v) return `<p><a class="plain" href="#/venues">← Venues</a></p><h1>Venue not found</h1>`;
  if (venueDayFilterVenue !== venueName) { venueDayFilter = ''; venueDayFilterVenue = venueName; }
  const allRows = v.orders.map(o => {
    const c = Domain.customer(o.customerId);
    const appts = AppointlyService.bookingsFor(c.id);
    const upcoming = appts.filter(a => a.appointmentAt >= todayStr()).sort((a, b) => (a.appointmentAt + (a.time || '')) < (b.appointmentAt + (b.time || '')) ? -1 : 1)[0];
    const last = appts[0];
    const dress = Domain.itemsOf(o.id).filter(i => i.category === 'dress')[0];
    return { o, c, upcoming, last, dress };
  });
  const dayName = d => new Date(d + 'T00:00').toLocaleDateString('en-IE', { weekday: 'long' });
  const dayChips = v.dates.map(d => ({
    date: d,
    label: dayName(d) + ' · ' + new Date(d + 'T00:00').toLocaleDateString('en-IE', { day: 'numeric', month: 'short' }),
    count: allRows.filter(r => r.o.eventDate === d).length,
  }));
  const key = r => r.upcoming ? r.upcoming.appointmentAt + 'T' + (r.upcoming.time || '00:00') : (r.last ? r.last.appointmentAt + 'T' + (r.last.time || '00:00') : '');
  const row = (r, timeHtml, appt) => `
    <div class="vrow" onclick="App.go('#/customer/${r.c.id}')">
      <div class="vtime">${timeHtml}</div>
      <div style="flex:1; min-width:0">
        <span class="cname">${esc(r.c.name)}</span>${r.c.daughterName ? ` <span class="small muted">for ${esc(r.c.daughterName)}</span>` : ''}
        <br><span class="small muted">${r.dress ? esc(r.dress.title) : ''}${r.o.eventDate ? ' · event ' + fmtWd(r.o.eventDate) : ''}</span>
      </div>
      ${appt && appt.staffName ? `<div><span class="badge b-grey">${esc(appt.staffName)}</span></div>` : ''}
      <div style="text-align:right">
        ${UI.eventBadge(r.o.eventHotel).split('<br>')[0]}
      </div>
    </div>`;

  let body;
  if (venueDayFilter) {
    /* ---- Day planner: hourly blocks 9am–6pm, 6-per-slot capacity,
           staff assigned per customer, printable run sheet ---- */
    const day = venueDayFilter;
    const cfg = DB.settings.eventDay;
    const dayRows = allRows.filter(r => r.o.eventDate === day);
    const slotted = [], notBooked = [];
    for (const r of dayRows) {
      const a = DB.appointments.filter(x => x.customerId === r.c.id && x.appointmentAt === day)
        .sort((p, q) => (p.time || '') < (q.time || '') ? -1 : 1)[0];
      if (a) slotted.push({ ...r, a }); else notBooked.push(r);
    }
    const hh = h => String(h).padStart(2, '0');
    const blocks = [];
    for (let h = cfg.startHour; h < cfg.endHour; h++) {
      const inBlock = slotted.filter(s => s.a.time && s.a.time >= hh(h) + ':00' && s.a.time < hh(h + 1) + ':00')
        .sort((p, q) => p.a.time < q.a.time ? -1 : 1);
      blocks.push({ n: blocks.length + 1, from: hh(h) + ':00', to: hh(h + 1) + ':00', rows: inBlock });
    }
    const unscheduled = slotted.filter(s => !s.a.time || s.a.time < hh(cfg.startHour) + ':00' || s.a.time >= hh(cfg.endHour) + ':00');

      </div>
      ${blocks.map(b => `
        <div class="flex blockhead">
          <b>Block ${b.n}</b><span class="muted">${b.from} – ${b.to}</span>
          <span class="badge ${b.rows.length > cfg.slotCapacity ? 'b-red' : b.rows.length ? 'b-blue' : 'b-grey'}">${b.rows.length ? b.rows.length + ' booked' : 'free'}${b.rows.length > cfg.slotCapacity ? ' — over capacity!' : ''}</span>
        </div>
        ${b.rows.length ? `<div class="card" style="padding-top:2px; padding-bottom:2px; margin-bottom:10px">
          ${b.rows.map(s => row(s, `<span class="vclock">${esc(s.a.time)}</span>`, s.a)).join('')}</div>` : ''}`).join('')}
      ${unscheduled.length ? `<h2>Booked, no time set (${unscheduled.length})</h2><div class="card" style="padding-top:2px; padding-bottom:2px">
        ${unscheduled.map(s => row(s, `<span class="badge b-amber">No time</span>`, s.a)).join('')}</div>` : ''}
      ${notBooked.length ? `<h2>Not booked in yet (${notBooked.length})</h2><div class="card" style="padding-top:2px; padding-bottom:2px">
        ${notBooked.map(r => `
          <div class="vrow" onclick="App.go('#/customer/${r.c.id}')">
            <div class="vtime"><span class="badge b-amber">No slot</span></div>
            <div style="flex:1"><span class="cname">${esc(r.c.name)}</span>${r.c.daughterName ? ` <span class="small muted">for ${esc(r.c.daughterName)}</span>` : ''}
              <br><span class="small muted">${r.dress ? esc(r.dress.title) : ''}</span></div>
            <div>${UI.eventBadge(r.o.eventHotel).split('<br>')[0]}</div>
          </div>`).join('')}</div>` : ''}`;
  } else {
    const booked = allRows.filter(r => r.upcoming).sort((a, b) => key(a) < key(b) ? -1 : 1);
    const noAppt = allRows.filter(r => !r.upcoming && !r.last).sort((a, b) => (a.o.eventDate || '9999') < (b.o.eventDate || '9999') ? -1 : 1);

    const venueArg = encodeURIComponent(v.venue).replace(/'/g, '%27');
    body = `
      ${dayChips.length ? `<div class="card" style="margin-bottom:16px; padding-top:12px; padding-bottom:8px">
        <h2 style="margin-top:0; margin-bottom:4px">🖨 Print event sheets</h2>
        <p class="small muted" style="margin:0 0 4px">Everything for the day in one go — an A4 customer sheet for every customer booked at this venue on that date, plus the staff run sheet.</p>
        ${dayChips.map(dc => `
          <div class="flex" style="padding:9px 0; border-top:1px solid var(--line); flex-wrap:wrap; align-items:center">
            <b>${esc(dc.label)}</b>
            <span class="small muted">${dc.count} customer${dc.count === 1 ? '' : 's'}</span>
            <span style="flex:1"></span>
            <button class="small primary" onclick="Actions.printCustomerSheets('${venueArg}','${dc.date}')">🖨 Customer sheets (${dc.count})</button>
            <button class="small" onclick="Actions.printRunSheet('${venueArg}','${dc.date}')">🖨 Staff run sheet</button>
          </div>`).join('')}
      </div>` : ''}
      ${booked.length ? `<h2>Coming in (${booked.length})</h2><div class="card" style="padding-top:6px; padding-bottom:6px">
        ${booked.map(r => row(r, `<b>${fmtWd(r.upcoming.appointmentAt)}</b><br><span class="vclock">${esc(r.upcoming.time || '—')}</span>`, r.upcoming)).join('')}</div>` : ''}
      ${noAppt.length ? `<h2>No appointment booked (${noAppt.length})</h2><div class="card" style="padding-top:6px; padding-bottom:6px">
        ${noAppt.map(r => row(r, `<span class="badge b-amber">Not booked</span>`)).join('')}</div>` : ''}
      ${visited.length ? `<h2>Already visited (${visited.length})</h2><div class="card" style="padding-top:6px; padding-bottom:6px">

  }
  return `

    <p class="sub">${v.nextDate ? 'Next event <b>' + fmtWd(v.nextDate) + '</b> · ' : ''}${v.orders.length} customer${v.orders.length === 1 ? '' : 's'} · slot times from Appointly, in time order.</p>
    <div class="chips">
      <button class="chip ${!venueDayFilter ? 'on' : ''}" onclick="venueDayFilter=''; App.route()">All customers (${allRows.length})</button>
      ${dayChips.map(dc => `<button class="chip ${venueDayFilter === dc.date ? 'on' : ''}" onclick="venueDayFilter='${dc.date}'; App.route()">${esc(dc.label)} (${dc.count})</button>`).join('')}
    </div>
    ${body}`;
};

Pages.customerDetail = (id) => {
  const c = Domain.customer(id);
  if (!c) return '<h1>Customer not found</h1>';
  const orders = Domain.ordersOf(c.id).sort((a, b) => a.createdAt < b.createdAt ? 1 : -1);
  return `
    <p><a class="plain" href="#/customers">← Customers</a></p>
