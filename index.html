<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elva Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elva Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#453D35">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#685D54;color:#1B1B1B;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{background:#FFFDF7;border:1px solid rgba(27,27,27,.2);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:#9CC9FF;box-shadow:0 0 0 3px rgba(156,201,255,.3)}
textarea{resize:vertical;min-height:70px}
::placeholder{color:#857B6C}

/* app shell: sidebar + main */
.app{display:flex;min-height:100vh}
.side{width:220px;flex:none;background:#453D35;color:#FBF7F4;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px}
.mark{display:flex;align-items:center;gap:10px}
.mark svg{width:32px;height:32px}
.mark b{font-family:Georgia,serif;font-weight:400;font-size:15px;letter-spacing:.5px}
.mark small{display:block;font-size:8px;letter-spacing:2px;color:#EFEAE2;opacity:.75}
.side-title{font-family:Georgia,serif;font-size:19px;color:#EFEAE2;border-bottom:1px solid rgba(251,247,244,.2);padding-bottom:12px}
.side-title i{font-style:italic}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:9px;font-size:13px;color:#EFEAE2}
.nav button span{width:16px;text-align:center;opacity:.7;font-size:12px}
.nav button:hover{background:rgba(156,201,255,.3);color:#FBF7F4}
.nav button.on{background:#9CC9FF;color:#1B1B1B}
.nav button.on span{opacity:1}
.nav .more{font-size:10px;letter-spacing:1.5px;color:#EFEAE2;opacity:.6;margin:12px 10px 4px}
.qc{background:#9CC9FF;color:#1B1B1B;font-weight:700;border-radius:999px;padding:11px 14px;font-size:13px}
.qc.sm{width:34px;height:34px;padding:0;font-size:18px}
.main{flex:1;min-width:0;background:#685D54;overflow-x:hidden}
.topbar{display:none;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:#453D35;color:#FBF7F4;position:sticky;top:0;z-index:40}
.topbar .serif{font-size:17px;flex:1}
.burger{color:#FBF7F4;font-size:20px;padding:4px 6px}
.hdr-date{font-family:Georgia,serif;font-size:13px;color:#EFEAE2}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60}
@media(max-width:820px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;transform:translateX(-100%);transition:transform .2s;height:100%}
  body.nav-open .side{transform:none}body.nav-open .scrim{display:block}
  .topbar{display:flex}
}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
.page{display:none}.page.on{display:block}
.title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px;color:#FBF7F4}
.title h1{font-size:28px}
.title .sub{color:#EFEAE2;font-size:13px}
.title .spacer{flex:1}
.pill{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;color:#FBF7F4;border:1px solid rgba(251,247,244,.35)}
.pill:hover{background:rgba(156,201,255,.3)}
.pill.on{background:#9CC9FF;color:#1B1B1B;border-color:#9CC9FF}
.seg{display:inline-flex;background:#F4F0E4;border-radius:999px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:#372F28}
.seg button.on{background:#9CC9FF;color:#1B1B1B}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g31{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g13{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.grid>*{min-width:0}.card{min-width:0}
@media(max-width:820px){.g2,.g3,.g31,.g13{grid-template-columns:1fr}}
.big{font-family:Georgia,serif;font-size:34px;line-height:1;color:#1B1B1B}
.big small{font-size:14px;color:#857B6C;margin-left:4px}
.eyebrow{font-size:10px;letter-spacing:1.5px;color:#857B6C;margin-bottom:6px}
.onegoal{display:flex;align-items:center;gap:12px;background:#F4F0E4;border-left:5px solid #9CC9FF;border-radius:12px;padding:12px 16px;margin-bottom:14px}
.onegoal input{background:transparent;border:none;padding:4px 0;font-family:Georgia,serif;font-size:18px}
.onegoal input:focus{box-shadow:none}
.star{width:30px;height:30px;border-radius:50%;border:1.5px solid #9CC9FF;display:flex;align-items:center;justify-content:center;color:#372F28;flex:none;cursor:pointer}
.star.on{background:#4F7A4A;border-color:#4F7A4A;color:#fff}
/* timetable grid */
.ttg{display:grid;grid-template-columns:40px repeat(5,minmax(0,1fr));gap:4px;position:relative}
.ttg .dh{font-size:11px;color:#857B6C;text-align:center;padding-bottom:4px}
.ttg .dh.today{color:#1B1B1B;font-weight:700}
.ttg .hl{font-size:10px;color:#857B6C;text-align:right;padding-right:4px;height:44px}
.ttg .dc{position:relative;background:#FAF7EE;border-radius:8px}
.ttg .dc div.line{height:44px;border-top:1px solid rgba(27,27,27,.08)}
.blk{position:absolute;left:3px;right:3px;border-radius:7px;padding:5px 7px;font-size:11px;line-height:1.25;overflow:hidden;border-left:4px solid;color:#1B1B1B;cursor:pointer}
.blk b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{color:#372F28;font-size:10px}
@media(max-width:820px){.ttg{grid-template-columns:40px 1fr}.ttg .dh,.ttg .dc{display:none}.ttg .dh.show,.ttg .dc.show{display:block}}
/* cards */
.card{background:#F4F0E4;border:1px solid rgba(27,27,27,.2);border-radius:14px;padding:14px 16px}
.card h2{font-size:18px;margin-bottom:10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h2 small{font-family:Arial,sans-serif;font-size:12px;color:#857B6C;font-weight:400}
.card h2 .r{margin-left:auto;font-family:Arial,sans-serif;font-size:12px}
.card h3{font-size:15px;margin:8px 0 6px;color:#372F28}
.inner{background:#E6E0CF;border-radius:10px;padding:10px 12px}
.row{background:#FAF7EE;border-radius:8px;padding:7px 10px;display:flex;align-items:center;gap:8px;margin-bottom:5px;min-height:34px}
.row.done{opacity:.55}.row.done .nm{text-decoration:line-through}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:11px;color:#857B6C;white-space:nowrap}
.muted{color:#857B6C;font-size:12px}
.empty{color:#857B6C;font-size:12px;padding:10px 4px;text-align:center}
.link{color:#372F28;text-decoration:underline;font-size:12px}
.btn{background:#372F28;color:#FBF7F4;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700}
.btn.sky{background:#9CC9FF;color:#1B1B1B}
.btn.ghost{background:transparent;border:1px solid rgba(27,27,27,.25);color:#372F28}
.btn.sm{padding:5px 10px;font-size:11px}
.btn.danger{background:#B23A2E}
.ib{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#857B6C;font-size:13px;flex:none}
.ib:hover{background:rgba(156,201,255,.3);color:#1B1B1B}

/* task bits */
.tick{width:18px;height:18px;border:1.5px solid #857B6C;border-radius:5px;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:#FFFDF7}
.tick.on{background:#4F7A4A;border-color:#4F7A4A;color:#fff}
.pb{font-size:10px;font-weight:700;background:#9CC9FF;color:#1B1B1B;padding:1px 6px;border-radius:999px;flex:none}
.pb.p2{background:rgba(156,201,255,.6)}.pb.p3{background:rgba(156,201,255,.3)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.due{font-size:10px;padding:1px 6px;border-radius:999px;background:#E6E0CF;color:#372F28;flex:none}
.due.over{background:#B23A2E;color:#fff}.due.soon{background:#C8742B;color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:999px;background:#E6E0CF;color:#372F28;cursor:pointer;border:1px solid transparent}
.chip.on{background:#9CC9FF;color:#1B1B1B}
.handle{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.dragghost{position:fixed;z-index:9999;pointer-events:none;background:#FFFDF7;border:1px solid #9CC9FF;box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:8px;padding:6px 10px;font-size:12px;max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
[data-drop].over{outline:2px solid #9CC9FF;outline-offset:-2px;background:rgba(156,201,255,.3)!important}

/* Apple-style calendar */
body.pg-calendar .wrap{max-width:none}
body.calfull .side,body.calfull .topbar{display:none}
body.calfull .wrap{padding:8px 8px 40px}
.calapp{--line:rgba(27,27,27,.1);--red:#E5484D;background:#FFFDF7;border:1px solid rgba(27,27,27,.18);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;color:#1B1B1B}
.calapp.week,.calapp.day{height:calc(100vh - 36px)}
body.calfull .calapp.week,body.calfull .calapp.day{height:calc(100vh - 16px)}
.caltb{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#F4F0E4;flex-wrap:wrap}
.caltb .spacer{flex:1}
.calh{font-family:Georgia,serif;font-size:24px;color:#372F28;white-space:nowrap}.calh b{font-weight:700}
.calsubt{font-family:Arial,sans-serif;font-size:13px;color:#857B6C;margin-left:10px}
.calib{width:32px;height:32px;border-radius:8px;font-size:15px;color:#372F28;display:inline-flex;align-items:center;justify-content:center}
.calib:hover{background:rgba(27,27,27,.07)}.calib.plus{font-size:18px}
.calseg{display:inline-flex;background:rgba(27,27,27,.07);border-radius:9px;padding:2px}
.calseg button{padding:5px 14px;border-radius:7px;font-size:12px;font-weight:700;color:#372F28}
.calseg button.on{background:#FFFDF7;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.calnav{display:inline-flex;border:1px solid rgba(27,27,27,.15);border-radius:9px;overflow:hidden}
.calnav button{padding:5px 10px;font-size:12px;font-weight:700;color:#372F28}.calnav button:hover{background:rgba(27,27,27,.07)}
.calnav button+button{border-left:1px solid rgba(27,27,27,.12)}
.calbody{display:flex;flex:1;min-height:0}
.calmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.calside{width:210px;flex:none;border-right:1px solid var(--line);padding:12px 10px;overflow:auto;background:#FAF7EE}
.calside h4{font-size:11px;color:#857B6C;font-weight:700;margin:14px 6px 4px;letter-spacing:.3px}
.calrow{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.calrow:hover{background:rgba(27,27,27,.05)}.calrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{width:15px;height:15px;border-radius:4px;border:2px solid var(--c);flex:none;font-size:10px;line-height:11px;text-align:center;color:#fff;font-weight:700}
.cb.on{background:var(--c)}
.mini .minih{display:flex;align-items:center;gap:4px;font-size:13px;padding:0 4px 6px}.mini .minih .spacer{flex:1}
.mini .minih button{width:22px;height:22px;border-radius:6px;color:#372F28}.mini .minih button:hover{background:rgba(27,27,27,.07)}
.minig{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;row-gap:1px}
.minig span{color:#857B6C;font-size:10px;padding:2px 0}
.minig button{height:24px;border-radius:50%;font-size:11px;color:#1B1B1B;position:relative;aspect-ratio:1;margin:0 auto;width:24px}
.minig button.out{color:#B5AC9C}.minig button:hover{background:rgba(27,27,27,.07)}
.minig button.sel{background:rgba(156,201,255,.45)}
.minig button.today{background:var(--red);color:#fff;font-weight:700}
.minig button.has:not(.today)::after{content:'';position:absolute;bottom:1px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#857B6C}
/* month */
.mhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.mhead div{font-size:12px;color:#857B6C;text-align:right;padding:6px 8px}
.mgrid2{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex:1}
.mc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 4px 6px;min-width:0;cursor:default}
.mc:nth-child(7n){border-right:none}.mc.we{background:#FAF7EE}.mc.out .num{color:#B5AC9C}.mc.out .mev{opacity:.55}
.mcd{display:flex;justify-content:flex-end;margin-bottom:2px;cursor:pointer}
.mcd .num{font-size:13px;padding:1px 6px;border-radius:999px;min-width:24px;text-align:center;color:#372F28}
.mc.today .num{background:var(--red);color:#fff;font-weight:700}
.mev{display:flex;align-items:center;gap:4px;font-size:11px;line-height:1.3;padding:1px 4px;border-radius:4px;margin-bottom:1px;cursor:pointer;min-width:0}
.mev:hover{background:rgba(27,27,27,.06)}
.mev .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mev .mtime{color:#857B6C;font-size:10px;flex:none}
.mev.fill{background:#E6E0CF;background:color-mix(in srgb,var(--c) 26%,#FFFDF7);border-left:3px solid var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-weight:600}
.mev.done{opacity:.5;text-decoration:line-through}
/* week/day time grid */
.tg{display:flex;flex-direction:column;flex:1;min-height:0}
.tghead,.tgallrow,.tgbody{display:grid;grid-template-columns:56px repeat(var(--n),minmax(0,1fr))}
.tghead{border-bottom:1px solid var(--line)}
.tgdh{padding:6px 8px;display:flex;align-items:center;gap:6px;justify-content:center;cursor:pointer;font-size:13px;color:#372F28}
.tgdh .wd{color:#857B6C}.tgdh .num{font-size:18px;padding:0 6px;border-radius:999px;min-width:30px;text-align:center}
.tgdh.today .num{background:var(--red);color:#fff;font-weight:700}.tgdh.today .wd{color:var(--red);font-weight:700}
.tgallrow{border-bottom:2px solid var(--line);max-height:120px;overflow:auto}
.tggut.lbl{font-size:10px;color:#857B6C;text-align:right;padding:5px 6px}
.tgad{border-left:1px solid var(--line);padding:3px 2px;min-height:26px;min-width:0}
.tgscroll{flex:1;overflow-y:auto;min-height:0}
.tgbody{position:relative}
.tggut{position:relative}
.tggh{height:46px;position:relative}
.tggh{font-size:10px;color:#857B6C;text-align:right;padding-right:8px;transform:translateY(-7px)}
.tgnowl{position:absolute;right:4px;transform:translateY(-50%);font-size:10px;font-weight:700;color:var(--red);background:#FFFDF7}
.tgcol{position:relative;border-left:1px solid var(--line)}
.tgcol.today{background:rgba(229,72,77,.03)}
.tgslot{height:46px;border-top:1px solid var(--line);cursor:pointer}
.tgslot:hover{background:rgba(156,201,255,.12)}
.tgev{position:absolute;overflow:hidden;border-radius:5px;padding:2px 6px;font-size:11px;line-height:1.25;cursor:pointer;z-index:2;
  background:#E6E0CF;background:color-mix(in srgb,var(--c) 24%,#FFFDF7);border-left:3px solid var(--c);color:#1B1B1B;display:flex;flex-direction:column}
.tgev:hover{z-index:4;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tgev b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.tgev span{color:#5c544a;font-size:10px}
.tgev.short{flex-direction:row;gap:6px;align-items:center;white-space:nowrap}
.tgev.short b{flex:0 1 auto;min-width:0}.tgev.short span{flex:0 100 auto;min-width:0;overflow:hidden}
.tgev.done{opacity:.5}.tgev.done b{text-decoration:line-through}
.tgnow{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3;pointer-events:none}
.tgnow::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
@media(max-width:820px){
  .calside{display:none}.calh{font-size:19px}.caltb{padding:8px}
  .calapp.week .tg{overflow-x:auto}.calapp.week .tghead,.calapp.week .tgallrow,.calapp.week .tgscroll{min-width:760px}
  .calapp.week,.calapp.day{height:calc(100vh - 90px)}
  .mgrid2{grid-template-rows:none!important;grid-auto-rows:minmax(70px,auto)}.mev{font-size:9px}.mev .mtime{display:none}
}


.tgev,.mev{user-select:none;-webkit-user-select:none}
.tgev.ed{cursor:grab}.mev.ed{cursor:grab}
.tgev.sel{z-index:6;box-shadow:0 0 0 2px var(--c),0 4px 14px rgba(0,0,0,.2);touch-action:none}
.tgev.lifted{transform:scale(1.03);transition:transform .12s}
.tgev,.mev.ed{-webkit-touch-callout:none}
.tgev.dragging{z-index:8;opacity:.9;cursor:grabbing;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.tgev .rz{position:absolute;left:0;right:0;height:7px;cursor:ns-resize;z-index:2}
.tgev .rz-top{top:0}.tgev .rz-bot{bottom:0}
.tgev.sel .rz::after{content:'';position:absolute;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#FFFDF7;border:2px solid var(--c)}
.tgev.sel .rz-top::after{top:-5px}.tgev.sel .rz-bot::after{bottom:-5px}
.evact{position:absolute;top:9px;right:2px;display:flex;gap:2px;z-index:3}
.evact button{width:22px;height:22px;border-radius:6px;background:#FFFDF7;box-shadow:0 1px 3px rgba(0,0,0,.2);font-size:11px;line-height:22px;padding:0}
.evact button:hover{background:#fff}
.mc.over,.tgad.over{background:rgba(156,201,255,.3)!important}
.calapp.homeday{height:640px;border-radius:10px;margin-top:4px}
.homeday .tghead{display:none}
@media(max-width:820px){.calapp.homeday{height:520px}}
.calapp{overscroll-behavior-x:none}
.calmain.slide-l{animation:calSlideL .22s ease-out}.calmain.slide-r{animation:calSlideR .22s ease-out}
@keyframes calSlideL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes calSlideR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.ttick{display:inline-flex;align-items:center;justify-content:center;width:12px;height:12px;border:1.5px solid var(--c,#857B6C);border-radius:3px;margin-right:4px;font-size:9px;line-height:1;vertical-align:-1px;cursor:pointer;background:#FFFDF7;flex:none;color:#fff}
.ttick.on{background:var(--c,#857B6C)}
.daily{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.daily>div{background:#F4F0E4;border-radius:12px;padding:12px 16px;border-left:5px solid #C9A63F}
.daily .sug{border-left-color:#9CC9FF}
.daily .afft{font-family:Georgia,serif;font-size:17px;font-style:italic;color:#372F28}
.daily .sugt{font-family:Georgia,serif;font-size:17px;color:#1B1B1B}
.daily>.muted,.daily>.eyebrow{grid-column:1/-1}
@media(max-width:820px){.daily{grid-template-columns:1fr}}
.calside.tasks{width:280px}
.caltabs{display:flex;background:rgba(27,27,27,.07);border-radius:9px;padding:2px;margin-bottom:10px}
.caltabs button{flex:1;padding:5px 0;border-radius:7px;font-size:12px;font-weight:700;color:#372F28}
.caltabs button.on{background:#FFFDF7;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bank2{min-height:70%;border-radius:8px}
.bank2>input{margin-bottom:8px}

<script>

});
let S=DEF();
let gcalEvents=[];
let acalEvents=[],acalRange={from:'',to:''},acalBusy=false;

const SEED_MODULES=[   // UCD Autumn 2026 timetable (updated 6 Oct)
  {code:'ECON30180',name:'Industrial Economics',col:'#4F7A4A',sessions:[{day:1,start:'10:00',end:'10:50',room:''},{day:3,start:'10:00',end:'10:50',room:''},{day:3,start:'13:00',end:'13:50',room:''}]},
  {code:'IS30020',name:'Web Publishing',col:'#3A7CA5',sessions:[{day:2,start:'11:00',end:'12:50',room:'Newman Building NTh-1-ART'}]},
  {code:'ECON20040',name:'Statistics for Economists',col:'#C8742B',sessions:[{day:1,start:'15:00',end:'15:50',room:''},{day:3,start:'11:00',end:'11:50',room:''},{day:4,start:'14:00',end:'14:50',room:'Newman Building Th.-Q-ART'}]},
  {code:'ECON30100',name:'Health Economics',col:'#2C3E5C',sessions:[{day:3,start:'12:00',end:'12:50',room:''},{day:4,start:'10:00',end:'10:50',room:''}]},
  {code:'ECON30270',name:'Behavioural Economics',col:'#8A5A9E',sessions:[{day:3,start:'16:00',end:'17:50',room:'Newman Building Th.-P-ART'}]},
  {code:'IS30510',name:'Deep Tech',col:'#B23A2E',sessions:[{day:5,start:'13:00',end:'14:50',room:"O'Connor Centre for Learning L0.17-LEA"}]},
];
const TT_VER='2026-autumn-oct6';

// ── UTILS ──
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;   // local, never UTC
const mk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const qk=d=>`${d.getFullYear()}-Q${Math.floor(d.getMonth()/3)+1}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d||1);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);const w=x.getDay();x.setDate(x.getDate()-(w===0?6:w-1));return x;};
const todayKey=()=>dk(new Date());
const fmtD=(d,o)=>d.toLocaleDateString('en-IE',o||{weekday:'long',day:'numeric',month:'long'});
const daysUntil=k=>Math.round((fromKey(k)-fromKey(todayKey()))/864e5);
const uid=()=>'t'+(S.nid++);
const cat=id=>S.cats.find(c=>c.id===id)||{id,label:id,col:'#857B6C'};
const task=id=>S.tasks.find(t=>t.id===id);
const inTerm=k=>k>=S.term.start&&k<=S.term.end;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);}
function dueChip(k){if(!k)return'';const n=daysUntil(k);const c=n<0?'over':n<=3?'soon':'';const t=n<0?`${-n}d over`:n===0?'today':n===1?'tomorrow':`${n}d`;return`<span class="due ${c}">${t}</span>`;}

function save(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    try{
      const r=await fetch(`${SUPABASE_URL}/rest/v1/hub_state`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Prefer':'resolution=merge-duplicates,return=minimal'},

}

  try{const r=await fetch(`${SUPABASE_URL}/rest/v1/hub_state?id=eq.${ROW_ID}&select=state,updated_at`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
    if(r.ok){const rows=await r.json();if(rows[0]&&rows[0].state)remote=rows[0].state;}}catch(e){}
  try{const raw=localStorage.getItem(LS_KEY);if(raw)local=JSON.parse(raw);}catch(e){}
  const pick=remote||local;
  if(pick)S=Object.assign(DEF(),pick);
  // seed modules once
  if(!S.modsSeeded&&S.modules.length===0){
    S.modules=SEED_MODULES.map(m=>({id:uid(),code:m.code,name:m.name,col:m.col,sessions:m.sessions.map(s=>({...s})),assessments:[]}));

  }

  if(S.ttVer!==TT_VER){
    SEED_MODULES.forEach(sm=>{const m=S.modules.find(x=>x.code===sm.code);
      if(m){m.sessions=sm.sessions.map(x=>({...x}));if(!m.name)m.name=sm.name;}
      else S.modules.push({id:uid(),code:sm.code,name:sm.name,col:sm.col,sessions:sm.sessions.map(x=>({...x})),assessments:[]});});
    S.modules=S.modules.filter(m=>SEED_MODULES.some(sm=>sm.code===m.code)||(m.assessments||[]).length).map(m=>SEED_MODULES.some(sm=>sm.code===m.code)?m:{...m,sessions:[]});
    S.ttVer=TT_VER;save();
  }
  try{const c=localStorage.getItem('elva_gcal_events');if(c)gcalEvents=JSON.parse(c);}catch(e){}
  try{const r=await fetch(`${SUPABASE_URL}/rest/v1/hub_state?id=eq.ggc-daily&select=state`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});if(r.ok){const rows=await r.json();if(rows[0]&&rows[0].state)remoteDaily=rows[0].state;}}catch(e){}
  if(!S.acal)S.acal={on:false,cals:[],def:''};
  if(!S.calAppleOnly){S.calHide={task:true,class:true,assess:true,invoice:true,gcal:true};S.calAppleOnly=true;save();}
  if(!S.calTasksOn){S.calHide=Object.assign({},S.calHide,{task:false});S.calTasksOn=true;save();}
  try{const c=JSON.parse(localStorage.getItem('elva_acal_events')||'null');if(c){acalEvents=c.ev;acalRange=c.range;}}catch(e){}
}

// ── EVENTS: one source of truth ──
function getEvents(k){
  const d=fromKey(k),wd=d.getDay()===0?7:d.getDay();
  const out=[];
  S.tasks.filter(t=>t.day===k).forEach(t=>out.push({id:t.id,type:'task',title:t.name,time:t.time||'',end:t.time&&t.end?t.end:'',col:cat(t.cat).col,done:t.done,p:t.p,ref:t}));
  if(inTerm(k))S.modules.forEach(m=>m.sessions.filter(s=>s.day===wd).forEach(s=>out.push({id:m.id+s.start,type:'class',title:m.name,time:s.start,end:s.end,col:m.col,room:s.room,ref:m})));
  S.modules.forEach(m=>m.assessments.filter(a=>a.due===k).forEach(a=>out.push({id:a.id,type:'assess',title:`${a.title} due`,sub:m.code,time:'',col:m.col,done:a.done,ref:a,mod:m})));
  S.suede.invoices.filter(i=>i.due===k&&!i.paid).forEach(i=>out.push({id:i.id,type:'invoice',title:`Invoice: ${i.client}`,time:'',col:'#C9A63F',ref:i}));
  gcalEvents.forEach(e=>{const s=e.start.slice(0,10);if(s===k)out.push({id:e.id,type:'gcal',title:e.title,time:e.allDay?'':e.start.slice(11,16),col:'#857B6C'});});
  if(S.acal.on)acalOn(k).forEach(e=>out.push({id:e.id,type:'acal',title:e.title,time:e.allDay?'':e.time,end:e.allDay?'':e.endTime,col:e.col,room:e.location,ref:e}));
  return out.sort((a,b)=>(a.time||'00:00')<(b.time||'00:00')?-1:1).sort((a,b)=>(!a.time&&b.time)?-1:(a.time&&!b.time)?1:0);
}
function evHtml(e,cls){
  const tick=e.type==='task'?`<span class="tick ${e.done?'on':''}" onclick="event.stopPropagation();toggleTask('${e.id}')">${e.done?'✓':''}</span>`:e.type==='assess'?`<span class="tick ${e.done?'on':''}" onclick="event.stopPropagation();toggleAssess('${e.mod.id}','${e.id}')">${e.done?'✓':''}</span>`:'';
  const drag=e.type==='task'?`data-drag="task:${e.id}" class="${cls} handle ${e.done?'done':''}"`:`class="${cls} ${e.done?'done':''}"`;
  const click=e.type==='task'?`onclick="openTask('${e.id}')"`:e.type==='acal'?`onclick="event.stopPropagation();openAcal('${e.id}')"`:e.type==='class'?`onclick="nav('timetable')"`:e.type==='assess'?`onclick="openAssess('${e.mod.id}','${e.id}')"`:'';
  return`<div ${drag} style="border-left-color:${e.col}" ${click}>${tick}${e.time?`<span class="t">${e.time}${e.end?'–'+e.end:''}</span>`:''}<span class="nm">${esc(e.title)}${e.room?` <span class="muted">${esc(e.room)}</span>`:''}</span>${e.p?`<span class="pb p${e.p}">P${e.p}</span>`:''}</div>`;
}

function addTask(o){const t={id:uid(),name:o.name.trim(),cat:o.cat||'life',grp:o.grp||'',p:o.p||0,due:o.due||'',day:o.day||'',time:o.time||'',note:o.note||'',done:false,doneAt:'',created:new Date().toISOString()};S.tasks.push(t);save();return t;}

function moveTask(id,day,time){const t=task(id);if(!t)return;t.day=day||'';if(time!==undefined){if(time&&t.end&&t.time){const d=mins(t.end)-mins(t.time);t.end=d>0?hm(Math.min(mins(time)+d,1439)):'';}else if(!time)t.end='';t.time=time;}if(day&&!t.due)t.due=day;save();render();}

// ── DRAG (pointer events: mouse, trackpad and touch take the same path) ──
let drag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-drag]');if(!h||e.target.closest('input,textarea,select,.tick,.ib,button'))return;
  drag={el:h,data:h.dataset.drag,x:e.clientX,y:e.clientY,ghost:null,active:false,id:e.pointerId};
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.active){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;drag.active=true;
    const g=document.createElement('div');g.className='dragghost';g.textContent=drag.el.textContent.trim().slice(0,40);document.body.appendChild(g);drag.ghost=g;drag.el.style.opacity='.4';}
  e.preventDefault();
  drag.ghost.style.left=(e.clientX+10)+'px';drag.ghost.style.top=(e.clientY+10)+'px';
  document.querySelectorAll('[data-drop].over').forEach(x=>x.classList.remove('over'));
  const z=zoneAt(e.clientX,e.clientY);if(z)z.classList.add('over');
},{passive:false});
document.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;
  if(!d.active)return;   // a tap: let the click handler open the editor
  d.ghost.remove();d.el.style.opacity='';
  const z=zoneAt(e.clientX,e.clientY);document.querySelectorAll('[data-drop].over').forEach(x=>x.classList.remove('over'));
  if(z){let zone=z.dataset.drop;if(zone.startsWith('hour:')){const r=z.getBoundingClientRect();zone+=':'+pad(Math.min(45,Math.floor((e.clientY-r.top)/r.height*4)*15));}handleDrop(d.data,zone);}
  suppressClick=true;setTimeout(()=>suppressClick=false,300);
});
document.addEventListener('pointercancel',()=>{if(drag&&drag.ghost){drag.ghost.remove();drag.el.style.opacity='';}drag=null;});
let suppressClick=false;
document.addEventListener('click',e=>{if(suppressClick){e.stopPropagation();e.preventDefault();}},true);
function zoneAt(x,y){if(drag&&drag.ghost)drag.ghost.style.display='none';const el=document.elementFromPoint(x,y);if(drag&&drag.ghost)drag.ghost.style.display='';if(!el)return null;
  const col=el.closest('.tgcol');if(col){const sl=col.querySelectorAll('.tgslot'),i=Math.floor((y-col.getBoundingClientRect().top)/CAL_H);return sl[Math.max(0,Math.min(23,i))]||null;} // over an event: use the hour underneath
  return el.closest('[data-drop]');}
function handleDrop(data,zone){
  const [kind,id]=data.split(':');const z=zone.split(':');
  if(kind==='task'){
    if(['day','hour','untime'].includes(z[0])&&page==='calendar'&&(S.calHide||{}).task&&S.acal.on){moveTask(id,z[1],z[0]==='hour'?z[2]+':'+(z[3]||'00'):z[0]==='untime'?'':undefined);taskToAcal(id);}
    else if(z[0]==='day')moveTask(id,z[1]);
    else if(z[0]==='hour')moveTask(id,z[1],z[2]+':'+(z[3]||'00'));
    else if(z[0]==='pri')setPriTask(z.slice(1,-1).join(':'),+z[z.length-1],id);
    else if(z[0]==='bank')moveTask(id,'','');
    else if(z[0]==='grp'){const t=task(id);if(t){t.cat=z[1];t.grp=z[2]||'';save();render();}}
    else if(z[0]==='untime')moveTask(id,z[1],'');
  }else if(kind==='client'){
    if(z[0]==='stage'){const c=S.suede.clients.find(c=>c.id===id);if(c){c.stage=z[1];save();render();}}
  }
}

// ── MONTH (landing) ──
function rMonth(){

  const mon=cur.toLocaleDateString('en-IE',{month:'long',year:'numeric'});
  const openT=S.tasks.filter(t=>!t.done&&!t.day).length;
  return`<div class="grid g2" style="margin-top:14px">

      <input style="margin-top:8px" placeholder="Add a habit to track" onkeydown="if(event.key==='Enter'){addHabit('${m}',this.value)}"></div>
  </div>
  <div class="card" style="margin-top:14px"><h2>Month reflection<small>fill in at the end of ${mon.split(' ')[0]}</small></h2>
    <div class="grid g3"><div class="f"><label>What went well</label><textarea oninput="setRefl('${m}','wins',this.value)">${esc(r.wins)}</textarea></div><div class="f"><label>What was hard</label><textarea oninput="setRefl('${m}','hard',this.value)">${esc(r.hard)}</textarea></div><div class="f"><label>Next month I will</label><textarea oninput="setRefl('${m}','next',this.value)">${esc(r.next)}</textarea></div></div></div>`;

function deadlineList(n){

function delQStep(q,g,s){const G=quarter(q).goals.find(x=>x.id===g);G.steps=G.steps.filter(x=>x.id!==s);save();render();}

    if(c==='study')(S.modules||[]).filter(m=>m.sessions.length||m.assessments.length).forEach(m=>S.subs[c].push({id:'g'+(S.nid++),name:m.name}));
    if(S.subs[c].length)save();}

const subName=(c,g)=>((S.subs&&S.subs[c])||[]).find(x=>x.id===g)?.name||'';

function delSub(c,g){const s=subs(c).find(x=>x.id===g);if(!s)return;const n=S.tasks.filter(t=>t.cat===c&&t.grp===g&&!t.done).length;

function moveSub(c,g,dir){const a=subs(c),i=a.findIndex(x=>x.id===g),j=i+dir;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render();}
function subTaskRow(t){return`<div class="row handle ${t.day?'planned':''}" data-drag="task:${t.id}"><span class="tick" onclick="toggleTask('${t.id}')"></span><span class="nm" onclick="openTask('${t.id}')">${esc(t.name)}</span>${t.p?`<span class="pb p${t.p}">P${t.p}</span>`:''}${t.day?`<span class="meta" onclick="openDay('${t.day}')">${fmtD(fromKey(t.day),{weekday:'short',day:'numeric',month:'short'})}${t.time?' '+t.time:''}</span>`:''}${dueChip(t.due)}</div>`;}

// lay out overlapping timed events side by side
function layoutDay(list){
  const ev=list.map(e=>{const s=mins(e.time);let en=e.end&&e.end!==''?mins(e.end):s+60;if(e.end==='24:00'||(e.end&&en<=s&&e.type==='acal'))en=24*60;if(en<=s)en=s+30;return{e,s,en:Math.min(en,24*60)};}).sort((a,b)=>a.s-b.s||b.en-a.en);
  let cluster=[],cols=[],end=-1;
  const close=()=>{cluster.forEach(x=>x.n=cols.length);cluster=[];cols=[];};
  for(const x of ev){if(x.s>=end&&cluster.length)close();let c=cols.findIndex(t=>t<=x.s);if(c<0){c=cols.length;cols.push(0);}cols[c]=x.en;x.c=c;cluster.push(x);end=Math.max(end,x.en);}
  close();return ev;
}

// Save a new time and/or day. s/en in minutes (en may be 1440 = midnight); omit for a date-only move.
async function calCommit(key,day,s,en){
  const f=calFind(key);if(!f)return render();
  if(f.type==='task'){const t=f.t;t.day=day;if(!t.due)t.due=day;if(s!==undefined){t.time=hm(s);t.end=en>=1440?'23:59':hm(en);}save();render();return;}
  if(f.type!=='acal')return render();
  const a=f.a,old={...a};
  let start,end;
  if(s!==undefined){a.day=day;a.time=hm(s);a.endDay=en>=1440?dk(addDays(fromKey(day),1)):day;a.endTime=hm(en%1440);
    start=new Date(`${day}T${a.time}`).toISOString();end=new Date(`${a.endDay}T${a.endTime}`).toISOString();if(en>=1440)a.endDay=day,a.endTime='24:00';}
  else{const diff=Math.round((fromKey(day)-fromKey(a.day))/864e5);if(!diff)return render();a.day=day;a.endDay=dk(addDays(fromKey(old.endDay),diff));
    if(a.allDay){start=a.day;end=dk(addDays(fromKey(a.endDay),1));}
    else{start=new Date(`${a.day}T${a.time}`).toISOString();end=new Date(`${a.endDay}T${a.endTime==='24:00'?'23:59':a.endTime}`).toISOString();}}

}

const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let pushSub=null;
function nset(){S.notify=Object.assign({on:false,subs:[],morning:'08:00',midday:'13:00',evening:'21:00',before:15,morningOn:true,middayOn:true,eveningOn:true,tasksOn:true,appleOn:false},S.notify||{});return S.notify;}
function deviceName(){const u=navigator.userAgent;return /iPhone/.test(u)?'iPhone':/iPad/.test(u)||isIOS?'iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':/Windows/.test(u)?'Windows':'This device';}
async function pushReg(){if(!('serviceWorker' in navigator))return null;try{return await navigator.serviceWorker.register('sw.js');}catch(e){return null;}}
async function pushInit(){const r=await pushReg();if(r&&r.pushManager){try{pushSub=await r.pushManager.getSubscription();}catch(e){}}if(page==='settings')render();}
async function pushEnable(){
  const n=nset();
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast(isIOS&&!isStandalone?'Add Elva Hub to your Home Screen first':'This browser can’t do notifications');return;}
  if(!acalBase()){toast('Set the Worker URL in Settings → Claude first');return;}
  const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Notifications were not allowed');return;}
  try{
    const r=await pushReg();const key=Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-VAPID_PUBLIC.length%4)%4)),c=>c.charCodeAt(0));
    const sub=(await r.pushManager.getSubscription())||(await r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key}));
    pushSub=sub;const j=sub.toJSON();
    n.subs=n.subs.filter(s=>s.endpoint!==j.endpoint);n.subs.push({endpoint:j.endpoint,keys:j.keys,device:deviceName(),at:new Date().toISOString()});
    n.on=true;save();render();toast('Notifications on for '+deviceName());pushTest();
  }catch(e){toast('Could not turn on notifications: '+e.message);}
}
async function pushTest(){
  const n=nset(),sub=pushSub?pushSub.toJSON():n.subs[n.subs.length-1];if(!sub){toast('Turn notifications on first');return;}
  try{const r=await fetch(acalBase()+'/push/test',{method:'POST',headers:{'Content-Type':'application/json','x-hub-token':S.claude.token},body:JSON.stringify({sub})});const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||('Worker returned '+r.status));toast('Test sent — it should pop up in a few seconds');}
  catch(e){toast(e.message.includes('VAPID')?'Worker needs VAPID_PRIVATE (see Settings → Notifications)':e.message);}
}
async function pushRemove(i){const n=nset(),s=n.subs[i];if(!s)return;if(pushSub&&pushSub.endpoint===s.endpoint){try{await pushSub.unsubscribe();}catch(e){}pushSub=null;}n.subs.splice(i,1);if(!n.subs.length)n.on=false;save();render();}
function notifySettings(){
  const n=nset(),here=pushSub&&n.subs.some(s=>s.endpoint===pushSub.endpoint);
  const row=(key,label,timeKey)=>`<div class="row"><span class="tick ${n[key]!==false?'on':''}" onclick="S.notify.${key}=${n[key]===false};save();render()">${n[key]!==false?'✓':''}</span><span class="nm">${label}</span>${timeKey?`<input type="time" value="${n[timeKey]}" style="width:110px" onchange="S.notify.${timeKey}=this.value;save()">`:''}</div>`;
  return`<div class="card"><h2>Notifications<small>${n.on&&n.subs.length?n.subs.length+' device'+(n.subs.length>1?'s':''):'off'}</small></h2>
    <div class="muted" style="margin-bottom:8px">Sent by your Worker every 15 minutes, even when the Hub is closed.${isIOS&&!isStandalone?' <b>On iPhone: Share → Add to Home Screen, open Elva Hub from there, then turn this on.</b>':''}</div>
    <div class="mact" style="margin:0 0 8px;justify-content:flex-start">${here?'<span class="muted">✓ On for this device</span>':`<button class="btn sky" onclick="pushEnable()">Turn on for this ${deviceName()}</button>`}<button class="btn ghost sm" onclick="pushTest()">Send test</button></div>
    ${row('morningOn','Morning: affirmation + goal of the day','morning')}
    ${row('middayOn','Midday check-in on your top 3','midday')}
    ${row('eveningOn','Evening: plan tomorrow','evening')}
    ${row('tasksOn','Before a timed task')}
    ${row('appleOn','Before Apple Calendar events (your iPhone may already do this)')}
    <div class="f" style="margin-top:6px"><label>Remind me before</label><select onchange="S.notify.before=+this.value;save()">${[5,10,15,30,60].map(m=>`<option value="${m}" ${+n.before===m?'selected':''}>${m} minutes</option>`).join('')}</select></div>
    ${n.subs.length?`<h3>Devices</h3>${n.subs.map((s,i)=>`<div class="row"><span class="nm">${esc(s.device||'Device')}${pushSub&&pushSub.endpoint===s.endpoint?' <span class="muted">(this one)</span>':''}</span><span class="meta">${new Date(s.at).toLocaleDateString('en-IE',{day:'numeric',month:'short'})}</span><button class="ib" onclick="pushRemove(${i})" title="Remove">×</button></div>`).join('')}`:''}
    <div class="muted" style="margin-top:8px">Worker setup (once): secret <code>VAPID_PRIVATE</code> and a Cron Trigger <code>*/15 * * * *</code>.</div></div>`;
}

// ── TASK BANK (shared card under every calendar view) ──
let bankFilter='all';
function bankCard(){
  const open=S.tasks.filter(t=>!t.done&&(bankFilter==='all'||t.cat===bankFilter));
  const groups=S.cats.filter(c=>bankFilter==='all'||c.id===bankFilter).map(c=>({c,list:open.filter(t=>t.cat===c.id).sort((a,b)=>(a.p||9)-(b.p||9)||((a.due||'9')<(b.due||'9')?-1:1))}));
  const row=t=>`<div class="row handle" data-drag="task:${t.id}"><span class="tick" onclick="toggleTask('${t.id}')"></span><span class="nm" onclick="openTask('${t.id}')">${esc(t.name)}</span>${t.p?`<span class="pb p${t.p}">P${t.p}</span>`:''}${t.day?`<span class="meta" onclick="openDay('${t.day}')">${fmtD(fromKey(t.day),{weekday:'short',day:'numeric'})}${t.time?' '+t.time:''}</span>`:''}${dueChip(t.due)}</div>`;
  return`<div class="card" style="margin-top:14px"><h2>Task bank<small>${open.length} open · drag anything onto a day, an hour or a priority slot</small></h2>
    <div class="tabs"><span class="chip ${bankFilter==='all'?'on':''}" onclick="bankFilter='all';render()">All</span>${S.cats.map(c=>`<span class="chip ${bankFilter===c.id?'on':''}" onclick="bankFilter='${c.id}';render()"><span class="dot" style="background:${c.col}"></span>${esc(c.label)}</span>`).join('')}</div>
    <input placeholder="Add a task to the bank" style="margin-bottom:10px" onkeydown="if(event.key==='Enter'&&this.value.trim()){addTask({name:this.value,cat:bankFilter==='all'?'life':bankFilter});render()}">
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))" data-drop="bank">${groups.map(g=>`<div class="inner"><h3 style="margin-top:0;display:flex;align-items:center;gap:6px"><span class="dot" style="background:${g.c.col}"></span>${esc(g.c.label)}<span class="muted">${g.list.length}</span></h3>${g.list.map(row).join('')||'<div class="empty">Nothing here</div>'}</div>`).join('')}</div>
    <div class="muted" style="margin-top:6px">Drop a task back here to unplan it.</div></div>`;
}
function calSeg(){return`<span class="seg">${['month','week','day'].map(v=>`<button class="${calView===v?'on':''}" onclick="calView='${v}';render()">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</span> `;}
function rCalendar(){return calShell()+(calView==='month'?rMonth():calView==='week'?rWeek():rDay());}

// ── HOME ──
function rHome(){
  const now=new Date(),k=todayKey(),ev=getEvents(k),m=mk(now);
  const hhmm=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const classes=ev.filter(e=>e.type==='class');
  const next=classes.find(c=>c.end>hhmm)||null;
  const wk=monday(now),wkeys=Array.from({length:7},(_,i)=>dk(addDays(wk,i)));
  const due=[];S.modules.forEach(mo=>mo.assessments.filter(a=>!a.done&&wkeys.includes(a.due)).forEach(a=>due.push({k:a.due,t:a.title,sub:mo.code,col:mo.col,open:`openAssess('${mo.id}','${a.id}')`})));
  S.tasks.filter(t=>!t.done&&t.due&&wkeys.includes(t.due)).forEach(t=>due.push({k:t.due,t:t.name,sub:cat(t.cat).label,col:cat(t.cat).col,open:`openTask('${t.id}')`}));
  due.sort((a,b)=>a.k<b.k?-1:1);
  const goal=S.oneGoal&&S.oneGoal.k===k?S.oneGoal:{k,t:'',done:false};
  const sched=calEvents(k),timed=sched.filter(e=>e.time),allday=sched.filter(e=>!e.time);
  const todos=S.tasks.filter(t=>!t.done&&(t.day===k||t.due===k));
  const hs=habits(m),rdk=rd(k);
  const morning=S.routines.morning,night=S.routines.night;
  const across=S.modules.reduce((n,x)=>n+x.sessions.length,0);
  return`<div class="title"><h1>${now.getHours()<12?'Good morning':now.getHours()<18?'Good afternoon':'Good evening'}, Elva</h1><span class="sub">${fmtD(now)}</span></div>
  <div class="grid g3" style="margin-bottom:14px">
    <div class="card"><div class="eyebrow">NEXT CLASS</div>${next?`<div class="serif" style="font-size:18px">${esc(next.title)}</div><div class="muted">${next.time}–${next.end}${next.room?' · '+esc(next.room):''}</div>`:`<div class="serif" style="font-size:18px">${classes.length?'Done for today':'No classes today'}</div><div class="muted">${inTerm(k)?'':'Outside term dates'}</div>`}</div>
    <div class="card"><div class="eyebrow">DUE THIS WEEK</div><div class="big">${due.length}<small>thing${due.length===1?'':'s'}</small></div>${due.slice(0,2).map(d=>`<div class="small" style="margin-top:4px;cursor:pointer" onclick="${d.open}"><span class="dot" style="background:${d.col};display:inline-block;margin-right:6px"></span>${esc(d.t)} · ${daysUntil(d.k)<=0?'today':'in '+daysUntil(d.k)+'d'}</div>`).join('')}</div>
    <div class="card"><div class="eyebrow">CLASSES</div><div class="big">${across}<small>across the week</small></div><div class="small muted" style="margin-top:4px">${classes.length} today · <span class="link" onclick="nav('timetable')">timetable</span></div></div>
  </div>
  ${briefCard(k)}
  <div class="onegoal"><span class="star ${goal.done?'on':''}" onclick="S.oneGoal={k:'${k}',t:${JSON.stringify(goal.t)},done:${!goal.done}};save();render()">★</span><div style="flex:1"><div class="eyebrow" style="margin:0">TODAY'S ONE GOAL</div><input value="${esc(goal.t)}" placeholder="The one thing that makes today a win" oninput="S.oneGoal={k:'${k}',t:this.value,done:${goal.done}};save()" style="${goal.done?'text-decoration:line-through;opacity:.6':''}"></div></div>
  ${dailyCard()}
  <div class="grid g31">
    <div class="card"><h2>The day's schedule<span class="r">${S.acal.on?`<button class="link" onclick="openAcal(null,{day:'${k}'})">Apple event →</button> `:''}<button class="link" onclick="openTask(null,{day:'${k}',due:'${k}'})">Add an event →</button></span></h2>
      <div class="calapp day homeday">${calTimeGrid([new Date()])}</div></div>
    <div class="grid" style="align-content:start">
      <div class="card"><h2>Today<small>tick as you go</small></h2>
        ${morning.map((r,i)=>`<div class="row ${rdk.morning.includes(i)?'done':''}"><span class="tick ${rdk.morning.includes(i)?'on':''}" onclick="toggleRoutine('${k}','morning',${i})">${rdk.morning.includes(i)?'✓':''}</span><span class="nm">${esc(r)}</span><span class="meta">morning</span></div>`).join('')}
        ${todos.map(t=>`<div class="row handle ${t.done?'done':''}" data-drag="task:${t.id}"><span class="tick" onclick="toggleTask('${t.id}')"></span><span class="nm" onclick="openTask('${t.id}')">${esc(t.name)}</span>${t.p?`<span class="pb p${t.p}">P${t.p}</span>`:''}<span class="dot" style="background:${cat(t.cat).col}"></span></div>`).join('')}
        ${hs.map(h=>{const on=(S.habitMarks[k]||[]).includes(h.id);return`<div class="row ${on?'done':''}"><span class="tick ${on?'on':''}" onclick="toggleHabit('${k}','${h.id}')">${on?'✓':''}</span><span class="nm">${esc(h.name)}</span><span class="meta">habit</span></div>`;}).join('')}
        ${night.map((r,i)=>`<div class="row ${rdk.night.includes(i)?'done':''}"><span class="tick ${rdk.night.includes(i)?'on':''}" onclick="toggleRoutine('${k}','night',${i})">${rdk.night.includes(i)?'✓':''}</span><span class="nm">${esc(r)}</span><span class="meta">night</span></div>`).join('')}
        <input placeholder="Add something for today" onkeydown="if(event.key==='Enter'&&this.value.trim()){addTask({name:this.value,day:'${k}',due:'${k}'});render()}"></div>
      ${priHtml(k,'Top 3 today',k)}
    </div>
  </div>`;
}
function quickCapture(){openModal(`<h2>Quick capture</h2><div class="f"><input id="qc-in" placeholder="Task, idea, deadline — anything" onkeydown="if(event.key==='Enter')qcSave()"></div><div class="fr"><div class="f"><label>Area</label>${catSel('life')}</div><div class="f"><label>Day (optional)</label><input type="date" id="qc-day"></div></div><div class="mact"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn sky" onclick="qcSave()">Capture</button></div>`);}
function qcSave(){const v=$('qc-in').value.trim();if(!v)return;const d=$('qc-day').value;addTask({name:v,cat:$('m-cat').value,day:d,due:d});closeModal();render();toast('Captured');}

// ── TIMETABLE ──
const DAYN=['','Mon','Tue','Wed','Thu','Fri'];
function rTimetable(){
  const tk=todayKey(),td=new Date().getDay();
  const showDay=ttView==='day'?ttDay:0;
  let h0=9,h1=18;S.modules.forEach(m=>m.sessions.forEach(s=>{const a=+s.start.slice(0,2),b=+s.end.slice(0,2)+1;if(a<h0)h0=a;if(b>h1)h1=b;}));
  const hours=[];for(let h=h0;h<=h1;h++)hours.push(h);
  const rowH=44;
  const cols=[1,2,3,4,5].map(d=>{
    const blocks=[];S.modules.forEach(m=>m.sessions.filter(s=>s.day===d).forEach(s=>{const a=+s.start.slice(0,2)+(+s.start.slice(3))/60,b=+s.end.slice(0,2)+(+s.end.slice(3))/60;blocks.push(`<div class="blk" style="top:${(a-h0)*rowH+2}px;height:${(b-a)*rowH-4}px;border-left-color:${m.col};background:${m.col}22" onclick="openModule('${m.id}')"><b>${esc(m.name)}</b><span>${s.start}–${s.end}${s.room?' · '+esc(s.room):''}</span></div>`);}));
    return`<div class="dc ${showDay===d||(ttView==='week')?'show':''}">${hours.map(()=>'<div class="line"></div>').join('')}${blocks.join('')}</div>`;
  }).join('');
  const heads=[1,2,3,4,5].map(d=>`<div class="dh ${d===td?'today':''} ${showDay===d||ttView==='week'?'show':''}">${DAYN[d]}</div>`).join('');
  const wk=monday(new Date());
  const freeMsg=inTerm(tk)?'Free blocks this week — drop a study session?':'Outside term dates. Classes show from '+S.term.start+'.';
  return`<div class="title"><h1>Timetable</h1><span class="seg">${['day','week'].map(v=>`<button class="${ttView===v?'on':''}" onclick="ttView='${v}';ttDay=${td>=1&&td<=5?td:1};render()">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</span>${ttView==='day'?`<span class="seg">${[1,2,3,4,5].map(d=>`<button class="${ttDay===d?'on':''}" onclick="ttDay=${d};render()">${DAYN[d]}</button>`).join('')}</span>`:''}<span class="sub">Autumn 2026</span><span class="spacer"></span><button class="pill" onclick="openModule()">+ Class</button></div>
  <div class="card"><div class="ttg"><div></div>${heads}<div>${hours.map(h=>`<div class="hl">${pad(h)}</div>`).join('')}</div>${cols}</div></div>
  <div class="card" style="margin-top:14px;border-left:5px solid #9CC9FF"><span class="small">${freeMsg}</span> <button class="link" onclick="openTask(null,{cat:'study',name:'Study session'})">Add one</button></div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h2>Semester overview<small>${S.modules.length} modules</small></h2>${S.modules.map(m=>`<div class="modc" style="border-left-color:${m.col}" onclick="openModule('${m.id}')"><b>${esc(m.code)} · ${esc(m.name)}</b>${m.sessions.map(s=>`<div class="sess">${DAYN[s.day]} ${s.start}–${s.end}${s.room?' · '+esc(s.room):''}</div>`).join('')}<div class="muted">${m.assessments.length} assessment${m.assessments.length===1?'':'s'}</div></div>`).join('')||'<div class="empty">Add your first class</div>'}</div>
    <div class="card"><h2>Clubs, appointments and everything else<small>this week</small></h2>${Array.from({length:7},(_,i)=>{const d=addDays(wk,i),k=dk(d),ev=getEvents(k).filter(e=>e.type!=='class');return ev.length?`<div class="muted" style="margin-top:6px">${fmtD(d,{weekday:'long'})}</div>${ev.map(e=>evHtml(e,'wev')).join('')}`:'';}).join('')||'<div class="empty">Nothing else this week</div>'}</div>
  </div>`;
}
function openModule(id){
  const m=id?S.modules.find(x=>x.id===id):{code:'',name:'',col:'#2C3E5C',sessions:[],assessments:[]};
  const sess=m.sessions.map((s,i)=>`<div class="row"><select onchange="S.modules.find(x=>x.id==='${id}').sessions[${i}].day=+this.value;save()" style="width:70px">${[1,2,3,4,5].map(d=>`<option value="${d}" ${s.day===d?'selected':''}>${DAYN[d]}</option>`).join('')}</select><input type="time" value="${s.start}" style="width:100px" onchange="S.modules.find(x=>x.id==='${id}').sessions[${i}].start=this.value;save()"><input type="time" value="${s.end}" style="width:100px" onchange="S.modules.find(x=>x.id==='${id}').sessions[${i}].end=this.value;save()"><input value="${esc(s.room)}" placeholder="Room" onchange="S.modules.find(x=>x.id==='${id}').sessions[${i}].room=this.value;save()"><button class="ib" onclick="S.modules.find(x=>x.id==='${id}').sessions.splice(${i},1);save();openModule('${id}')">×</button></div>`).join('');
  openModal(`<h2>${id?'Edit class':'New class'}</h2>
  <div class="fr"><div class="f"><label>Module code</label><input id="mo-code" value="${esc(m.code)}"></div><div class="f"><label>Colour</label><input type="color" id="mo-col" value="${m.col}" style="height:38px;padding:2px"></div></div>
  <div class="f"><label>Name</label><input id="mo-name" value="${esc(m.name)}"></div>
  ${id?`<h3>Sessions</h3>${sess||'<div class="muted">No sessions yet</div>'}<button class="btn ghost sm" style="margin-top:6px" onclick="S.modules.find(x=>x.id==='${id}').sessions.push({day:3,start:'10:00',end:'10:50',room:''});save();openModule('${id}')">+ Session</button>`:'<div class="muted">Save first, then add sessions and assessments.</div>'}
  <div class="mact">${id?`<button class="btn danger sm" onclick="if(confirm('Delete this module and its assessments?')){S.modules=S.modules.filter(x=>x.id!=='${id}');save();closeModal();render()}">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn sky" onclick="saveModule('${id||''}')">Save</button></div>`);
}
function saveModule(id){const code=$('mo-code').value.trim(),name=$('mo-name').value.trim(),col=$('mo-col').value;if(!name){toast('Give it a name');return;}
  if(id){const m=S.modules.find(x=>x.id===id);Object.assign(m,{code,name,col});save();closeModal();render();}else{const m={id:uid(),code,name,col,sessions:[],assessments:[]};S.modules.push(m);save();openModule(m.id);}}

// ── ASSIGNMENTS ──
function rAssignments(){
  const all=[];S.modules.forEach(m=>m.assessments.forEach(a=>all.push({a,m})));
  const open=all.filter(x=>!x.a.done).sort((x,y)=>(x.a.due||'9')<(y.a.due||'9')?-1:1),done=all.filter(x=>x.a.done);
  const row=({a,m})=>`<tr><td><span class="tick ${a.done?'on':''}" onclick="toggleAssess('${m.id}','${a.id}')">${a.done?'✓':''}</span></td><td onclick="openAssess('${m.id}','${a.id}')" style="cursor:pointer"><b>${esc(a.title)}</b><div class="muted">${esc(m.code)} · ${esc(m.name)}</div></td><td>${a.weight?a.weight+'%':'—'}</td><td>${a.due?fmtD(fromKey(a.due),{day:'numeric',month:'short'}):'—'} ${a.done?'':dueChip(a.due)}</td><td>${a.grade!==undefined&&a.grade!==''?a.grade+'%':''}</td></tr>`;
  return`<div class="title"><h1>Assignments</h1><span class="sub">${open.length} open</span><span class="spacer"></span><button class="pill" onclick="openAssess()">+ Assignment</button></div>
  <div class="card"><table class="tbl"><tr><th></th><th>Assignment</th><th>Weight</th><th>Due</th><th>Grade</th></tr>${open.map(row).join('')||'<tr><td colspan="5" class="empty">Nothing due. Add your assessments so deadlines land on the calendar.</td></tr>'}</table></div>
  ${done.length?`<div class="card" style="margin-top:14px"><h2>Submitted</h2><table class="tbl">${done.map(row).join('')}</table></div>`:''}
  <div class="card" style="margin-top:14px"><h2>Grades<small>weighted so far</small></h2><table class="tbl"><tr><th>Module</th><th>Graded weight</th><th>Running average</th></tr>${S.modules.map(m=>{const g=m.assessments.filter(a=>a.grade!==undefined&&a.grade!=='');const w=g.reduce((n,a)=>n+(+a.weight||0),0);const avg=w?g.reduce((n,a)=>n+(+a.grade)*(+a.weight||0),0)/w:null;return`<tr><td><span class="dot" style="background:${m.col};display:inline-block;margin-right:6px"></span>${esc(m.name)}</td><td>${w}%</td><td>${avg===null?'—':avg.toFixed(1)+'%'}</td></tr>`;}).join('')}</table></div>`;
}
function openAssess(mid,aid){
  const m=mid?S.modules.find(x=>x.id===mid):null,a=m&&aid?m.assessments.find(x=>x.id===aid):{title:'',due:'',weight:'',grade:'',note:''};
  openModal(`<h2>${aid?'Edit assignment':'New assignment'}</h2>
  <div class="f"><label>Module</label><select id="as-mod">${S.modules.map(x=>`<option value="${x.id}" ${m&&m.id===x.id?'selected':''}>${esc(x.code)} ${esc(x.name)}</option>`).join('')}</select></div>

function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tasks||!d.cats)throw 0;if(!confirm('Replace everything with this backup?'))return;S=Object.assign(DEF(),d);save();render();toast('Restored');}catch(e){toast('That file is not a Hub backup');}};r.readAsText(f);}
async function importOld(){
  try{const r=await fetch(`${SUPABASE_URL}/rest/v1/hub_state?id=eq.main&select=tasks,completed_log,week_tasks`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});const rows=await r.json();const d=rows[0];if(!d||!d.tasks){toast('Nothing found in the old Hub');return;}
    const map={personal:'life',college:'study',darcybow:'suede',gym:'life'};let n=0;
    d.tasks.filter(t=>t.cat!=='work'&&!t.done&&!S.tasks.some(x=>x.name===t.name)).forEach(t=>{addTask({name:t.name,cat:map[t.cat]||'life',due:t.due||'',p:t.priority||0});n++;});

}

function hubContext(){
  const k=todayKey(),now=new Date(),wk=monday(now),wkeys=Array.from({length:7},(_,i)=>dk(addDays(wk,i)));
  const L=[];
  L.push(`Today is ${fmtD(now)} ${k}, ${pad(now.getHours())}:${pad(now.getMinutes())}.`);
  const ev=getEvents(k);L.push(`Today's calendar: ${ev.length?ev.map(e=>`${e.time||'all-day'} ${e.title}${e.type==='class'?' (class'+(e.room?', '+e.room:'')+')':e.type==='assess'?' (deadline)':''}${e.done?' [done]':''}`).join('; '):'nothing'}.`);
  const tp=pri(k).map((id,i)=>id&&task(id)?`${i+1}. ${task(id).name}${task(id).done?' [done]':''}`:null).filter(Boolean);L.push(`Top 3 today: ${tp.join(' | ')||'not set'}.`);
  const wp=pri('W:'+dk(wk)).map((id,i)=>id&&task(id)?`${i+1}. ${task(id).name}`:null).filter(Boolean);L.push(`Priorities this week: ${wp.join(' | ')||'not set'}.`);

  <div class="f"><label>Title</label><input id="ae-title" value="${esc(e.title)}" ${locked?'disabled':''} onkeydown="if(event.key==='Enter')acalSaveForm('${id||''}')"></div>
  <div class="fr"><div class="f"><label>Day</label><input type="date" id="ae-day" value="${e.day}" ${locked?'disabled':''}></div><div class="f"><label>All day</label><select id="ae-all" ${locked?'disabled':''} onchange="$('ae-times').style.display=this.value==='1'?'none':'flex'"><option value="0" ${e.allDay?'':'selected'}>No</option><option value="1" ${e.allDay?'selected':''}>Yes</option></select></div></div>
  <div class="fr" id="ae-times" style="${e.allDay?'display:none':''}"><div class="f"><label>Start</label><input type="time" id="ae-start" value="${e.time}" ${locked?'disabled':''}></div><div class="f"><label>End</label><input type="time" id="ae-end" value="${e.endTime}" ${locked?'disabled':''}></div></div>
  <div class="fr">${id?'':`<div class="f"><label>Calendar</label>${acalCalSel(e.cal)}</div>`}<div class="f"><label>Location</label><input id="ae-loc" value="${esc(e.location)}" ${locked?'disabled':''}></div></div>
  ${id?'':`<div class="muted" style="margin-top:2px"><span class="link" onclick="closeModal();openTask(null,{day:$('ae-day').value||'${e.day}',due:'${e.day}',time:''})">Make it a Hub task instead</span></div>`}
  <div class="mact">${id&&!locked?`<button class="btn danger sm" onclick="acalDelete('${id}')">Delete</button>`:''}<button class="btn ghost" onclick="closeModal()">${locked?'Close':'Cancel'}</button>${locked?'':`<button class="btn sky" onclick="acalSaveForm('${id||''}')">Save</button>`}</div>`);
}
function acalSaveForm(id){
  const all=$('ae-all').value==='1',o={title:$('ae-title').value.trim(),day:$('ae-day').value,allDay:all,time:all?'':$('ae-start').value,endTime:all?'':$('ae-end').value,location:$('ae-loc').value.trim(),cal:$('ae-cal')?$('ae-cal').value:''};
  if(!o.title){toast('Give it a title');return;}if(!o.day){toast('Pick a day');return;}if(!all&&!o.time){toast('Pick a start time');return;}
  closeModal();acalSave(id,o).catch(e=>toast(e.message));
}
// o: {title, day, time, endTime, allDay, location, cal}. Returns {href}.
async function acalSave(id,o){
  const old=id?acalEvents.find(x=>x.id===id):null;
  let start,end;
  if(o.allDay||!o.time){start=o.day;const span=old&&old.allDay?Math.round((fromKey(old.endDay)-fromKey(old.day))/864e5):0;end=dk(addDays(fromKey(o.day),span+1));}
  else{const s=new Date(`${o.day}T${o.time}`);let e=o.endTime?new Date(`${o.day}T${o.endTime}`):new Date(s.getTime()+36e5);if(e<=s)e=new Date(s.getTime()+36e5);start=s.toISOString();end=e.toISOString();}
  const body={title:o.title,start,end,allDay:!!(o.allDay||!o.time),location:o.location||''};
  const r=old?await acalApi('update',{href:old.href,...body}):await acalApi('create',{cal:o.cal||S.acal.def,...body});
  toast(old?'Updated in Apple Calendar':'Added to Apple Calendar');
  acalSync(true);
  return r;
}
async function acalDelete(id){
  const e=acalEvents.find(x=>x.id===id);if(!e||!confirm(`Delete "${e.title}" from Apple Calendar?`))return;
  closeModal();
  try{await acalApi('delete',{href:e.href});acalEvents=acalEvents.filter(x=>x.id!==id);render();toast('Deleted from Apple Calendar');acalSync(true);}catch(err){toast(err.message);}
}
async function taskToAcal(id){
  const t=task(id);if(!t)return;if(!t.day){toast('Give the task a planned day first');return;}
  const o={title:t.name,day:t.day,time:t.time||'',allDay:!t.time,location:''};
  try{
    let r;
    if(t.acal){r=await acalApi('update',{href:t.acal.href,title:o.title,...acalTimes(o)});toast('Updated in Apple Calendar');}
    else{r=await acalApi('create',{cal:S.acal.def,title:o.title,...acalTimes(o)});toast('Sent to Apple Calendar');}
    t.acal={href:r.href};save();closeModal();render();acalSync(true);
  }catch(e){toast(e.message);}
}
function acalTimes(o){if(o.allDay)return{allDay:true,start:o.day,end:dk(addDays(fromKey(o.day),1))};const s=new Date(`${o.day}T${o.time}`);return{allDay:false,start:s.toISOString(),end:new Date(s.getTime()+36e5).toISOString()};}
function acalSettings(){
  const ok=S.acal.on;
  return`<div class="card"><h2>Apple Calendar<small>${ok?'connected · two-way':'not connected'}</small></h2>
    <div class="muted" style="margin-bottom:8px">Your iCloud calendars, through the same Cloudflare Worker as Claude. Events show on every calendar view; add, move and delete them from the Hub.</div>
    ${ok?`<h3>Show these calendars</h3>${S.acal.cals.map((c,i)=>`<div class="row"><span class="tick ${c.on?'on':''}" onclick="S.acal.cals[${i}].on=!S.acal.cals[${i}].on;save();acalSync(true);render()">${c.on?'✓':''}</span><span class="dot" style="background:${c.col}"></span><span class="nm">${esc(c.name)}</span>${c.readOnly?'<span class="meta">read-only</span>':''}</div>`).join('')||'<div class="empty">No calendars found</div>'}
      <div class="f" style="margin-top:8px"><label>New events go to</label><select onchange="S.acal.def=this.value;save()">${S.acal.cals.filter(c=>!c.readOnly).map(c=>`<option value="${esc(c.url)}" ${c.url===S.acal.def?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:''}
    <div class="mact" style="margin:0"><button class="btn ${ok?'ghost':'sky'}" onclick="${ok?'acalDisconnect()':'acalConnect()'}">${ok?'Disconnect':'Connect'}</button>${ok?'<button class="btn ghost" onclick="acalConnect()">Refresh calendars</button><button class="btn ghost" onclick="acalSync()">Sync now</button>':''}</div>
    ${ok?`<div class="muted" style="margin-top:8px">${acalEvents.length} events loaded${acalSync.at?' · synced '+new Date(acalSync.at).toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'}):''}</div>`:`<div class="muted" style="margin-top:8px">Needs <code>ICLOUD_USER</code> and <code>ICLOUD_APP_PASSWORD</code> on the Worker, and the Worker URL + token filled in under Claude.</div>`}</div>`;
}

// ── LOCK + INIT ──
function unlock(){if($('lockIn').value===PASSWORD){sessionStorage.setItem('elva_unlocked','1');$('lock').style.display='none';}else{$('lockErr').style.display='block';}}
(async function init(){
  if(sessionStorage.getItem('elva_unlocked'))$('lock').style.display='none';
  await load();
  nav('home');
  if(S.gcal)gcalSync();
  pushInit();
  if(!dailyFor(todayKey()))dailyGen(false);
  if(S.acal.on){acalSync(true);setInterval(()=>acalSync(true),10*60e3);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-(acalSync.at||0)>3*60e3)acalSync(true);});}
})();
</script>
</body>
</html>
