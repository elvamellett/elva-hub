  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px solid rgba(0,0,0,.08)}\n.sw .lab{flex:1;padding:12px 10px 15px}\n.sw .lab i{display:block;font-style:normal;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid)}\n.sw .lab b{display:block;font-weight:500;font-size:12.5px;margin-top:5px}\n.sw .lab span{display:block;font-family:var(--long);font-size:11px;color:var(--mid);margin-top:2px}\n.ratio{display:flex;height:36px;margin:20px 0 12px;border:1px solid var(--line)}\n.note{background:var(--card);border:1px solid var(--line);padding:24px 26px;margin:26px 0;font-size:15px}\n.note b{font-weight:500}\n.dark{background:var(--deep);color:var(--paper);padding:34px 36px;margin:26px 0}\n.dark .eyebrow{color:var(--accent2)}\n.dark p{color:rgba(244,242,233,.78);margin-bottom:0}\n.dark h3{color:var(--paper);margin-top:0}\n@media print{body{font-size:12pt}section{break-inside:avoid}pre{white-space:pre-wrap}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"wrap\">\n\n<header>\n<div class=\"eyebrow\">Rego Property · Brand pack<\u002Fdiv>\n<h1 style=\"margin-top:22px\">Olive.<\u002Fh1>\n<p style=\"margin-top:26px;font-size:18px;max-width:56ch\">Deep olive, chalk and the gold from the existing logo. Restrained, warm, square-cornered, no shadows. It should read as a restoration practice and a property owner, not as a developer's sales site.<\u002Fp>\n<div class=\"meta\">\n<div><b>Chosen route<\u002Fb><span>Olive — Route B<\u002Fspan><\u002Fdiv>\n<div><b>Supersedes<\u002Fb><span>Harbour / navy build<\u002Fspan><\u002Fdiv>\n<div><b>Applies to<\u002Fb><span>Site, brochures, boards, signatures<\u002Fspan><\u002Fdiv>\n<div><b>Date<\u002Fb><span>August 2026<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin-top:32px;font-size:14.5px;color:var(--mid)\">This document is the single source of truth. Anything that contradicts it — an older hex in a stylesheet, a heading set in Bodoni — is out of date and should be changed to match. The gold is unchanged and non-negotiable: it is sampled from the existing logo, which makes this a new ground under an existing mark, not a rebrand.<\u002Fp>\n<\u002Fheader>\n\n<section>\n<div class=\"num\"><i>01<\u002Fi><h2>Colour<\u002Fh2><\u002Fdiv>\n<p>Paste this block over the existing <code>:root<\u002Fcode>. Role names are stable; only the hexes belong to this route.<\u002Fp>\n<pre>:root{\n  --paper:#F4F2E9;    <b>/* page ground — chalk */<\u002Fb>\n  --card:#FBF9F2;     <b>/* cards, modals, solid nav bar — paper */<\u002Fb>\n  --stone:#E5E1D2;    <b>/* section fills, image placeholders — linen */<\u002Fb>\n  --line:#D5D0BE;     <b>/* hairlines, dividers, borders — rule */<\u002Fb>\n  --mid:#6B7261;      <b>/* secondary text, meta, captions — lichen */<\u002Fb>\n  --ink:#3F4733;      <b>/* primary — olive. All body and display text */<\u002Fb>\n  --deep:#2A3123;     <b>/* dark sections, cover scrim — bay */<\u002Fb>\n  --bark:#453E33;     <b>/* warm dark — footer, photographic overlays */<\u002Fb>\n  --accent:#CAA669;   <b>/* brand gold. Lines, states, the mark. Never a fill */<\u002Fb>\n  --accent2:#DCC9A0;  <b>/* champagne — gold's stand-in on dark grounds */<\u002Fb>\n}<\u002Fpre>\n\n<div class=\"sw\">\n<div><div class=\"chip\" style=\"background:#F4F2E9\"><\u002Fdiv><div class=\"lab\"><i>Ground<\u002Fi><b>Chalk<\u002Fb><span>#F4F2E9<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"chip\" style=\"background:#FBF9F2\"><\u002Fdiv><div class=\"lab\"><i>Cards<\u002Fi><b>Paper<\u002Fb><span>#FBF9F2<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"chip\" style=\"background:#E5E1D2\"><\u002Fdiv><div class=\"lab\"><i>Fills<\u002Fi><b>Linen<\u002Fb><span>#E5E1D2<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"chip\" style=\"background:#D5D0BE\"><\u002Fdiv><div class=\"lab\"><i>Hairlines<\u002Fi><b>Rule<\u002Fb><span>#D5D0BE<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"chip\" style=\"background:#6B7261\"><\u002Fdiv><div class=\"lab\"><i>2nd text<\u002Fi><b>Lichen<\u002Fb><span>#6B7261<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"chip\" style=\"background:#3F4733\"><\u002Fdiv><div class=\"lab\"><i>Primary<\u002Fi><b>Olive<\u002Fb><span>#3F4733<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"chip\" style=\"background:#2A3123\"><\u002Fdiv><div class=\"lab\"><i>Dark<\u002Fi><b>Bay<\u002Fb><span>#2A3123<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"chip\" style=\"background:#453E33\"><\u002Fdiv><div class=\"lab\"><i>Warm dark<\u002Fi><b>Bark<\u002Fb><span>#453E33<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"chip\" style=\"background:#CAA669\"><\u002Fdiv><div class=\"lab\"><i>Accent<\u002Fi><b>Gold<\u002Fb><span>#CAA669<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div class=\"chip\" style=\"background:#DCC9A0\"><\u002Fdiv><div class=\"lab\"><i>Accent 2<\u002Fi><b>Champagne<\u002Fb><span>#DCC9A0<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<table>\n<tbody><tr><th>Role<\u002Fth><th>Name<\u002Fth><th class=\"mono\">Hex<\u002Fth><th>Where it goes<\u002Fth><\u002Ftr>\n<tr><td>Page ground<\u002Ftd><td>Chalk<\u002Ftd><td class=\"mono\">#F4F2E9<\u002Ftd><td>Every page background<\u002Ftd><\u002Ftr>\n<tr><td>Cards<\u002Ftd><td>Paper<\u002Ftd><td class=\"mono\">#FBF9F2<\u002Ftd><td>Cards, modals, solid nav bar, form fields<\u002Ftd><\u002Ftr>\n<tr><td>Fills<\u002Ftd><td>Linen<\u002Ftd><td class=\"mono\">#E5E1D2<\u002Ftd><td>Alternating sections, image placeholders<\u002Ftd><\u002Ftr>\n<tr><td>Hairlines<\u002Ftd><td>Rule<\u002Ftd><td class=\"mono\">#D5D0BE<\u002Ftd><td>All 1px borders and dividers<\u002Ftd><\u002Ftr>\n<tr><td>Secondary text<\u002Ftd><td>Lichen<\u002Ftd><td class=\"mono\">#6B7261<\u002Ftd><td>Locations, dates, captions, form hints<\u002Ftd><\u002Ftr>\n<tr><td>Primary<\u002Ftd><td>Olive<\u002Ftd><td class=\"mono\">#3F4733<\u002Ftd><td>Body copy, headings, buttons, chips, icons<\u002Ftd><\u002Ftr>\n<tr><td>Dark<\u002Ftd><td>Bay<\u002Ftd><td class=\"mono\">#2A3123<\u002Ftd><td>Dark sections, cover gradient, lightbox<\u002Ftd><\u002Ftr>\n<tr><td>Warm dark<\u002Ftd><td>Bark<\u002Ftd><td class=\"mono\">#453E33<\u002Ftd><td>Footer, image overlays, brochure covers<\u002Ftd><\u002Ftr>\n<tr><td>Accent<\u002Ftd><td>Brand gold<\u002Ftd><td class=\"mono\">#CAA669<\u002Ftd><td>Logo, underlines, hover rules, active state, focus ring<\u002Ftd><\u002Ftr>\n<tr><td>Accent 2<\u002Ftd><td>Champagne<\u002Ftd><td class=\"mono\">#DCC9A0<\u002Ftd><td>Small caps and rules <b>on Bay only<\u002Fb><\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h3>Ratio<\u002Fh3>\n<div class=\"ratio\">\n<div style=\"width:70%;background:#F4F2E9\"><\u002Fdiv>\n<div style=\"width:18%;background:#3F4733\"><\u002Fdiv>\n<div style=\"width:8%;background:#E5E1D2\"><\u002Fdiv>\n<div style=\"width:4%;background:#CAA669\"><\u002Fdiv>\n<\u002Fdiv>\n<p><b style=\"font-weight:500\">70% chalk · 18% olive · 8% linen · 4% gold.<\u002Fb> Gold never exceeds a twentieth of a page. If a page feels unfinished, it needs a photograph, not more gold.<\u002Fp>\n\n<h3>Contrast — measured, indicative<\u002Fh3>\n<table>\n<tbody><tr><th>Pair<\u002Fth><th class=\"mono\">Ratio<\u002Fth><th>Verdict<\u002Fth><\u002Ftr>\n<tr><td>Olive on chalk<\u002Ftd><td class=\"mono\">9.6:1<\u002Ftd><td>Pass, all sizes<\u002Ftd><\u002Ftr>\n<tr><td>Lichen on chalk<\u002Ftd><td class=\"mono\">4.6:1<\u002Ftd><td>Pass for body and above; do not go paler<\u002Ftd><\u002Ftr>\n<tr><td>Chalk on bay<\u002Ftd><td class=\"mono\">12.9:1<\u002Ftd><td>Pass<\u002Ftd><\u002Ftr>\n<tr><td>Champagne on bay<\u002Ftd><td class=\"mono\">7.9:1<\u002Ftd><td>Pass — use for small caps on dark<\u002Ftd><\u002Ftr>\n<tr><td>Chalk on bark<\u002Ftd><td class=\"mono\">9.6:1<\u002Ftd><td>Pass<\u002Ftd><\u002Ftr>\n<tr><td>Champagne on bark<\u002Ftd><td class=\"mono\">6.7:1<\u002Ftd><td>Pass<\u002Ftd><\u002Ftr>\n<tr><td>Gold on bark<\u002Ftd><td class=\"mono\">4.6:1<\u002Ftd><td>Pass at 18px+ and for rules; not for body<\u002Ftd><\u002Ftr>\n<tr><td>Gold on chalk<\u002Ftd><td class=\"mono\">2.0:1<\u002Ftd><td><b style=\"font-weight:500\">Fail<\u002Fb> — decorative only. Never text under 18px<\u002Ftd><\u002Ftr>\n<tr><td>Gold on bay<\u002Ftd><td class=\"mono\">7.9:1<\u002Ftd><td>Pass<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h3>Never<\u002Fh3>\n<ul>\n<li>Pure black <code>#000<\u002Fcode> or pure white <code>#FFF<\u002Fcode>. Grounds are chalk or paper; text is olive.<\u002Fli>\n<li>Gold as a background behind text, or as a button fill.<\u002Fli>\n<li>Gold on gold, gold on champagne.<\u002Fli>\n<li>A mid-green anywhere. Olive is near-black; the moment it lightens it reads municipal.<\u002Fli>\n<li>Any colour not in the ten above. No red error states — use olive with a champagne rule.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section>\n<div class=\"num\"><i>02<\u002Fi><h2>Type<\u002Fh2><\u002Fdiv>\n<pre>&lt;link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"&gt;\n&lt;link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin&gt;\n&lt;link href=\"https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Jost:wght@300;400;500&amp;family=Archivo:wght@400;500;600&amp;display=swap\" rel=\"stylesheet\"&gt;<\u002Fpre>\n<pre>:root{\n  --disp:'Instrument Serif',Didot,Georgia,serif; --dispw:400; --dispt:-.005em;\n  --body:Jost,'Helvetica Neue',sans-serif;\n  --long:Archivo,sans-serif;   <b>/* tables and any block over ~400 words */<\u002Fb>\n  --label:Jost,sans-serif; --capt:.2em;\n}<\u002Fpre>\n<table>\n<tbody><tr><th>Role<\u002Fth><th>Face<\u002Fth><th>Weight<\u002Fth><th>Notes<\u002Fth><\u002Ftr>\n<tr><td>Display<\u002Ftd><td>Instrument Serif<\u002Ftd><td>400 — the only weight<\u002Ftd><td>Headings, scheme names, pull quotes. Tracking −0.005em. Italic for pull quotes and sub-heads, sparingly<\u002Ftd><\u002Ftr>\n<tr><td>Body<\u002Ftd><td>Jost<\u002Ftd><td>400, 500<\u002Ftd><td>Body copy, navigation, buttons<\u002Ftd><\u002Ftr>\n<tr><td>Long-form / tables<\u002Ftd><td>Archivo<\u002Ftd><td>400, 500, 600<\u002Ftd><td>Accommodation schedules, legal, anything dense — Jost's round forms tire at length<\u002Ftd><\u002Ftr>\n<tr><td>Labels<\u002Ftd><td>Jost<\u002Ftd><td>500<\u002Ftd><td>10.5–12px, uppercase, 0.18–0.24em tracking<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<div class=\"note\"><b>Instrument Serif has one weight.<\u002Fb> Do not fake bold, do not apply <code>font-weight:600<\u002Fcode> to it, and do not use it below 21px — it thins out. Anything smaller that needs emphasis goes to Jost 500 caps. All three faces are Google Fonts under the Open Font Licence: free, self-hostable, no licence cost.<\u002Fdiv>\n<h3>Scale — unchanged from the current build<\u002Fh3>\n<table>\n<tbody><tr><th>Class<\u002Fth><th class=\"mono\">Size<\u002Fth><th>Line height<\u002Fth><th>Use<\u002Fth><\u002Ftr>\n<tr><td class=\"mono\">.d1<\u002Ftd><td class=\"mono\">clamp(42px, 8vw, 116px)<\u002Ftd><td class=\"mono\">1.02<\u002Ftd><td>Cover, page titles<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">.d2<\u002Ftd><td class=\"mono\">clamp(32px, 5.2vw, 72px)<\u002Ftd><td class=\"mono\">1.06<\u002Ftd><td>Section headings, scheme titles<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">.d3<\u002Ftd><td class=\"mono\">clamp(26px, 3.4vw, 46px)<\u002Ftd><td class=\"mono\">1.14<\u002Ftd><td>Sub-heads, quotes<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">.d4<\u002Ftd><td class=\"mono\">clamp(21px, 2.4vw, 30px)<\u002Ftd><td class=\"mono\">1.20<\u002Ftd><td>Director names, table headings<\u002Ftd><\u002Ftr>\n<tr><td>body<\u002Ftd><td class=\"mono\">16px<\u002Ftd><td class=\"mono\">1.68<\u002Ftd><td>All copy, max 60 characters per line<\u002Ftd><\u002Ftr>\n<tr><td>label<\u002Ftd><td class=\"mono\">10.5–12px<\u002Ftd><td class=\"mono\">1.2<\u002Ftd><td>Uppercase, tracked<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<\u002Fsection>\n\n<section>\n<div class=\"num\"><i>03<\u002Fi><h2>Surfaces and components<\u002Fh2><\u002Fdiv>\n<ul>\n<li><b style=\"font-weight:500\">Square corners everywhere.<\u002Fb> No border-radius on cards, images, buttons, chips, inputs or tags. Rounded corners turn this into a SaaS product.<\u002Fli>\n<li><b style=\"font-weight:500\">No shadows.<\u002Fb> Depth comes from ground shifts — chalk → linen → bay — and 1px hairlines. One border weight only: 1px <code>#D5D0BE<\u002Fcode>.<\u002Fli>\n<li><b style=\"font-weight:500\">Maximum two grounds per screen<\u002Fb> plus one dark section. Never place two dark sections adjacent, and never Bay directly above Bark — they are close enough to read as a printing error.<\u002Fli>\n<li><b style=\"font-weight:500\">Bay vs Bark.<\u002Fb> Bay is the cool, olive-family dark — typographic sections where the words carry the page. Bark is the warm dark, closer to the timber and stone in the photography — the footer, scrims over images, brochure covers. One of the two per page, not both.<\u002Fli>\n<li><b style=\"font-weight:500\">Buttons.<\u002Fb> Primary: olive fill, chalk text, 15px/27px padding, Jost 500 caps at 11px, 0.18em tracking. Secondary: 1px olive outline, olive text, transparent. No third button style. Hover: primary darkens to bay; secondary fills olive.<\u002Fli>\n<li><b style=\"font-weight:500\">Text links.<\u002Fb> Olive with a 1px gold underline, 4px below the baseline. Hover moves the underline to olive.<\u002Fli>\n<li><b style=\"font-weight:500\">Chips and filters.<\u002Fb> 1px rule border, olive text, chalk ground. Active: olive fill, chalk text.<\u002Fli>\n<li><b style=\"font-weight:500\">Cards.<\u002Fb> Paper ground, 1px rule border, image at 4:3, name in Jost 500 caps under a hairline, location in lichen below.<\u002Fli>\n<li><b style=\"font-weight:500\">Tags on images.<\u002Fb> Chalk ground with olive text for passive states — \"Completed\"; olive ground with chalk text for active — \"In construction\".<\u002Fli>\n<li><b style=\"font-weight:500\">Forms.<\u002Fb> Paper field, 1px rule border, label in Jost 500 caps above. Focus: 1px gold outline at 4px offset.<\u002Fli>\n<\u002Ful>\n<div class=\"dark\" style=\"background:#453E33\">\n<div class=\"eyebrow\">Dark sections<\u002Fdiv>\n<h3 style=\"font-family:var(--disp);font-size:30px;font-weight:400;margin:16px 0 12px\">Bark, shown here. Bay behaves the same way.<\u002Fh3>\n<p>Chalk text at 100%, secondary text at 72% opacity, champagne for small caps and rules. Brand gold still works for the logo and large rules here, but small text on dark goes to champagne — it clears 4.5:1 where the gold is marginal.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section>\n<div class=\"num\"><i>04<\u002Fi><h2>Motion and states<\u002Fh2><\u002Fdiv>\n<ul>\n<li>Hover <b style=\"font-weight:500\">moves or reveals<\u002Fb> — it does not recolour wholesale. List rows shift 16px right; card images scale to 1.045; nav underlines wipe in from the left.<\u002Fli>\n<li>Duration 280–450ms, <code>cubic-bezier(.16,.84,.32,1)<\u002Fcode>. Nothing bounces, nothing springs.<\u002Fli>\n<li>Focus ring: 1px <code>#CAA669<\u002Fcode> outline, 4px offset. Always visible on keyboard.<\u002Fli>\n<li><code>prefers-reduced-motion: reduce<\u002Fcode> disables all of it, including the parallax and the pinned scroll scene.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section>\n<div class=\"num\"><i>05<\u002Fi><h2>Voice<\u002Fh2><\u002Fdiv>\n<p>Ported unchanged from the current site — the copy was right, only the colour changes.<\u002Fp>\n<ul>\n<li>No figures. No GDV, no unit counts, no \"17 developments\" as a statistic. Numbers survive only where they sit inside the client's own body copy.<\u002Fli>\n<li>Sentence case for buttons and menus. Wide-tracked caps for labels only.<\u002Fli>\n<li>No exclamation marks. No emoji anywhere, ever.<\u002Fli>\n<li>Locations are bare: \"Hove\", \"Eastbourne\", \"Brighton &amp; Hove\".<\u002Fli>\n<li>Status reads \"Completed 2021 · Hove\", not \"Completed in 2021\".<\u002Fli>\n<li>Alt text describes the building, not the brand.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section>\n<div class=\"num\"><i>06<\u002Fi><h2>Migration from the Harbour build<\u002Fh2><\u002Fdiv>\n<p>Direct token swap in <code>rego-site-final.html<\u002Fcode>. Nothing structural changes.<\u002Fp>\n<table>\n<tbody><tr><th class=\"mono\">Old<\u002Fth><th class=\"mono\">New<\u002Fth><\u002Ftr>\n<tr><td class=\"mono\">--paper:#F3EFE5<\u002Ftd><td class=\"mono\">--paper:#F4F2E9<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">--ink:#16283C<\u002Ftd><td class=\"mono\">--ink:#3F4733<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">--deep:#453E33<\u002Ftd><td class=\"mono\">--deep:#2A3123<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">--mid:#5F6B78<\u002Ftd><td class=\"mono\">--mid:#6B7261<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">--stone:#E4E0D6<\u002Ftd><td class=\"mono\">--stone:#E5E1D2<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">--accent:#CAA669<\u002Ftd><td class=\"mono\">unchanged<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">--accent2:#A8823F<\u002Ftd><td class=\"mono\">--accent2:#DCC9A0<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">—<\u002Ftd><td class=\"mono\">--bark:#453E33 — new; the espresso from the Harbour build, kept<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">--disp:'Bodoni Moda'…<\u002Ftd><td class=\"mono\">--disp:'Instrument Serif',Didot,Georgia,serif<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">--dispw:600<\u002Ftd><td class=\"mono\">--dispw:400<\u002Ftd><\u002Ftr>\n<tr><td class=\"mono\">--body:Archivo<\u002Ftd><td class=\"mono\">--body:Jost<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<h3>Then, by hand<\u002Fh3>\n<ol>\n<li>Swap the Google Fonts <code>&lt;link&gt;<\u002Fcode> for the one in section 02.<\u002Fli>\n<li>Search for hardcoded <code>rgba(0,0,0,…)<\u002Fcode> borders — there are several — and replace with <code>#D5D0BE<\u002Fcode>, or <code>rgba(63,71,51,.24)<\u002Fcode> where a tint of the primary is wanted.<\u002Fli>\n<li>Search for <code>rgba(20,20,16,…)<\u002Fcode> in the cover gradient and lightbox; retone to <code>rgba(42,49,35,…)<\u002Fcode>.<\u002Fli>\n<li>Check every display element for <code>font-weight:600<\u002Fcode> inherited from the Bodoni setting and drop it to 400.<\u002Fli>\n<li>Anything display-set below 21px moves to Jost 500 caps.<\u002Fli>\n<li>The logo is currently a PNG with white and gold variants. The white version still works on Bay. Request the vector before launch.<\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<section>\n<div class=\"num\"><i>07<\u002Fi><h2>Print<\u002Fh2><\u002Fdiv>\n<ul>\n<li>Specify a Pantone match for Olive rather than passing <code>#3F4733<\u002Fcode> around — it drifts grey on uncoated stock. Nearest starting points to proof: Pantone 5535 C / 5605 C.<\u002Fli>\n<li>Match the gold to the logo file once the vector arrives, not to this document.<\u002Fli>\n<li>Bay and Bark are the only permitted darks for print; Bark is the safer of the two on uncoated. Do not print anything in near-black.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section>\n<div class=\"num\"><i>08<\u002Fi><h2>Still outstanding<\u002Fh2><\u002Fdiv>\n<p>Unchanged from the handover: vector logo · full-resolution image library · brochure PDFs · copy for the 14 remaining schemes · enquiry form destination and privacy notice · hosting and domain access.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
